<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeadForge — Sign in</title>
<style>
  :root {
    --bg: #0a0a0a;
    --card: #141414;
    --border: #222;
    --input-bg: #1a1a1a;
    --accent: #4f9cff;
    --text: #fafafa;
    --muted: #777;
    --error: #ff5d5d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
               font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .brand { text-align: center; margin-bottom: 24px; }
  .brand .mark { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  .brand .mark span { color: var(--accent); }
  .brand .tag { color: var(--muted); font-size: 13px; margin-top: 6px; }
  form { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
         padding: 28px 32px; width: 360px; max-width: calc(100vw - 32px); }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px;
          text-transform: uppercase; letter-spacing: 0.4px; }
  input { width: 100%; background: var(--input-bg); color: var(--text); border: 1px solid var(--border);
          border-radius: 6px; padding: 11px 12px; font-size: 14px; outline: none; transition: border 0.15s; }
  input:focus { border-color: var(--accent); }
  button { width: 100%; margin-top: 20px; padding: 12px 16px; background: var(--accent); color: #0a0a0a;
           border: 0; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; transition: filter 0.15s; }
  button:hover { filter: brightness(1.08); }
  .err { color: var(--error); font-size: 13px; margin-top: 10px; min-height: 1.2em; }
  .foot { color: var(--muted); font-size: 12px; text-align: center; margin-top: 18px; }
</style>
</head>
<body>
  <div class="brand">
    <div class="mark">Lead<span>Forge</span></div>
    <div class="tag">Sign in to continue</div>
  </div>
  <form method="POST" action="/login" autocomplete="on">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autofocus required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <button type="submit">Sign in</button>
  </form>
  <div class="foot">
    On first run, admin credentials are written to <code>FIRST_RUN_CREDENTIALS.txt</code>.
  </div>
</body>
</html>
