<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traffic Radius — Lead Intelligence Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script>window.Leaflet=window.L;</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
<script src="https://unpkg.com/@splinetool/viewer@1.0.0/build/spline-viewer.js" type="module"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#4BB8D9;--green:#7DBA4B;--amber:#F59E0B;--red:#EF4444;--violet:#8B5CF6;
  --b5:rgba(75,184,217,0.05);--b10:rgba(75,184,217,0.10);--b20:rgba(75,184,217,0.20);
  --g5:rgba(125,186,75,0.05);--g10:rgba(125,186,75,0.10);--g20:rgba(125,186,75,0.20);
  --bg:#060810;--sf:#0d1120;--sf2:#111828;--sb:#09111e;
  --bd:rgba(75,184,217,0.1);--bd2:rgba(255,255,255,0.04);
  --t1:#e8edf8;--t2:rgba(232,237,248,0.58);--t3:rgba(232,237,248,0.28);--t4:rgba(232,237,248,0.12);
  --sh:0 8px 32px rgba(0,0,0,0.4),0 1px 0 rgba(255,255,255,0.03);
  --sh-lg:0 16px 48px rgba(0,0,0,0.5);
  --inp:#080e1c;--sans:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;--sw:200px;--r:12px;
}
[data-theme="light"]{
  --bg:#EEF2F7;--sf:#FFFFFF;--sf2:#F5F7FB;--sb:#FFFFFF;
  --bd:#E2E8F0;--bd2:rgba(0,0,0,0.05);
  --t1:#0F172A;--t2:#475569;--t3:#94A3B8;--t4:#CBD5E1;
  --sh:0 1px 3px rgba(0,0,0,0.06),0 4px 16px rgba(0,0,0,0.04);
  --sh-lg:0 4px 24px rgba(0,0,0,0.08),0 1px 4px rgba(0,0,0,0.05);
  --inp:#FFFFFF;
}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--sans);overflow-x:hidden;transition:background 0.35s,color 0.35s}
[data-theme="light"] body{background:#EEF2F7}
::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--b20);border-radius:2px}
#bg-cv{position:fixed;inset:0;z-index:0;pointer-events:none}
#root{display:flex;min-height:100vh;position:relative;z-index:2}

/* ─── SIDEBAR ─── */
.sb{width:var(--sw);min-width:var(--sw);height:100vh;position:sticky;top:0;display:flex;flex-direction:column;overflow:hidden;background:var(--sb);border-right:1px solid var(--bd);box-shadow:1px 0 24px rgba(0,0,0,0.15);transition:background 0.35s,border-color 0.35s}
.sb-logo{padding:20px 18px 16px;border-bottom:1px solid var(--bd);flex-shrink:0}
.sb-logo img{height:32px;width:auto;display:block;transition:filter 0.35s}
[data-theme="dark"] .sb-logo img{filter:brightness(0) invert(1)}
.sb-nav{padding:12px 10px 6px;flex-shrink:0}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:8px;font-size:13px;font-weight:500;color:var(--t2);cursor:pointer;border:1px solid transparent;transition:all 0.22s cubic-bezier(0.34,1.56,0.64,1);margin-bottom:1px;white-space:nowrap}
.nav-item:hover{color:var(--t1);background:var(--b5);border-color:var(--b10)}
.nav-item.on{color:var(--blue);background:var(--b10);border-color:var(--b20)}
.nav-item svg{flex-shrink:0;opacity:0.7}
.nav-badge{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:10px;background:var(--b10);color:var(--blue);margin-left:auto}
.sb-sep{height:1px;background:var(--bd);margin:8px 10px}
.sb-lbl{padding:4px 11px 5px;font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--t4);font-family:var(--mono)}
.sb-form{flex:1;overflow-y:auto;padding:2px 10px 10px}
.sb-foot{padding:10px;border-top:1px solid var(--bd);flex-shrink:0}

/* ─── CREDIT MINI ─── */
.credit-mini{background:var(--b5);border:1px solid var(--b10);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.cm-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.cm-row:last-child{margin-bottom:0}
.cm-name{font-size:11px;color:var(--t2);display:flex;align-items:center;gap:6px}
.cm-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;animation:breathe 3.2s ease-in-out infinite}
.cm-val{font-family:var(--mono);font-size:10px;color:var(--t3)}

/* ─── FORMS ─── */
.fg{margin-bottom:11px}
.fl{display:block;font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);margin-bottom:5px}
.fs,.fi{width:100%;padding:8px 10px;font-size:12px;font-family:var(--sans);color:var(--t1);background:var(--inp);border:1.5px solid var(--bd);border-radius:8px;outline:none;appearance:none;cursor:pointer;transition:all 0.2s}
.fs:focus,.fi:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--b10)}
[data-theme="dark"] .fs option{background:#0b0f1e}
.fi::placeholder{color:var(--t3)}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tog-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--bd2)}
.tog-title{font-size:12px;font-weight:500;color:var(--t1)}
.tog-desc{font-size:10px;color:var(--t3);margin-top:2px;line-height:1.4}
.tog{width:36px;height:20px;border-radius:10px;position:relative;cursor:pointer;flex-shrink:0;transition:all 0.3s}
.tog.off{background:var(--bd)}
.tog.on{background:var(--g20);border:1.5px solid var(--g20);box-shadow:0 0 8px var(--g10)}
.tog-k{position:absolute;top:2px;width:14px;height:14px;border-radius:50%;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1)}
.tog.off .tog-k{left:2px;background:var(--t4)}
.tog.on .tog-k{left:18px;background:var(--green);box-shadow:0 0 6px var(--green)}

/* ─── BUTTONS ─── */
.btn-gen{width:100%;padding:11px;margin-top:12px;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;border:none;border-radius:9px;cursor:pointer;font-family:var(--sans);background:linear-gradient(135deg,#7DBA4B 0%,#5d9437 100%);color:#fff;position:relative;overflow:hidden;box-shadow:0 4px 16px rgba(125,186,75,0.25);transition:all 0.2s}
.btn-gen:hover{box-shadow:0 6px 24px rgba(125,186,75,0.4);transform:translateY(-1px)}
.btn-gen.busy{cursor:wait;opacity:0.8}
.btn-gen::after{content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.16),transparent);animation:sweep 2.5s ease-in-out infinite}
@keyframes sweep{to{left:130%}}
.btn-sm{font-size:11px;font-weight:600;padding:6px 12px;border-radius:7px;cursor:pointer;border:1.5px solid;transition:all 0.18s;letter-spacing:0.3px}
.btn-blue{background:var(--b5);border-color:var(--b20);color:var(--blue)}
.btn-green{background:var(--g5);border-color:var(--g20);color:var(--green)}
.btn-ghost{background:transparent;border-color:var(--bd);color:var(--t2)}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}
.btn-sm:hover{filter:brightness(0.92);transform:translateY(-1px)}
.btn-danger{background:rgba(239,68,68,0.08);border-color:rgba(239,68,68,0.2);color:var(--red)}

/* ─── SERVER BOX ─── */
.srv{background:var(--inp);border:1.5px solid var(--bd);border-radius:9px;padding:11px;transition:background 0.35s}
.srv-lbl{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);margin-bottom:6px}
.srv-in{width:100%;font-family:var(--mono);font-size:9.5px;color:var(--blue);background:var(--bg);border:1.5px solid var(--bd);border-radius:6px;padding:7px 9px;outline:none;margin-bottom:7px;transition:border-color 0.2s}
.srv-in:focus{border-color:var(--blue)}
.srv-btn{width:100%;padding:7px;font-size:11px;font-weight:600;border:1.5px solid var(--g20);border-radius:6px;cursor:pointer;background:var(--g5);color:var(--green);transition:all 0.2s}
.srv-btn:hover{background:var(--g10)}

/* ─── MAIN ─── */
.main{flex:1;min-width:0;display:flex;flex-direction:column;padding:0 24px 180px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 0 20px;gap:12px;flex-wrap:nowrap;border-bottom:1px solid var(--bd);margin-bottom:24px}
.tb-left{}
.tb-title{font-size:24px;font-weight:700;letter-spacing:-0.5px;color:var(--t1);line-height:1.1;transition:color 0.35s}
.tb-title em{font-style:normal;background:linear-gradient(135deg,var(--blue),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.tb-sub{font-size:12px;color:var(--t3);margin-top:2px}
.tb-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.tb-clock{font-family:var(--mono);font-size:11px;color:var(--t3);letter-spacing:1px;white-space:nowrap}
.tb-conn{display:flex;align-items:center;gap:6px;padding:5px 12px;background:var(--g5);border:1.5px solid var(--g20);border-radius:20px;font-size:11px;font-weight:500;color:var(--green);white-space:nowrap}
.tb-cdot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:gp 2s ease-in-out infinite;flex-shrink:0}
@keyframes gp{0%,100%{box-shadow:0 0 3px var(--green)}50%{box-shadow:0 0 10px var(--green)}}
.theme-btn{display:flex;align-items:center;gap:6px;padding:5px 12px;background:var(--sf2);border:1.5px solid var(--bd);border-radius:20px;font-size:11px;font-weight:500;color:var(--t2);cursor:pointer;transition:all 0.2s;white-space:nowrap}
.theme-btn:hover{border-color:var(--blue);color:var(--blue)}
.demo-btn{display:flex;align-items:center;gap:6px;padding:5px 12px;background:var(--b5);border:1.5px solid var(--b20);border-radius:20px;font-size:11px;font-weight:600;color:var(--blue);cursor:pointer;transition:all 0.2s;white-space:nowrap}
.demo-btn:hover{background:var(--b10);box-shadow:0 0 16px var(--b20)}
.demo-dot{width:6px;height:6px;border-radius:50%;background:var(--blue);animation:gp 1.5s ease-in-out infinite}

/* ─── CARD ─── */
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);transition:background 0.35s,border-color 0.35s;position:relative;overflow:hidden}
[data-theme="dark"] .card::before{content:'';position:absolute;top:0;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,rgba(75,184,217,0.25),transparent)}
.card-p{padding:20px}
.card:hover{border-color:var(--b20);box-shadow:var(--sh-lg);transform:translateY(-1px)}
.crd:hover{border-color:var(--b20);transform:translateY(-2px) scale(1.008);box-shadow:var(--sh-lg)}

/* ─── CREDITS ROW ─── */
.creds{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.crd{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:13px;box-shadow:var(--sh);transition:all 0.28s cubic-bezier(0.34,1.56,0.64,1)}
.crd-donut{position:relative;width:64px;height:64px;flex-shrink:0}
.crd-donut canvas{display:block;z-index:1;position:relative}
.crd-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;pointer-events:none}
.crd-pct{font-family:var(--mono);font-size:14px;font-weight:700;line-height:1}
.crd-ulbl{font-size:8px;color:var(--t3);font-family:var(--mono);margin-top:2px;letter-spacing:0.5px}
.crd-name{font-size:14px;font-weight:700;color:var(--t1);margin-bottom:3px;letter-spacing:-0.2px}
.crd-sub{font-family:var(--mono);font-size:10px;color:var(--t3);line-height:1.5}
.crd-rem{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;font-weight:600;margin-top:6px}
.crd-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}

/* ─── TABS ─── */
.tabs{display:flex;gap:3px;background:var(--inp);border:1.5px solid var(--bd);border-radius:9px;padding:3px;width:fit-content;margin-bottom:18px}
.tab{font-size:12px;font-weight:500;padding:6px 16px;border-radius:6px;border:none;cursor:pointer;background:transparent;color:var(--t2);transition:all 0.18s}
.tab.on{background:var(--b10);color:var(--blue);border:1.5px solid var(--b20)}
.tab:not(.on):hover{color:var(--t1);background:var(--b5)}

/* ─── CONTENT GRID ─── */
.cg{display:grid;grid-template-columns:1fr 252px;gap:16px;align-items:start}

/* ─── RESULTS ─── */
.res-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.res-title{font-size:13px;font-weight:600;color:var(--t1)}
.rt{width:100%;border-collapse:collapse;font-size:12px}
.rt th{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);padding:7px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
.rt td{padding:9px 10px;border-bottom:1px solid var(--bd2);color:var(--t2);vertical-align:middle;white-space:nowrap}
.rt tr:hover td{background:var(--b5);color:var(--t1)}
.rt tr td:first-child{color:var(--t1);font-weight:600}
.sc{display:inline-flex;align-items:center;font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600}
.sc-h{background:var(--g10);color:var(--green)}.sc-m{background:rgba(245,158,11,0.1);color:var(--amber)}

/* ─── EMPTY STATE ─── */
.empty{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px}
.empty-ring{position:relative;width:64px;height:64px;margin:0 auto 16px}
.empty-ring svg{position:absolute;inset:0;animation:rot 8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.empty-ring-in{position:absolute;inset:10px;border-radius:50%;background:var(--b5);border:1.5px solid var(--b10);display:flex;align-items:center;justify-content:center}
.empty-h{font-size:14px;font-weight:600;color:var(--t2);margin-bottom:5px}
.empty-s{font-size:12px;color:var(--t3);line-height:1.7;max-width:260px}

/* ─── STATS PANEL ─── */
.sp{position:sticky;top:20px}
.sp-sec{margin-bottom:14px}
.sp-ttl{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--t3);margin-bottom:7px;padding-bottom:5px;border-bottom:1px solid var(--bd)}
.sr{display:flex;align-items:center;justify-content:space-between;padding:3px 0;gap:8px}
.sk{font-size:11px;color:var(--t2);white-space:nowrap;flex-shrink:0}
.sv{font-family:var(--mono);font-size:11px;color:var(--t3);white-space:nowrap}
.sv.bl{color:var(--blue)}.sv.gr{color:var(--green)}.sv.am{color:var(--amber)}
.sv.live{color:var(--green);animation:vp 2s ease-in-out infinite}
@keyframes vp{0%,100%{opacity:1}50%{opacity:0.5}}
.api-r{display:flex;align-items:center;justify-content:space-between;padding:3px 0;gap:8px}
.api-n{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t2);white-space:nowrap;flex-shrink:0}
.api-d{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.api-d.ok{background:var(--green);box-shadow:0 0 5px var(--green);animation:gp 2.5s ease-in-out infinite}
.api-c{font-family:var(--mono);font-size:9px;color:var(--t3);white-space:nowrap}

/* ─── KPI CARDS ─── */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px;box-shadow:var(--sh);transition:all 0.25s}
.kpi:hover{border-color:var(--b20);transform:translateY(-3px) scale(1.01);box-shadow:var(--sh-lg)}
.kpi-label{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);margin-bottom:8px}
.kpi-val{font-size:28px;font-weight:700;letter-spacing:-0.5px;color:var(--t1);margin-bottom:4px;line-height:1}
.kpi-trend{font-size:11px;color:var(--green);display:flex;align-items:center;gap:4px}
.kpi-trend.down{color:var(--red)}

/* ─── ANALYTICS CHARTS ─── */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.chart-wrap{height:220px;position:relative}

/* ─── HISTORY TABLE ─── */
.run-status{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:4px}
.run-status.done{background:var(--g10);color:var(--green)}
.run-status.fail{background:rgba(239,68,68,0.1);color:var(--red)}
.run-status.partial{background:rgba(245,158,11,0.1);color:var(--amber)}

/* ─── USERS ─── */
.user-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.role-badge{font-family:var(--mono);font-size:9px;font-weight:600;padding:2px 8px;border-radius:10px}
.role-admin{background:rgba(139,92,246,0.12);color:var(--violet)}
.role-analyst{background:var(--b10);color:var(--blue)}
.role-viewer{background:var(--bd2);color:var(--t3)}
.user-online{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 5px var(--green)}
.user-offline{width:8px;height:8px;border-radius:50%;background:var(--t4)}
.invite-modal{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.invite-card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:28px;width:420px;box-shadow:var(--sh-lg)}
.modal-title{font-size:18px;font-weight:700;color:var(--t1);margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--t3);margin-bottom:20px}

/* ─── SETTINGS ─── */
.settings-tabs{display:flex;gap:2px;background:var(--inp);border:1.5px solid var(--bd);border-radius:9px;padding:3px;margin-bottom:20px;width:fit-content}
.stab{font-size:12px;font-weight:500;padding:6px 16px;border-radius:6px;border:none;cursor:pointer;background:transparent;color:var(--t2);transition:all 0.18s}
.stab.on{background:var(--b10);color:var(--blue);border:1.5px solid var(--b20)}
.stab:not(.on):hover{color:var(--t1);background:var(--b5)}
.api-key-row{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--bd2)}
.api-key-row:last-child{border-bottom:none}
.api-key-name{font-size:13px;font-weight:600;color:var(--t1);width:100px;flex-shrink:0}
.api-key-status{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.key-inp{flex:1;font-family:var(--mono);font-size:11px;color:var(--blue);background:var(--inp);border:1.5px solid var(--bd);border-radius:7px;padding:7px 10px;outline:none;transition:border-color 0.2s}
.key-inp:focus{border-color:var(--blue)}
.test-btn{font-size:10px;font-weight:600;padding:6px 12px;border-radius:6px;border:1.5px solid var(--b20);background:var(--b5);color:var(--blue);cursor:pointer;white-space:nowrap;transition:all 0.2s}
.test-btn:hover{background:var(--b10)}
.test-btn.pass{border-color:var(--g20);background:var(--g5);color:var(--green)}
.test-btn.fail{border-color:rgba(239,68,68,0.2);background:rgba(239,68,68,0.05);color:var(--red)}
.pref-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--bd2)}
.pref-row:last-child{border-bottom:none}
.pref-label{font-size:13px;font-weight:500;color:var(--t1)}
.pref-desc{font-size:11px;color:var(--t3);margin-top:2px}
.plan-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:10px;background:linear-gradient(135deg,rgba(75,184,217,0.2),rgba(139,92,246,0.2));border:1px solid var(--b20);color:var(--blue)}
.billing-bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-top:6px}
.billing-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--green))}

/* ─── DRAWER (always dark) ─── */
.drawer-backdrop{position:fixed;inset:0;z-index:499;background:rgba(0,0,0,0.28);backdrop-filter:blur(3px);animation:bdfade .3s ease-out}
[data-theme="light"] .drawer-backdrop{background:rgba(0,0,0,0.12)}
@keyframes bdfade{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:500px;z-index:500;transform:translateX(100%);display:flex;flex-direction:column;overflow:hidden;box-shadow:-8px 0 48px rgba(0,0,0,0.5);transition:background 0.35s}
.drawer.light-drawer{box-shadow:-4px 0 24px rgba(0,0,0,0.1)}
/* Drawer header */
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid rgba(75,184,217,0.12);flex-shrink:0;background:rgba(0,0,0,0.15)}
.light-drawer .drawer-head{background:rgba(0,0,0,0.03);border-bottom-color:var(--bd)}
.drawer-head-left{display:flex;align-items:center;gap:10px}
/* Drawer stats row */
.drawer-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(75,184,217,0.08);flex-shrink:0}
.light-drawer .drawer-stats{background:var(--bd)}
.ds-cell{padding:12px 8px;text-align:center;background:#0d1120}
.light-drawer .ds-cell{background:var(--sf2)}
.ds-num{font-family:var(--mono);font-size:22px;font-weight:700;color:#e8edf8;line-height:1}
.light-drawer .ds-num{color:var(--t1)}
.ds-lbl{font-family:var(--mono);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(232,237,248,0.3);margin-top:3px}
.light-drawer .ds-lbl{color:var(--t3)}
/* Steps area */
.drawer-steps{padding:16px 20px;flex-shrink:0}
.step2{display:flex;align-items:flex-start;gap:12px;padding:8px 12px;border-radius:9px;transition:background 0.25s;margin-bottom:2px;position:relative}
.step2.s-act{background:rgba(75,184,217,0.08);border:1px solid rgba(75,184,217,0.15)}
.light-drawer .step2.s-act{background:rgba(75,184,217,0.06);border-color:rgba(75,184,217,0.18)}
.step2.s-done{opacity:0.7}
.step2-ic{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;margin-top:1px;transition:all 0.3s}
.step2-ic.idle{background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,255,255,0.12);color:rgba(232,237,248,0.3)}
.light-drawer .step2-ic.idle{background:var(--sf2);border-color:var(--bd);color:var(--t3)}
.step2-ic.act{background:rgba(75,184,217,0.15);border:1.5px solid rgba(75,184,217,0.35);color:#4BB8D9;animation:sa 1.6s ease-in-out infinite}
.step2-ic.done{background:rgba(125,186,75,0.15);border:1.5px solid rgba(125,186,75,0.35);color:#7DBA4B}
.step2-body{flex:1}
.step2-nm{font-size:12px;font-weight:600;color:rgba(232,237,248,0.5);margin-bottom:2px;transition:color 0.3s}
.light-drawer .step2-nm{color:var(--t3)}
.step2-nm.act{color:#e8edf8}.light-drawer .step2-nm.act{color:var(--t1)}
.step2-nm.done{color:#7DBA4B}
.step2-dt{font-family:var(--mono);font-size:9px;color:rgba(232,237,248,0.22)}
.light-drawer .step2-dt{color:var(--t3)}
.step2-time{font-family:var(--mono);font-size:9px;color:rgba(75,184,217,0.6);margin-left:auto;flex-shrink:0;align-self:center}
.drawer-pb{padding:0 20px 14px;flex-shrink:0}
.pb2-track{height:3px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden}
.light-drawer .pb2-track{background:var(--bd)}
.pb2-fill{height:100%;background:linear-gradient(90deg,#4BB8D9,#7DBA4B);border-radius:3px;transition:width 0.6s ease-out;box-shadow:0 0 8px rgba(75,184,217,0.4)}
.pb2-label{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:rgba(232,237,248,0.3);margin-bottom:5px}
.light-drawer .pb2-label{color:var(--t3)}
/* Terminal */
.drawer-term{flex:1;display:flex;flex-direction:column;overflow:hidden;margin:0 12px 12px;border-radius:10px;border:1px solid rgba(75,184,217,0.1);min-height:0}
.light-drawer .drawer-term{background:#F8FAFC;border-color:#E2E8F0}
.term2-hdr{padding:7px 12px;border-bottom:1px solid rgba(75,184,217,0.08);display:flex;align-items:center;gap:6px;background:rgba(0,0,0,0.25);flex-shrink:0}
.light-drawer .term2-hdr{background:#F1F5F9;border-bottom-color:#E2E8F0}
.term2-body{flex:1;overflow-y:auto;padding:10px 12px;font-family:var(--mono);font-size:10.5px;line-height:1.75;background:rgba(4,6,12,0.8)}
.light-drawer .term2-body{background:#F8FAFC;color:#374151}
.light-drawer .tts{color:#9CA3AF}
.light-drawer .tmsg{color:#475569}
.light-drawer .ttag.sys{color:#9CA3AF}
.light-drawer .ttag.ok{color:#16A34A}
.light-drawer .ttag.scan{color:#2563EB}
.light-drawer .ttag.find{color:#D97706}
.light-drawer .ttag.enrich{color:#7C3AED}
.light-drawer .ttag.score{color:#0891B2}
.light-drawer .ttag.err{color:#DC2626}
.light-drawer .tcur{background:#2563EB}
.drawer-grip{display:flex;justify-content:center;padding:10px 0 0;cursor:pointer}
.drawer-gb{width:40px;height:3px;background:rgba(75,184,217,0.2);border-radius:2px;transition:background 0.2s}
.drawer-grip:hover .drawer-gb{background:rgba(75,184,217,0.45)}
.drawer-x{position:absolute;top:10px;right:14px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:6px;cursor:pointer;color:rgba(232,237,248,0.4);font-size:13px;transition:all 0.18s}
.drawer-x:hover{color:#e8edf8;background:rgba(255,255,255,0.1)}
.drawer-bd{display:grid;grid-template-columns:296px 1fr;height:calc(100% - 30px);overflow:hidden}
.drawer-l{border-right:1px solid rgba(75,184,217,0.08);padding:14px 18px;display:flex;flex-direction:column}
.drawer-r{padding:14px 18px;display:flex;flex-direction:column;overflow:hidden}
.dw-t{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#e8edf8;display:flex;align-items:center;gap:8px;margin-bottom:2px}
.dw-s{font-size:10px;color:rgba(232,237,248,0.3);margin-bottom:14px;font-family:var(--mono)}
.dw-spin{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 6px var(--amber);animation:gp 1.4s ease-in-out infinite}
.steps{flex:1;display:flex;flex-direction:column}
.step{display:flex;align-items:flex-start;gap:10px;padding:7px 0;position:relative}
.step:not(:last-child)::after{content:'';position:absolute;left:12px;top:30px;bottom:0;width:1px;background:rgba(75,184,217,0.1)}
.step-ic{width:25px;height:25px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;transition:all 0.35s}
.step-ic.idle{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);color:rgba(232,237,248,0.3)}
.step-ic.act{background:rgba(75,184,217,0.12);border:1px solid rgba(75,184,217,0.3);color:#4BB8D9;animation:sa 1.6s ease-in-out infinite}
.step-ic.done{background:rgba(125,186,75,0.12);border:1px solid rgba(125,186,75,0.3);color:#7DBA4B}
@keyframes sa{0%,100%{box-shadow:0 0 0 0 rgba(75,184,217,0.25)}50%{box-shadow:0 0 0 5px rgba(75,184,217,0)}}
.step-nm{font-size:12px;font-weight:600;color:rgba(232,237,248,0.5);transition:color 0.3s;margin-bottom:1px}
.step-nm.act{color:#e8edf8}.step-nm.done{color:#7DBA4B}
.step-dt{font-family:var(--mono);font-size:9px;color:rgba(232,237,248,0.25)}
.pb-w{margin-top:10px;background:rgba(255,255,255,0.05);border-radius:3px;height:2px;overflow:hidden}
.pb{height:100%;background:linear-gradient(90deg,#4BB8D9,#7DBA4B);border-radius:3px;transition:width 0.5s ease-out;box-shadow:0 0 6px rgba(75,184,217,0.4)}
.ls-g{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(75,184,217,0.07);border-radius:8px;overflow:hidden;margin-top:10px;border:1px solid rgba(75,184,217,0.08)}
.ls-c{background:#0d1120;padding:8px 6px;text-align:center}
.ls-n{font-family:var(--mono);font-size:20px;font-weight:700;color:#e8edf8;line-height:1}
.ls-l{font-size:8px;color:rgba(232,237,248,0.3);margin-top:3px;letter-spacing:0.5px;font-family:var(--mono)}
.term{flex:1;background:rgba(4,6,12,0.8);border-radius:8px;border:1px solid rgba(75,184,217,0.09);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.term-hdr{padding:7px 10px;border-bottom:1px solid rgba(75,184,217,0.07);display:flex;align-items:center;gap:6px;background:rgba(0,0,0,0.3);flex-shrink:0}
.tdots{display:flex;gap:4px}
.tdot{width:8px;height:8px;border-radius:50%}
.tdot:nth-child(1){background:#FF5F57}.tdot:nth-child(2){background:#FEBC2E}.tdot:nth-child(3){background:#28C840}
.term-t{font-family:var(--mono);font-size:9px;color:rgba(232,237,248,0.3);margin-left:4px}
.term-body{flex:1;overflow-y:auto;padding:10px 12px;font-family:var(--mono);font-size:11px;line-height:1.75}
.tl{display:flex;gap:8px;animation:tlin 0.25s ease-out}
@keyframes tlin{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.tts{color:rgba(232,237,248,0.18);flex-shrink:0;font-size:10px}
.ttag{flex-shrink:0;font-weight:500;font-size:10px}
.ttag.sys{color:rgba(232,237,248,0.32)}.ttag.ok{color:#7DBA4B}.ttag.scan{color:#4BB8D9}
.ttag.find{color:#F59E0B}.ttag.enrich{color:#8B5CF6}.ttag.score{color:#06B6D4}.ttag.err{color:#EF4444}
.tmsg{color:rgba(232,237,248,0.65);font-size:11px}
.tcur{display:inline-block;width:6px;height:11px;background:#4BB8D9;margin-left:2px;vertical-align:middle;animation:bc 1.1s step-end infinite}
@keyframes bc{0%,100%{opacity:1}50%{opacity:0}}

/* ─── TICKER ─── */
.ticker{position:fixed;bottom:0;left:0;right:0;height:26px;z-index:400;background:var(--sf);border-top:1px solid var(--bd);display:flex;align-items:center;overflow:hidden;transition:background 0.35s,border-color 0.35s}
.ticker-lbl{font-family:var(--mono);font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--blue);padding:0 12px;white-space:nowrap;flex-shrink:0;border-right:1px solid var(--bd)}
.ticker-tr{flex:1;overflow:hidden}
.ticker-in{display:flex;gap:44px;white-space:nowrap;animation:tr 35s linear infinite}
.ti{font-family:var(--mono);font-size:9.5px;color:var(--t3)}
.ti b{color:var(--green);font-weight:500;margin-right:4px}
@keyframes tr{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ─── LIVE OPERATIONS ─── */
@keyframes valflash{0%{color:var(--green);text-shadow:0 0 14px var(--green),0 0 4px var(--green);transform:translateY(-2px)}60%{color:var(--green);text-shadow:0 0 8px rgba(125,186,75,0.5)}100%{transform:translateY(0);text-shadow:none}}
.val-flash{animation:valflash 1.4s ease-out}
@keyframes breathe{0%,100%{transform:scale(1);box-shadow:0 0 3px currentColor}50%{transform:scale(1.18);box-shadow:0 0 14px currentColor,0 0 0 3px rgba(125,186,75,0.12)}}
.breathe-dot{animation:breathe 2.4s ease-in-out infinite}
.card::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(75,184,217,0.10) 50%,transparent 70%);transform:translateX(-100%);pointer-events:none;opacity:0;z-index:1}
.card.shimmer::after{animation:cardsweep 1.6s ease-in-out;opacity:1}
@keyframes cardsweep{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
[data-theme="light"] .card::after{background:linear-gradient(105deg,transparent 30%,rgba(75,184,217,0.06) 50%,transparent 70%)}
.liveops-feed{position:fixed;bottom:60px;right:18px;z-index:650;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:320px}
.liveops-item{background:var(--sf);border:1px solid var(--bd);border-left:3px solid var(--blue);border-radius:8px;padding:9px 12px 9px 13px;display:flex;align-items:flex-start;gap:9px;box-shadow:0 4px 18px rgba(0,0,0,0.10);backdrop-filter:blur(12px);animation:lofIn 0.4s cubic-bezier(0.2,0.8,0.2,1),lofOut 0.4s ease-in forwards;animation-delay:0s,6.6s;pointer-events:auto}
.liveops-item.learn{border-left-color:var(--blue)}
.liveops-item.enrich{border-left-color:var(--green)}
.liveops-item.api{border-left-color:var(--amber)}
.liveops-item.scan{border-left-color:var(--violet)}
.liveops-ic{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;font-weight:700;font-family:var(--mono)}
.liveops-body{flex:1;min-width:0}
.liveops-title{font-size:11px;font-weight:600;color:var(--t1);margin-bottom:2px;letter-spacing:-0.1px;line-height:1.3}
.liveops-sub{font-size:10px;color:var(--t3);font-family:var(--mono);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes lofIn{from{transform:translateX(80px) scale(0.96);opacity:0}to{transform:translateX(0) scale(1);opacity:1}}
@keyframes lofOut{to{transform:translateX(80px);opacity:0}}
.cm-val.drained{color:var(--amber) !important;transition:color 1.6s}

/* ─── TOAST ─── */
.toast{position:fixed;top:16px;right:16px;z-index:700;background:var(--sf);border:1.5px solid var(--g20);border-radius:12px;padding:14px 16px;display:flex;align-items:flex-start;gap:10px;box-shadow:var(--sh-lg);animation:tin 0.45s cubic-bezier(0.34,1.56,0.64,1);max-width:300px}
@keyframes tin{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast-ic{width:30px;height:30px;border-radius:8px;background:var(--g10);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.toast-title{font-size:13px;font-weight:600;color:var(--t1);margin-bottom:3px}
.toast-msg{font-size:11px;color:var(--t2)}

/* ─── INTEL STRIP (home page) ─── */
.intel-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:18px}
.intel-strip-item{background:var(--sf);padding:12px 14px;text-align:center;cursor:default;transition:background 0.2s}
.intel-strip-item:hover{background:var(--sf2)}
.intel-strip-val{font-family:var(--mono);font-size:18px;font-weight:700;line-height:1;margin-bottom:4px}
.intel-strip-label{font-family:var(--mono);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3)}
.intel-strip-badge{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:8px;color:var(--green);margin-top:2px}

/* ─── GENERATE LAYOUT ─── */
.gen-layout{display:grid;grid-template-columns:360px 1fr;gap:16px;align-items:start}
.gen-form-card{position:sticky;top:20px}
.gen-form-title{font-size:16px;font-weight:700;color:var(--t1);letter-spacing:-0.3px;margin-bottom:4px}
.gen-form-sub{font-size:11px;color:var(--t3);margin-bottom:18px;line-height:1.5}
.form-tab-big{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--sf2);border:1.5px solid var(--bd);border-radius:10px;padding:4px;margin-bottom:18px}
.ftab{font-size:12px;font-weight:600;padding:9px 12px;border-radius:7px;border:none;cursor:pointer;background:transparent;color:var(--t2);transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:7px;letter-spacing:0.1px}
.ftab.on{background:var(--sf);color:var(--blue);border:1.5px solid var(--b20);box-shadow:0 2px 8px rgba(75,184,217,0.1)}
.ftab:not(.on):hover{color:var(--t1);background:rgba(0,0,0,0.03)}
.field-hint{font-size:10px;color:var(--t3);margin-top:4px;line-height:1.4}
.gen-btn-big{width:100%;padding:14px;margin-top:18px;font-size:13px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;border:none;border-radius:10px;cursor:pointer;font-family:var(--sans);background:linear-gradient(135deg,#7DBA4B 0%,#4BB8D9 100%);color:#fff;position:relative;overflow:hidden;box-shadow:0 6px 24px rgba(125,186,75,0.25),0 0 0 1px rgba(125,186,75,0.2);transition:all 0.22s}
.gen-btn-big:hover{box-shadow:0 10px 32px rgba(125,186,75,0.38),0 0 0 1px rgba(125,186,75,0.35);transform:translateY(-2px)}
.gen-btn-big:active{transform:translateY(0)}
.gen-btn-big.busy{cursor:wait;opacity:0.8}
.gen-btn-big::after{content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.18),transparent);animation:sweep 2.5s ease-in-out infinite}

/* Results section */
.results-col{display:flex;flex-direction:column;gap:14px}
.run-stats-inline{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.rsi-card{background:var(--sf);border:1px solid var(--bd);border-radius:9px;padding:12px 14px;box-shadow:var(--shadow)}
.rsi-label{font-family:var(--mono);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);margin-bottom:6px}
.rsi-val{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--t1);line-height:1}
.rsi-sub{font-size:10px;color:var(--t3);margin-top:3px}

/* ─── PIPELINE KANBAN ─── */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.kanban-col{min-width:220px;flex-shrink:0;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.kanban-hdr{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.kanban-title{font-size:12px;font-weight:600;color:var(--t1)}
.kanban-count{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:10px;background:var(--b10);color:var(--blue)}
.kanban-body{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.lead-card{background:var(--sf);border:1px solid var(--bd);border-radius:9px;padding:11px 12px;cursor:grab;transition:all 0.2s;box-shadow:var(--shadow)}
.lead-card:hover{border-color:var(--b20);box-shadow:var(--sh-lg);transform:translateY(-1px)}
.lead-card-name{font-size:12px;font-weight:600;color:var(--t1);margin-bottom:3px}
.lead-card-domain{font-family:var(--mono);font-size:9px;color:var(--blue);margin-bottom:6px}
.lead-card-meta{display:flex;align-items:center;justify-content:space-between}

<body>
<canvas id="bg-cv"></canvas>
<div id="root"></div>

<script>
/* Three.js WebGL Neural Network Background — refined & minimal */
(function(){
  if(!window.THREE)return;
  const cv=document.getElementById('bg-cv');
  const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(window.innerWidth,window.innerHeight);
  const scene=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(70,window.innerWidth/window.innerHeight,0.1,200);
  cam.position.z=38;

  // Minimal particles — 2 tones, small, subtle
  const N=100;const nodes=[];const sg=new THREE.SphereGeometry(0.09,8,8);
  for(let i=0;i<N;i++){
    const isB=Math.random()>0.45;
    const m=new THREE.MeshBasicMaterial({color:isB?0x4BB8D9:0x7DBA4B,transparent:true,opacity:Math.random()*0.18+0.12});
    const mesh=new THREE.Mesh(sg,m);
    mesh.position.set((Math.random()-.5)*72,(Math.random()-.5)*46,(Math.random()-.5)*24);
    mesh.userData={vx:(Math.random()-.5)*.014,vy:(Math.random()-.5)*.010,vz:(Math.random()-.5)*.006,bo:m.opacity,ph:Math.random()*Math.PI*2};
    scene.add(mesh);nodes.push(mesh);
  }

  // Just 3 wireframe shapes — minimal, slow rotation
  const shapes=[];
  [[new THREE.IcosahedronGeometry(1.3,0),0x4BB8D9],[new THREE.OctahedronGeometry(1.1,0),0x7DBA4B],[new THREE.TetrahedronGeometry(1.5,0),0x8B5CF6]].forEach(([g,col])=>{
    const mat=new THREE.MeshBasicMaterial({color:col,wireframe:true,transparent:true,opacity:.10});
    const mesh=new THREE.Mesh(g,mat);
    const s=0.9+Math.random()*.7;mesh.scale.setScalar(s);
    mesh.position.set((Math.random()-.5)*55,(Math.random()-.5)*36,(Math.random()-.5)*18);
    mesh.userData={rx:(Math.random()-.5)*.006,ry:(Math.random()-.5)*.007,rz:(Math.random()-.5)*.003};
    scene.add(mesh);shapes.push(mesh);
  });

  // Connection lines — subtle
  const lm=new THREE.LineBasicMaterial({color:0x4BB8D9,transparent:true,opacity:.08});
  let ls=null;let fr=0;
  function buildL(){
    if(ls){scene.remove(ls);ls.geometry.dispose();}
    const pos=[];const MD=13;
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
      const d=nodes[i].position.distanceTo(nodes[j].position);
      if(d<MD){pos.push(nodes[i].position.x,nodes[i].position.y,nodes[i].position.z,nodes[j].position.x,nodes[j].position.y,nodes[j].position.z);}
    }
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    ls=new THREE.LineSegments(g,lm);scene.add(ls);
  }

  let mx=0,my=0;
  document.addEventListener('mousemove',e=>{mx=(e.clientX/window.innerWidth-.5)*.25;my=(e.clientY/window.innerHeight-.5)*.25;});
  function animate(){
    requestAnimationFrame(animate);fr++;
    const dark=document.documentElement.dataset.theme!=='light';
    nodes.forEach(n=>{
      n.position.x+=n.userData.vx;n.position.y+=n.userData.vy;n.position.z+=n.userData.vz;
      if(Math.abs(n.position.x)>36)n.userData.vx*=-1;
      if(Math.abs(n.position.y)>23)n.userData.vy*=-1;
      if(Math.abs(n.position.z)>12)n.userData.vz*=-1;
      const base=dark?n.userData.bo:n.userData.bo*1.8;
      n.material.opacity=Math.min(base+Math.sin(fr*.016+n.userData.ph)*.08,dark?.45:.55);
    });
    shapes.forEach(s=>{s.rotation.x+=s.userData.rx;s.rotation.y+=s.userData.ry;s.rotation.z+=s.userData.rz;s.material.opacity=dark?.08:.12;});
    lm.opacity=dark?.06:.11;
    if(fr%4===0)buildL();
    cam.position.x+=(mx-cam.position.x)*.04;
    cam.position.y+=(-my-cam.position.y)*.04;
    cam.lookAt(0,0,0);renderer.render(scene,cam);
  }
  animate();
  window.addEventListener('resize',()=>{
    cam.aspect=window.innerWidth/window.innerHeight;cam.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
  });
})();

/* Lenis Smooth Scroll */
window.addEventListener('DOMContentLoaded',function(){
  if(!window.Lenis)return;
  const lenis=new window.Lenis({lerp:.1,smoothWheel:true,syncTouch:true});
  function raf(t){lenis.raf(t);requestAnimationFrame(raf);}
  requestAnimationFrame(raf);
  window.__lenis=lenis;
});
</script>

<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

/* ─── Utils ─── */
function useClock(){const[t,setT]=useState(new Date());useEffect(()=>{const id=setInterval(()=>setT(new Date()),1000);return()=>clearInterval(id)},[]);return t.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function useGCount(target,dur=1400){const[v,setV]=useState(target);useEffect(()=>{if(!window.anime)return;const o={n:0};window.anime({targets:o,n:target,duration:dur,easing:'easeOutExpo',update:()=>setV(Math.round(o.n))})},[target]);return v}

/* ─── Donut ─── */
function Donut({used,total,hex}){
  const ref=useRef(null);const cr=useRef(null);
  useEffect(()=>{
    if(!ref.current||!window.Chart)return;
    if(cr.current)cr.current.destroy();
    const dark=document.documentElement.dataset.theme!=='light';
    cr.current=new window.Chart(ref.current.getContext('2d'),{
      type:'doughnut',
      data:{datasets:[{data:[used,total-used],backgroundColor:[hex,dark?'rgba(255,255,255,0.04)':'rgba(0,0,0,0.06)'],borderWidth:0,hoverOffset:0}]},
      options:{cutout:'80%',responsive:false,animation:{animateRotate:true,duration:1600,easing:'easeInOutQuart'},plugins:{legend:{display:false},tooltip:{enabled:false}}}
    });
    return()=>{if(cr.current)cr.current.destroy()};
  },[used,total,hex]);
  return <canvas ref={ref} width="64" height="64"></canvas>;
}
function CreditCard({name,used,total,hex,delay=0}){
  const rem=useGCount(total-used);const pct=Math.round((used/total)*100);
  return(<div className="crd"><div className="crd-donut"><Donut used={used} total={total} hex={hex}/><div className="crd-center"><span className="crd-pct" style={{color:hex}}>{pct}%</span><span className="crd-ulbl">used</span></div></div><div><div className="crd-name">{name}</div><div className="crd-sub">{used.toLocaleString()} / {total.toLocaleString()} credits</div><div className="crd-rem" style={{color:hex}}><span className="crd-dot" style={{background:hex,boxShadow:`0 0 5px ${hex}`}}></span>{rem.toLocaleString()} remaining</div></div></div>);
}

/* ─── LineChart ─── */
function LineChart({labels,values,color}){
  const ref=useRef(null);const cr=useRef(null);
  useEffect(()=>{
    if(!ref.current||!window.Chart)return;
    if(cr.current)cr.current.destroy();
    const dark=document.documentElement.dataset.theme!=='light';
    const gc=dark?'rgba(255,255,255,0.04)':'rgba(0,0,0,0.05)';const tc=dark?'rgba(232,237,248,0.35)':'#94A3B8';
    cr.current=new window.Chart(ref.current,{

            <div style={{fontFamily:'var(--mono)',fontSize:8,letterSpacing:'1.5px',textTransform:'uppercase',color:'var(--t3)',marginTop:3}}>{s.l}</div>
          </div>
        ))}
      </div>
      {/* Progress steps */}
      <div className="card"><div className="card-p" style={{paddingTop:16,paddingBottom:12}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <div className="dw-spin"></div>
            <span style={{fontFamily:'var(--mono)',fontSize:10,fontWeight:600,color:'var(--t1)',letterSpacing:'0.5px',textTransform:'uppercase'}}>Generation Progress</span>
          </div>
          <div style={{fontFamily:'var(--mono)',fontSize:10,color:progress===100?'var(--green)':'var(--amber)',padding:'2px 10px',background:progress===100?'var(--g5)':'rgba(245,158,11,0.08)',border:'1px solid '+(progress===100?'var(--g20)':'rgba(245,158,11,0.2)'),borderRadius:20}}>{progress===100?'✓ Complete':progress+'%'}</div>
        </div>
        {STEPS.map((s,i)=>{
          const st=phase>i?'done':phase===i?'act':'idle';
          return(
            <div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'7px 8px',borderRadius:8,background:st==='act'?'var(--b5)':'transparent',border:'1px solid '+(st==='act'?'var(--b10)':'transparent'),marginBottom:2,transition:'all 0.25s'}}>
              <div style={{width:24,height:24,borderRadius:'50%',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:600,background:st==='done'?'var(--g10)':st==='act'?'var(--b10)':'var(--sf2)',border:'1.5px solid '+(st==='done'?'var(--g20)':st==='act'?'var(--b20)':'var(--bd)'),color:st==='done'?'var(--green)':st==='act'?'var(--blue)':'var(--t3)',animation:st==='act'?'sa 1.6s ease-in-out infinite':'none'}}>{st==='done'?'✓':st==='act'?<Spin/>:i+1}</div>
              <div style={{flex:1}}><div style={{fontSize:12,fontWeight:600,color:st==='done'?'var(--green)':st==='act'?'var(--t1)':'var(--t3)'}}>{s.l}</div><div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--t3)'}}>{s.d}</div></div>
              {st==='done'&&<span style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--green)'}}>{stepTimes[i]}</span>}
              {st==='act'&&<span style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--amber)',animation:'vp 1.5s ease-in-out infinite'}}>running…</span>}
            </div>
          );
        })}
        <div style={{marginTop:12}}>
          <div style={{display:'flex',justifyContent:'space-between',fontFamily:'var(--mono)',fontSize:9,color:'var(--t3)',marginBottom:4}}><span>Overall</span><span style={{color:progress===100?'var(--green)':'var(--blue)'}}>{progress}%</span></div>
          <div style={{height:3,background:'var(--bd)',borderRadius:3,overflow:'hidden'}}><div style={{height:'100%',width:progress+'%',background:'linear-gradient(90deg,var(--blue),var(--green))',borderRadius:3,transition:'width 0.5s ease-out',boxShadow:'0 0 6px rgba(75,184,217,0.4)'}}></div></div>
        </div>
      </div></div>
      {/* Inline terminal */}
      <div className="card" style={{overflow:'hidden'}}>
        <div style={{padding:'7px 12px',borderBottom:'1px solid var(--bd)',display:'flex',alignItems:'center',gap:6,background:isLight?'var(--sf2)':'rgba(0,0,0,0.2)'}}>
          <div className="tdots"><div className="tdot"></div><div className="tdot"></div><div className="tdot"></div></div>
          <span style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--t3)',marginLeft:4}}>live output — lead-engine v5.0</span>
        </div>
        <div ref={termRef} style={{maxHeight:220,overflowY:'auto',padding:'10px 12px',fontFamily:'var(--mono)',fontSize:11,lineHeight:1.75,background:isLight?'#F8FAFC':'rgba(4,6,12,0.8)'}}>
          {logs.map((l,i)=>(
            <div className="tl" key={i}>
              <span className="tts">{l.ts}</span>
              <span className={'ttag '+l.tag} style={{color:isLight?{sys:'#9CA3AF',ok:'#16A34A',scan:'#2563EB',find:'#D97706',enrich:'#7C3AED',score:'#0891B2',err:'#DC2626'}[l.tag]||'#9CA3AF':undefined}}>[{l.tag.toUpperCase()}]</span>
              <span className="tmsg" style={{color:isLight?'#475569':undefined}}>{l.msg}</span>
            </div>
          ))}
          {phase<STEPS.length&&<span className="tcur" style={{background:isLight?'#2563EB':undefined}}></span>}
        </div>
      </div>
    </div>
  );
}

function GenerateView({tab,setTab,stats,hasResults,onGenerate,loading,country,setCountry,cityTier,setCityTier,city,setCity,industry,setIndustry,indCountry,setIndCountry,maxLeads,setMaxLeads,minSearch,setMinSearch,minCpc,setMinCpc,enrich,setEnrich,onNav,phase,logs,progress,counts,theme}){
  const CITIES_MAP_L={'Australia':['Ballarat','Melbourne','Sydney','Brisbane','Perth','Adelaide','Geelong','Bendigo','Gold Coast','Canberra'],'United States':['New York','Los Angeles','Chicago','Houston','Phoenix'],'United Kingdom':['London','Manchester','Birmingham','Leeds','Glasgow'],'Canada':['Toronto','Vancouver','Montreal','Calgary'],'New Zealand':['Auckland','Wellington','Christchurch','Hamilton']};
  const INDUSTRIES_L=['Select an industry','Plumbing & Gas Fitting','Electrical Services','HVAC & Air Conditioning','Roofing & Guttering','Landscaping & Gardening','Dental & Oral Health','Legal Services','Accounting & Finance','Real Estate','Automotive & Mechanical','Cleaning Services','Pest Control','Building & Construction','IT & Technology'];
  const cities=CITIES_MAP_L[country]||[];
  const [formErr,setFormErr]=useState('');
  const [filter,setFilter]=useState('');

  const handleGen=()=>{
    if(tab==='industries'&&industry==='Select an industry'){setFormErr('Please select an industry to continue');return;}
    setFormErr('');onGenerate();
  };

  useEffect(()=>{
    const h=(e)=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')handleGen();};
    document.addEventListener('keydown',h);return()=>document.removeEventListener('keydown',h);
  },[tab,industry,loading]);

  const filteredLeads=LEADS.filter(l=>!filter||(l.b.toLowerCase().includes(filter.toLowerCase())||l.d.toLowerCase().includes(filter.toLowerCase())||l.k.toLowerCase().includes(filter.toLowerCase()))).sort((a,b)=>{const dir=sortDir==='asc'?1:-1;if(sortCol==='s')return dir*(a.s-b.s);if(sortCol==='b')return dir*a.b.localeCompare(b.b);return 0;});

  const SortIcon=({col})=>{if(sortCol!==col)return<span style={{opacity:0.3,marginLeft:4}}>↕</span>;return<span style={{marginLeft:4,color:'var(--blue)'}}>{sortDir==='asc'?'↑':'↓'}</span>;};

  return(<>
    <div className="intel-strip">
      {[{k:'db',val:fmt(liveStats.db),label:'DB Records',c:'var(--blue)'},{k:'dupes',val:fmt(liveStats.dupes),label:'Dupes Blocked',c:'var(--violet)'},{k:'kw',val:fmt(liveStats.kw),label:'KW Dictionary',c:'var(--green)'},{k:'learned',val:'+'+liveStats.learned,label:'Learned Today',c:'var(--amber)'},{k:'health',val:liveStats.health.toFixed(1)+'%',label:'DB Health',c:'var(--green)'},{k:'sync',val:syncAgo,label:'Last Sync',c:'var(--t3)'}].map((m,i)=>(
        <div className="intel-strip-item" key={i} onClick={i<5?()=>onNav('intelligence'):undefined} style={{cursor:i<5?'pointer':'default'}} title={i<5?'View Intelligence →':undefined}>
          <div className={'intel-strip-val'+(liveFlash[m.k]?' val-flash':'')} key={m.k+'-'+(liveFlash[m.k]||0)} style={{color:m.c}}>{m.val}</div>
          <div className="intel-strip-label">{m.label}</div>
        </div>
      ))}
    </div>
    <div className="gen-layout">
      {/* LEFT: Form */}
      <div className="gen-form-card">
        <div className="card"><div className="card-p">
          <div className="gen-form-title">Configure Lead Search</div>
          <div className="gen-form-sub">Select your search method. Press <kbd style={{fontFamily:'var(--mono)',fontSize:10,padding:'1px 5px',background:'var(--sf2)',border:'1px solid var(--bd)',borderRadius:4}}>⌘ Enter</kbd> to generate.</div>
          <div className="form-tab-big">
            <button className={'ftab '+(tab==='cities'?'on':'')} onClick={()=>{setTab('cities');setFormErr('')}}>
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="5" width="12" height="8" rx="1.5" stroke="currentColor" strokeWidth="1.3"/><path d="M4 5V4a3 3 0 0 1 6 0v1" stroke="currentColor" strokeWidth="1.3"/></svg>By City
            </button>
            <button className={'ftab '+(tab==='industries'?'on':'')} onClick={()=>{setTab('industries');setFormErr('')}}>
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="2" y="6" width="3" height="6" rx="1" stroke="currentColor" strokeWidth="1.3"/><rect x="5.5" y="4" width="3" height="8" rx="1" stroke="currentColor" strokeWidth="1.3"/><rect x="9" y="2" width="3" height="10" rx="1" stroke="currentColor" strokeWidth="1.3"/></svg>By Industry
            </button>
          </div>
          {tab==='cities'?(<>
            <div className="fg"><label className="fl">Country / Region</label><select className="fs" value={country} onChange={e=>{setCountry(e.target.value);setCity(CITIES_MAP_L[e.target.value]?.[0]||'')}}>{Object.keys(CITIES_MAP_L).map(c=><option key={c}>{c}</option>)}</select></div>
            <div className="fr2">
              <div className="fg"><label className="fl">City Tier</label><select className="fs" value={cityTier} onChange={e=>setCityTier(e.target.value)}>{['All city tiers','Tier 1 cities','Tier 2 cities','Tier 3 cities'].map(t=><option key={t}>{t}</option>)}</select></div>
              <div className="fg"><label className="fl">City</label><select className="fs" value={city} onChange={e=>setCity(e.target.value)}>{cities.map(c=><option key={c}>{c}</option>)}</select></div>
            </div>
            <div className="fr2">
              <div className="fg"><label className="fl">Max Leads</label><input className="fi" type="number" value={maxLeads} onChange={e=>setMaxLeads(e.target.value)} placeholder="0 = unlimited"/><div className="field-hint">0 = no limit</div></div>
              <div className="fg"><label className="fl">Min Search Volume</label><input className="fi" type="number" value={minSearch} onChange={e=>setMinSearch(e.target.value)}/><div className="field-hint">Monthly searches</div></div>
            </div>
          </>):(<>
            <div className="fg"><label className="fl">Industry</label><select className="fs" value={industry} onChange={e=>{setIndustry(e.target.value);setFormErr('')}} style={{borderColor:formErr?'var(--red)':''}}>{INDUSTRIES_L.map(i=><option key={i}>{i}</option>)}</select>{formErr&&<div style={{fontSize:11,color:'var(--red)',marginTop:4}}>⚠ {formErr}</div>}</div>
            <div className="fg"><label className="fl">Country / Region</label><select className="fs" value={indCountry} onChange={e=>setIndCountry(e.target.value)}>{Object.keys(CITIES_MAP_L).map(c=><option key={c}>{c}</option>)}</select></div>
            <div className="fr2">
              <div className="fg"><label className="fl">Max Leads</label><input className="fi" type="number" value={maxLeads} onChange={e=>setMaxLeads(e.target.value)}/></div>
              <div className="fg"><label className="fl">Min Vol.</label><input className="fi" type="number" value={minSearch} onChange={e=>setMinSearch(e.target.value)}/></div>
            </div>
            <div className="fg"><label className="fl">Min CPC ($)</label><input className="fi" type="number" value={minCpc} step="0.1" onChange={e=>setMinCpc(e.target.value)}/><div className="field-hint">Filter by min cost-per-click</div></div>
          </>)}
          <div className="tog-row"><div><div className="tog-title">Contact Enrichment</div><div className="tog-desc">Reveal verified phone &amp; email via Apollo / Lusha</div></div><div className={'tog '+(enrich?'on':'off')} onClick={()=>setEnrich(!enrich)}><div className="tog-k"></div></div></div>
          <button className={'gen-btn-big '+(loading?'busy':'')} onClick={handleGen} disabled={loading}>
            {loading?<span style={{display:'flex',alignItems:'center',justifyContent:'center',gap:10}}><Spin/>Scanning Leads...</span>:'Generate Leads'}
          </button>
        </div></div>
      </div>

      {/* RIGHT: Dynamic content */}
      <div className="results-col">
        {loading?(
          <InlineProgress phase={phase} logs={logs} progress={progress} counts={counts} theme={theme}/>
        ):hasResults?(
          <>
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:0}}>
              {[{label:'Leads Found',val:stats.total,c:'var(--blue)'},{label:'Emails',val:stats.email,c:'var(--green)'},{label:'Phones',val:stats.phone,c:'var(--amber)'},{label:'Tier 1',val:'12',c:'var(--violet)'}].map((s,i)=>(
                <div className="rsi-card" key={i}><div className="rsi-label">{s.label}</div><div className="rsi-val" style={{color:s.val!=='—'?s.c:'var(--t4)'}}>{s.val}</div>{s.val!=='—'&&<div className="rsi-sub">This run</div>}</div>
              ))}
            </div>
            <div className="card"><div className="card-p">
              <div style={{display:'flex',alignItems:'center',gap:12,padding:'10px 14px',background:'var(--g5)',border:'1.5px solid var(--g20)',borderRadius:9,marginBottom:14}}>
                <div style={{width:28,height:28,borderRadius:'50%',background:'var(--g10)',border:'1.5px solid var(--g20)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--green)',fontWeight:700,flexShrink:0}}>✓</div>
                <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600,color:'var(--t1)'}}>Scan complete — 89 leads found</div><div style={{fontSize:11,color:'var(--t3)'}}>12 Tier 1 · 44 Tier 2 · 33 Tier 3 · 12.8s</div></div>
                <div style={{display:'flex',gap:6}}><button className="btn-sm btn-blue">↓ CSV</button><button className="btn-sm btn-green">↓ Excel</button></div>

              </div>

                    <th style={{cursor:'pointer'}} onClick={()=>{setSortCol('b');setSortDir(d=>d==='asc'?'desc':'asc')}}>Business<SortIcon col="b"/></th>
                    <th>Domain</th><th>Email</th><th>Phone</th>
                    <th style={{cursor:'pointer'}} onClick={()=>{setSortCol('s');setSortDir(d=>d==='asc'?'desc':'asc')}}>Score<SortIcon col="s"/></th>
                  </tr></thead>
                  <tbody>{filteredLeads.length>0?filteredLeads.map((l,i)=><tr key={i}><td>{l.b}</td><td style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--blue)'}}>{l.d}</td><td style={{fontFamily:'var(--mono)',fontSize:10}}><div style={{display:'flex',alignItems:'center',color:l.e!=='—'?'var(--green)':'var(--t3)'}}>{l.e}<CopyBtn text={l.e}/></div></td><td style={{fontFamily:'var(--mono)',fontSize:10}}><div style={{display:'flex',alignItems:'center',color:l.p!=='—'?'var(--amber)':'var(--t3)'}}>{l.p}<CopyBtn text={l.p}/></div></td><td><span className={'sc '+(l.s>=85?'sc-h':'sc-m')}>{l.s}/100</span></td></tr>):<tr><td colSpan={5} style={{textAlign:'center',padding:'20px',color:'var(--t3)',fontFamily:'var(--mono)',fontSize:11}}>No results match "{filter}"</td></tr>}</tbody>
                </table>
                <div style={{textAlign:'center',padding:'10px 0 2px',fontFamily:'var(--mono)',fontSize:9,color:'var(--t3)',letterSpacing:'0.5px'}}>SHOWING {filteredLeads.length} OF 89 — EXPORT FOR FULL DATASET</div>
              </div>
            </div></div>
          </>
        ):(
          <>

                  <div style={{width:28,height:28,borderRadius:7,background:'var(--b5)',border:'1px solid var(--b10)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--blue)',fontSize:14,flexShrink:0}}>{s.icon}</div>
                  <div><div style={{fontSize:12,fontWeight:600,color:'var(--t1)',marginBottom:2}}>{s.title}</div><div style={{fontSize:11,color:'var(--t3)',lineHeight:1.6}}>{s.desc}</div></div>
                </div>
              ))}
            </div></div>
          </>
        )}
      </div>
    </div>
  </>);
}

  {name:'Buninyong',lat:-37.6422,lng:143.8803,leads:5,t1:1,t2:2,t3:2},
];

function HeatmapView({theme}){
  const mapRef=useRef(null);const mapInst=useRef(null);
  const [tierFilter,setTierFilter]=useState('all');
  const [selected,setSelected]=useState(null);
  const isDark=theme==='dark';

  useEffect(()=>{
    const L=window.Leaflet||window.L;
    if(!L||!L.map||!mapRef.current||mapInst.current)return;
    const tileUrl=isDark
      ?'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
      :'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';
    const map=L.map(mapRef.current,{center:[-37.5622,143.8503],zoom:12,zoomControl:false});
    L.tileLayer(tileUrl,{attribution:'© CartoDB',maxZoom:19,subdomains:'abcd'}).addTo(map);
    L.control.zoom({position:'bottomright'}).addTo(map);
    mapInst.current=map;
    // Force map to recalculate size after mount
    setTimeout(()=>map.invalidateSize(),100);
    setTimeout(()=>map.invalidateSize(),500);

    // Heatmap layer
    try{
      if(L.heatLayer){
        const heatPts=SUBURB_DATA.map(s=>[s.lat,s.lng,s.leads/23]);
        L.heatLayer(heatPts,{radius:55,blur:35,maxZoom:14,gradient:{0.2:'#4BB8D9',0.5:'#F59E0B',0.8:'#EF4444'}}).addTo(map);
      }
    }catch(e){console.warn('Heat layer skipped:',e.message)}

    // Markers
    SUBURB_DATA.forEach(s=>{
      const color=s.t1>=4?'#7DBA4B':s.t1>=2?'#F59E0B':'#4BB8D9';
      const icon=L.divIcon({className:'',html:`<div style="width:${8+s.leads/2}px;height:${8+s.leads/2}px;border-radius:50%;background:${color};border:2px solid white;box-shadow:0 0 10px ${color}80;cursor:pointer;transition:transform 0.2s"></div>`,iconAnchor:[0,0]});
      const marker=L.marker([s.lat,s.lng],{icon}).addTo(map);
      marker.bindPopup(`<div style="min-width:160px"><div style="font-weight:700;font-size:13px;margin-bottom:6px">${s.name}</div><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px"><span>Total leads</span><span style="font-weight:600;color:#4BB8D9">${s.leads}</span></div><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px"><span>Tier 1</span><span style="font-weight:600;color:#7DBA4B">${s.t1}</span></div><div style="display:flex;justify-content:space-between;font-size:11px"><span>Tier 2</span><span style="font-weight:600;color:#F59E0B">${s.t2}</span></div></div>`);
    });

    return()=>{if(mapInst.current){mapInst.current.remove();mapInst.current=null;}};
  },[]);

  const sorted=[...SUBURB_DATA].sort((a,b)=>b.leads-a.leads);
  const maxLeads=sorted[0].leads;

  return(<>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
      <div><div style={{fontSize:13,fontWeight:700,color:'var(--t1)'}}>Territory Heatmap</div><div style={{fontSize:11,color:'var(--t3)',marginTop:2}}>Lead density by suburb — click markers for breakdown</div></div>
      <div style={{display:'flex',gap:6}}>
        {['all','t1','t2','t3'].map(f=>(
          <button key={f} className="map-filter-btn" onClick={()=>setTierFilter(f)} style={{background:tierFilter===f?'var(--blue)':'var(--sf)',borderColor:tierFilter===f?'var(--blue)':'var(--bd)',color:tierFilter===f?'#fff':'var(--t2)'}}>
            {f==='all'?'All Tiers':f==='t1'?'Tier 1':f==='t2'?'Tier 2':'Tier 3'}
          </button>
        ))}
      </div>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 260px',gap:16,alignItems:'start'}}>
      <div>
        <div className="map-wrap">
          <div ref={mapRef} className="map-el"></div>
          <div className="map-legend">
            <div className="map-legend-title">Lead Density</div>
            <div className="map-legend-row"><div className="map-legend-dot" style={{background:'#7DBA4B',boxShadow:'0 0 6px #7DBA4B'}}></div>Tier 1 hotspot</div>
            <div className="map-legend-row"><div className="map-legend-dot" style={{background:'#F59E0B',boxShadow:'0 0 6px #F59E0B'}}></div>Tier 2 zone</div>
            <div className="map-legend-row"><div className="map-legend-dot" style={{background:'#4BB8D9',boxShadow:'0 0 6px #4BB8D9'}}></div>Tier 3 area</div>
          </div>
        </div>
      </div>
      <div>
        <div className="card" style={{marginBottom:16}}><div className="card-p" style={{paddingTop:16}}>
          <div style={{fontFamily:'var(--mono)',fontSize:9,letterSpacing:'2px',textTransform:'uppercase',color:'var(--t3)',marginBottom:12}}>SUBURB RANKINGS</div>
          <div className="suburb-list">
            {sorted.map((s,i)=>(
              <div className="suburb-row" key={s.name} onClick={()=>setSelected(selected===s.name?null:s.name)}>
                <span className="suburb-rank">#{i+1}</span>
                <div style={{flex:1}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
                    <span className="suburb-name" style={{fontSize:11}}>{s.name}</span>
                    <span style={{fontFamily:'var(--mono)',fontSize:11,fontWeight:700,color:'var(--blue)'}}>{s.leads}</span>
                  </div>
                  <div className="suburb-bar"><div className="suburb-bar-fill" style={{width:`${(s.leads/maxLeads)*100}%`,background:`linear-gradient(90deg,var(--blue),var(--green))`}}></div></div>
                  {selected===s.name&&<div style={{marginTop:8,display:'flex',gap:8}}>
                    {[{l:'T1',v:s.t1,c:'var(--green)'},{l:'T2',v:s.t2,c:'var(--amber)'},{l:'T3',v:s.t3,c:'var(--t3)'}].map(t=>(
                      <div key={t.l} style={{flex:1,textAlign:'center',padding:'5px 4px',background:'var(--sf2)',borderRadius:6,border:'1px solid var(--bd)'}}>
                        <div style={{fontFamily:'var(--mono)',fontSize:14,fontWeight:700,color:t.c}}>{t.v}</div>
                        <div style={{fontFamily:'var(--mono)',fontSize:8,color:'var(--t3)'}}>{t.l}</div>
                      </div>
                    ))}
                  </div>}
                </div>
              </div>
            ))}
          </div>
        </div></div>
        <div className="card"><div className="card-p" style={{paddingTop:16}}>
          <div style={{fontFamily:'var(--mono)',fontSize:9,letterSpacing:'2px',textTransform:'uppercase',color:'var(--t3)',marginBottom:10}}>TERRITORY SUMMARY</div>
          <div className="sr"><span className="sk">Suburbs scanned</span><span className="sv bl">10</span></div>
          <div className="sr"><span className="sk">Total leads</span><span className="sv gr">128</span></div>
          <div className="sr"><span className="sk">Highest density</span><span className="sv bl">Ballarat Central</span></div>
          <div className="sr"><span className="sk">Best suburb</span><span className="sv gr">Sebastopol (T1:6)</span></div>
          <div className="sr"><span className="sk">Coverage radius</span><span className="sv">~25 km</span></div>
        </div></div>
      </div>
    </div>
  </>);
}

function useLiveStats(){
  const [s,setS]=useState({db:4892,dupes:1247,kw:2847,learned:23,health:98.2});

  useEffect(()=>{

    };
    const t1=setInterval(()=>tick('db',Math.floor(1+Math.random()*6),(v,d)=>v+d),9500);
    const t2=setInterval(()=>tick('learned',1,(v,d)=>v+d),24000);
    const t3=setInterval(()=>tick('dupes',Math.floor(1+Math.random()*3),(v,d)=>v+d),14500);
    const t4=setInterval(()=>tick('kw',1,(v,d)=>v+d),32000);
    const t5=setInterval(()=>tick('health',0,(v,d)=>{const j=(Math.random()-0.5)*0.2;return Math.max(96,Math.min(99.8,+(v+j).toFixed(1)))}),18000);
    return()=>[t1,t2,t3,t4,t5].forEach(clearInterval);
  },[]);
  return{s,flash};
}

  const [logs,setLogs]=useState([]);
  const [progress,setProgress]=useState(0);
  const [counts,setCounts]=useState({total:0,emails:0,phones:0,tier1:0});
  const [toast,setToast]=useState(null);
  const [hasResults,setHasResults]=useState(false);
  const [stats,setStats]=useState({paid:'—',organic:'—',total:'—',phone:'—',email:'—',personal:'—',direct:'—',semrush:'—',apollo:'—',lusha:'—'});
  const timers=useRef([]);
  const {c:liveCredits,last:liveCreditsLast}=useLiveCredits();

  useEffect(()=>{document.documentElement.setAttribute('data-theme',theme)},[theme]);
  useEffect(()=>{if(toast){const id=setTimeout(()=>setToast(null),4200);return()=>clearTimeout(id)}},[toast]);
  // Periodic card shimmer — ambient premium motion
  useEffect(()=>{
    const t=setInterval(()=>{
      const cards=[...document.querySelectorAll('.card')].filter(c=>c.offsetParent!==null);
      if(!cards.length)return;
      const pick=cards[Math.floor(Math.random()*cards.length)];
      pick.classList.add('shimmer');
      setTimeout(()=>pick.classList.remove('shimmer'),1700);
    },12000);
    return()=>clearInterval(t);
  },[]);
  const prevNav=useRef(null);
  useEffect(()=>{
    if(!window.anime)return;
    // Entrance animations with Anime.js
    window.anime({targets:'.crd',translateY:[20,0],opacity:[0,1],duration:650,delay:window.anime.stagger(90,{start:150}),easing:'easeOutExpo'});
    window.anime({targets:'.card',translateY:[14,0],opacity:[0,1],duration:580,delay:window.anime.stagger(70,{start:100}),easing:'easeOutExpo'});
    prevNav.current=nav;
  },[nav]);

  const runGeneration=()=>{
    if(loading)return;
    timers.current.forEach(clearTimeout);timers.current=[];
    setLoading(true);setPhase(0);setLogs([]);setProgress(0);
    setNav('generate'); // Always show generate view during run
    setCounts({total:0,emails:0,phones:0,tier1:0});setHasResults(false);
    let delay=0;
    LOGS.forEach(log=>{delay+=300+Math.random()*230;const t=setTimeout(()=>{const ts=new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});setLogs(prev=>[...prev,{...log,ts}])},delay);timers.current.push(t)});
    [[0,0],[1000,1],[2900,2],[5100,3],[7600,4],[10000,5],[11500,6]].forEach(([d,p])=>{const t=setTimeout(()=>{setPhase(p);setProgress(Math.round((p/STEPS.length)*100))},d);timers.current.push(t)});
    [[1800,{total:12,emails:8,phones:7,tier1:3}],[4200,{total:38,emails:26,phones:21,tier1:7}],[7000,{total:71,emails:48,phones:40,tier1:10}],[10500,{total:89,emails:62,phones:51,tier1:12}]].forEach(([d,c])=>{const t=setTimeout(()=>setCounts(c),d);timers.current.push(t)});
    const s1=setTimeout(()=>setStats({paid:'23',organic:'66',total:'89',phone:'51',email:'62',personal:'28',direct:'19',semrush:'47',apollo:'62',lusha:'19'}),9000);timers.current.push(s1);
    const s2=setTimeout(()=>{setLoading(false);setProgress(100);setHasResults(true);setToast({t:'Scan Complete',m:'89 leads found — 12 Tier 1 opportunities'})},12500);timers.current.push(s2);
  };

  const VIEW_TITLES={generate:{title:<>Lead <em>Generation</em> Engine</>,sub:'Configure your search and generate qualified leads'},analytics:{title:<>Analytics <em>& Insights</em></>,sub:'Performance overview across all runs'},heatmap:{title:<>Geographic <em>Heatmap</em></>,sub:'Ballarat suburb-level lead density visualization'},history:{title:<>Run <em>History</em></>,sub:'All previous lead generation runs'},intelligence:{title:<>AI <em>Intelligence</em></>,sub:'Master database · ML keyword learning · self-expanding dictionary'},pipeline:{title:<>Lead <em>Pipeline</em></>,sub:'Manage and track leads through your sales process'},schedule:{title:<>Scheduled <em>Runs</em></>,sub:'Automate your lead generation on a recurring schedule'},users:{title:<>Team <em>Management</em></>,sub:'Manage users, roles, and permissions'},settings:{title:<>Platform <em>Settings</em></>,sub:'API keys, preferences, and billing'}};
  const vt=VIEW_TITLES[nav]||{title:nav,sub:''};

  return(<>
    {showSplash&&<Splash onDone={()=>setShowSplash(false)} theme={theme}/>}
    <Sidebar nav={nav} setNav={setNav} srvUrl={srvUrl} setSrvUrl={setSrvUrl} onConnect={()=>setToast({t:'Connected',m:'Railway endpoint verified'})} credits={liveCredits} lastDrain={liveCreditsLast}/>

    <main className="main">
      <div className="topbar">
        <div className="tb-left">
          <div className="tb-title">{vt.title}</div>
          <div className="tb-sub">{vt.sub}</div>
        </div>
        <div className="tb-right">
          <button className="demo-btn" onClick={runGeneration}><span className="demo-dot"></span>Demo Run</button>
          <div className="tb-clock">{clock} AEST</div>
          <button className="theme-btn" onClick={()=>setTheme(t=>t==='dark'?'light':'dark')}><Icon name={theme==='dark'?'sun':'moon'} size={14} style={{marginRight:6,verticalAlign:-2}}/>{theme==='dark'?'Light Mode':'Dark Mode'}</button>
          <div className="tb-conn"><span className="tb-cdot"></span>Connected</div>
        </div>
      </div>

      {nav==='generate'&&<GenerateView tab={tab} setTab={setTab} stats={stats} hasResults={hasResults} onGenerate={runGeneration} loading={loading} country={country} setCountry={setCountry} cityTier={cityTier} setCityTier={setCityTier} city={city} setCity={setCity} industry={industry} setIndustry={setIndustry} indCountry={indCountry} setIndCountry={setIndCountry} maxLeads={maxLeads} setMaxLeads={setMaxLeads} minSearch={minSearch} setMinSearch={setMinSearch} minCpc={minCpc} setMinCpc={setMinCpc} enrich={enrich} setEnrich={setEnrich} onNav={setNav} phase={phase} logs={logs} progress={progress} counts={counts} theme={theme}/>}
      {nav==='analytics'&&<AnalyticsView theme={theme}/>}
      {nav==='heatmap'&&<HeatmapView theme={theme}/>}
      {nav==='history'&&<HistoryView/>}
      {nav==='intelligence'&&<IntelligenceView theme={theme}/>}
      {nav==='pipeline'&&<PipelineView/>}
      {nav==='schedule'&&<ScheduleView/>}
      {nav==='users'&&<UsersView/>}
      {nav==='settings'&&<SettingsView/>}
    </main>

    {/* Drawer hidden — progress shown inline on Generate view */}

    {!drawerOpen&&<div className="ticker"><div className="ticker-lbl">◈ live</div><div className="ticker-tr"><div className="ticker-in">{TICKERS.map((t,i)=><span className="ti" key={i}><b>{t.b}</b>{t.t}</span>)}</div></div></div>}

    {!drawerOpen&&<LiveActivityFeed/>}
    {toast&&<div className="toast"><div className="toast-ic">✓</div><div><div className="toast-title">{toast.t}</div><div className="toast-msg">{toast.m}</div></div></div>}
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
