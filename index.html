            {!c.transcript&&c.recording_url&&<span style={{color:'var(--t3)',fontSize:12}}>transcript pending…</span>}
          </div>
          {openTx[c.id]&&c.transcript&&<div style={{marginTop:8,padding:'10px 12px',background:'var(--bg)',border:'1px solid var(--bd)',borderRadius:8,maxHeight:240,overflow:'auto',color:'var(--t1)',fontSize:13,lineHeight:1.5,whiteSpace:'pre-wrap'}}>{c.transcript}</div>}
        </div>);
      })}
    </LDSection>

    {/* Record details */}
    <LDSection title="Record details">
      <LDField label="Lead ID" value={lead.lead_code||lfId(lead.id)} mono/>
      <LDField label="Industry" value={lead.industry}/>
      <LDField label="Country" value={lead.country}/>
      <LDField label="Traffic source" value={lead.traffic_source}/>
      <LDField label="Allocation" value={lead.alloc_status}/>
      <LDField label="Assigned BDE" value={lead.assigned_bde_name||lead.assigned_bde_username}/>
      <LDField label="First seen" value={lead.first_seen_at?String(lead.first_seen_at).replace('T',' ').slice(0,16):''}/>
      <LDField label="Cost / lead" value={lead.cost_per_lead_usd!=null?('$'+Number(lead.cost_per_lead_usd).toFixed(2)):''}/>
    </LDSection>
  </div>);
}

/* ─── APP ─── */
function App({user, onLogout}){
  const clock=useClock();
  const [showSplash,setShowSplash]=useState(true);
  const [theme,setTheme]=useState('light');
  const [nav,setNav]=useState('generate');
  // Phase 2: which lead's full page is open (set by the "+" button).
  const [selectedLeadId,setSelectedLeadId]=useState(null);
  const [tab,setTab]=useState('cities');
  // City mode (AU-only). auState is an AU state code (NSW/VIC/QLD/...) or
  // 'AUSTRALIA' for the synthetic whole-country scope. Defaults match the
  // legacy index_legacy.html: whole country + Tier 1 capitals.
  const [auState,setAuState]=useState('AUSTRALIA');
  const [cityTier,setCityTier]=useState('Tier 1 cities');
  const [city,setCity]=useState('all');
  const [auCities,setAuCities]=useState(null);     // cached /api/au-cities payload
  const [nWorkers,setNWorkers]=useState(4);
  // Industry mode. Default to "Select an industry" so the dropdown forces a
  // valid pick from the live /industries list (server's keys won't match a
  // hardcoded preset like 'Plumbing & Gas Fitting').
  const [industry,setIndustry]=useState('Select an industry');
  const [indCountry,setIndCountry]=useState('AU');
  const [maxLeads,setMaxLeads]=useState('10');
  const [minSearch,setMinSearch]=useState('100');
  const [minCpc,setMinCpc]=useState('1.0');
  // 2026-06-14: Contact Enrichment OFF by default (user requirement).
  const [enrich,setEnrich]=useState(false);
  // 2026-06-08: "SerpAPI only" toggle. false = SerpAPI + SEMrush; true =
  // bypass SEMrush entirely this run.
  // 2026-06-14: DEFAULT ON (user requirement) — SerpAPI only / bypass SEMrush.
  const [serpOnly,setSerpOnly]=useState(true);
  // 2026-06-09: Regular (thorough) SerpAPI mode. DEFAULT OFF → the app runs in
  // credit-saving mode (run-wide SerpAPI cap ≈14 calls/lead). Toggle ON to
  // restore the old thorough behaviour (many more SerpAPI credits per lead).
  const [regularMode,setRegularMode]=useState(false);
  // 2026-06-11: "Paid only" — export EVERY confirmed advertiser (no Max-Leads
  // cap, Max Leads becomes the floor); drops unverified leads.
  // 2026-06-12: DEFAULT ON — standing requirement: all confirmed advertisers
  // always export, even past Max Leads.
  const [paidOnly,setPaidOnly]=useState(true);
  // Phase 2 (2026-05-06): default the server URL to current origin so the
  // SPA works wherever it's hosted (Railway, local dev, etc.). The user can
  // still override it in the Sidebar field.
  const [srvUrl,setSrvUrl]=useState((typeof window!=='undefined'&&window.location.origin)||'');
  const [industries,setIndustries]=useState([]);
  // Top CSV / partial CSV state — shown after a run completes / cancels.
  const [topCsvText,setTopCsvText]=useState('');
  const [partialCsvUrl,setPartialCsvUrl]=useState('');
  const [currentJobId,setCurrentJobId]=useState('');
  const [loading,setLoading]=useState(false);
  const [drawerOpen,setDrawerOpen]=useState(false);
  const [phase,setPhase]=useState(-1);
  const [logs,setLogs]=useState([]);
  const [progress,setProgress]=useState(0);
  const [counts,setCounts]=useState({total:0,emails:0,phones:0,tier1:0});
  const [toast,setToast]=useState(null);
  const [hasResults,setHasResults]=useState(false);
  const [stats,setStats]=useState({paid:'—',organic:'—',total:'—',phone:'—',email:'—',personal:'—',direct:'—',semrush:'—',apollo:'—',lusha:'—'});
  // 2026-05-21: REAL leads from the run (replaces the hardcoded LEADS mock).
  // Populated from /status/<job>.leads when state==='done'. The results
  // table now renders this array; if empty AND the run finished, the table
  // shows a clear "0 leads found" empty state instead of mock data.
  const [realLeads,setRealLeads]=useState([]);
  // 2026-05-25: persistent post-run banner state. The toast auto-dismisses
  // after 4.2s, so error/cancel/empty-result outcomes vanished before the
  // user could read them — page looked identical to the pre-run home view.
  // This state survives until the next run starts and drives a HUGE
  // unmissable banner at the top of the results column.
  //   shape: { kind: 'success'|'empty'|'cancelled'|'error',
  //            leadsCount: int,
  //            reason: string,
  //            partialUrl: string|null }
  const [runOutcome,setRunOutcome]=useState(null);
  // Phase 2 (2026-05-15): per-run credit usage tracker. Captured as
  // (snapshot at run start) - (snapshot after run finishes); both pulled
  // from /api/credits/refresh. Displayed in the post-run results panel
  // alongside "per lead" averages so the user sees the exact cost of
  // every run, broken out by Apollo export/phone/email + SEMrush + Lusha.
  const [creditsUsedThisRun,setCreditsUsedThisRun]=useState(null);
  const creditsSnapshotRef=useRef(null);
  // 2026-05-18 (round 2): live in-run API counters. Polled every 500ms
  // from /status/<job>.live by runGeneration, rendered inside the
  // InlineProgress "Live API spend" card so the user sees SEMrush units
  // and Apollo calls ticking up in real time during the run.
  const [liveJob,setLiveJob]=useState(null);
  const timers=useRef([]);
  const {c:liveCredits,last:liveCreditsLast,details:liveCreditsDetails,refresh:refreshCredits}=useLiveCredits();

  useEffect(()=>{document.documentElement.setAttribute('data-theme',theme)},[theme]);
  useEffect(()=>{if(toast){const id=setTimeout(()=>setToast(null),4200);return()=>clearTimeout(id)}},[toast]);
  // Periodic card shimmer — ambient premium motion
  useEffect(()=>{
    const t=setInterval(()=>{
      const cards=[...document.querySelectorAll('.card')].filter(c=>c.offsetParent!==null);
      if(!cards.length)return;
      const pick=cards[Math.floor(Math.random()*cards.length)];
      pick.classList.add('shimmer');
      setTimeout(()=>pick.classList.remove('shimmer'),1700);
    },12000);
    return()=>clearInterval(t);
  },[]);
  const prevNav=useRef(null);
  useEffect(()=>{
    if(!window.anime)return;
    // Entrance animations with Anime.js
    window.anime({targets:'.crd',translateY:[20,0],opacity:[0,1],duration:650,delay:window.anime.stagger(90,{start:150}),easing:'easeOutExpo'});
    window.anime({targets:'.card',translateY:[14,0],opacity:[0,1],duration:580,delay:window.anime.stagger(70,{start:100}),easing:'easeOutExpo'});
    prevNav.current=nav;
  },[nav]);

  // Phase 2 (2026-05-06): runs the actual pipeline via /generate or
  // /generate-city, then polls /status/<job_id> for live progress, logs,
  // valid-lead counts, partial CSV availability, and final summary.
  // Replaces the simulated runGeneration() that walked through fake
  // LOGS / STEPS arrays. Auth: 401 → redirect to /login.
  const runGeneration=async ()=>{
    if(loading)return;
    timers.current.forEach(id=>{try{clearTimeout(id);clearInterval(id)}catch(e){}});timers.current=[];
    // Phase 2 (2026-05-15): capture credit snapshot BEFORE the run so we can
    // compute (before - after) per-pool usage when the run finishes. Pulled
    // from the live cache; if it hasn't loaded yet, the diff is suppressed.
    creditsSnapshotRef.current=liveCreditsDetails;
    setCreditsUsedThisRun(null);
    // 2026-05-18 (round 2): reset the live in-run counters card to zero so
    // it doesn't show stale numbers from the previous run.
    setLiveJob(null);
    // Phase 2 (2026-05-15): logs are NO LONGER wiped between runs — the user
    // explicitly wants persistence across runs. We append a divider line so
    // the boundary is visible. The previous behaviour (setLogs([])) cleared
    // valuable diagnostic history every time a new scan started.
    setLoading(true);setPhase(0);setProgress(0);
    setLogs(prev=>{
      const ts=new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      const divider={ts,tag:'sys',msg:'═══════════ New run started ═══════════'};
      return prev&&prev.length?[...prev,divider]:[divider];
    });
    setNav('generate');
    setCounts({total:0,emails:0,phones:0,tier1:0});
    setHasResults(false);setTopCsvText('');setPartialCsvUrl('');setRealLeads([]);setRunOutcome(null);
    const base=(typeof window!=='undefined'&&window.location.origin)||'';
    const isCity=tab==='cities';
    const endpoint=isCity?'/generate-city':'/generate';
    // Map UI cityTier label → backend tier code expected by /generate-city.
    const _tierMap={'All city tiers':'all','Tier 1 cities':'tier_1','Tier 2 cities':'tier_2','Tier 3 cities':'tier_3'};
    // Guard against empty industry pick — backend expects a non-empty key.
    if(!isCity&&(!industry||industry==='Select an industry')){
      setLoading(false);
      setToast({t:'Pick an industry',m:'Choose an industry from the dropdown to start a run.'});
      return;
    }
    const payload=isCity?{
      // auState is already an AU state code (NSW/VIC/...) or 'AUSTRALIA'.
      state_code:auState||'AUSTRALIA',
      tier:_tierMap[cityTier]||'tier_1',
      city:city||'all',
      min_volume:parseInt(minSearch)||100,
      max_leads:parseInt(maxLeads)||0,
      enrichment:enrich,country:'AU',n_workers:parseInt(nWorkers)||4,
      disable_semrush:serpOnly,
      credit_saver:!regularMode,
      paid_only_all:paidOnly,
    }:{
      industry:industry,
      // indCountry is already a backend code (AU/USA/UK/India).
      country:indCountry||'AU',
      min_volume:parseInt(minSearch)||100,
      min_cpc:parseFloat(minCpc)||0.05,
      max_leads:parseInt(maxLeads)||0,
      enrichment:enrich,
      disable_semrush:serpOnly,
      credit_saver:!regularMode,
      paid_only_all:paidOnly,
    };
    let jobId='';
    try{
      const r=await fetch(base+endpoint,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        credentials:'same-origin',
        body:JSON.stringify(payload),
      });
      if(r.status===401){window.dispatchEvent(new Event('lf-auth-lost'));return;}
      const data=await r.json();
      if(!r.ok||data.error){
        setLoading(false);
        setToast({t:'Error',m:data.error||('HTTP '+r.status)});
        return;
      }
      jobId=data.job_id;setCurrentJobId(jobId);
    }catch(e){
      setLoading(false);
      setToast({t:'Network error',m:e.message||'Could not reach server'});
      return;
    }
    // Poll status. Each tick: append new_logs, update progress + valid lead
    // count, watch for state transitions (done / cancelled / error).
    const pollId=setInterval(async ()=>{
      try{
        const r=await fetch(base+'/status/'+jobId,{credentials:'same-origin'});
        if(r.status===401){clearInterval(pollId);window.dispatchEvent(new Event('lf-auth-lost'));return;}
        if(!r.ok)return;
        const s=await r.json();
        if(typeof s.progress==='number'){
          setProgress(s.progress);
          // Phase 2 (2026-05-06): map server progress% to InlineProgress's
          // 7-step indicator. STEPS has ~7 items; phase index = floor(p/14).
          setPhase(Math.min(6,Math.floor((s.progress||0)/14)));
        }
        if(Array.isArray(s.new_logs)&&s.new_logs.length){
          const ts=new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
          setLogs(prev=>[...prev,...s.new_logs.map(line=>{
            // Parse leading [TAG] from V5 log lines and map to the 7 colors
            // InlineProgress styles. Falls back to 'sys' for plain output.
            const txt=String(line||'');
            const m=txt.match(/^\s*\[([^\]]+)\]\s*(.+)$/);
            let tag='sys',msg=txt;
            if(m){msg=m[2]; const k=m[1].toLowerCase();
              if(/phase/.test(k))tag='scan';
              else if(/valid|done|complete|success|ok/.test(k))tag='ok';
              else if(/error|fail/.test(k))tag='err';
              else if(/apollo|lusha|hunter|enrich|email|phone/.test(k))tag='enrich';
              else if(/score|tier/.test(k))tag='score';
              else if(/find|discover|domain|seed/.test(k))tag='find';
              else tag='sys';
            }
            return{ts,tag,msg};
          })]);
        }
        if(typeof s.valid_leads_in_progress==='number'){
          setCounts(c=>({...c,total:s.valid_leads_in_progress}));
        }
        // 2026-05-18 (round 2): stream the in-run API counters into the
        // InlineProgress live panel. `s.live` is populated by /status while
        // the pipeline is still running; absence = pipeline not attached yet.
        if(s.live&&typeof s.live==='object'){
          setLiveJob(s.live);
        }
        if(s.state==='done'){
          clearInterval(pollId);
          setLoading(false);setProgress(100);setHasResults(true);
          // 2026-05-21: capture the REAL leads from /status payload.
          // Each lead dict from V5 has: name, domain, company, role, phone,
          // email, source, _domain_source, _google_intent, _silent_scope_apollo,
          // _direct_phone, etc. The table-row mapper below maps these to
          // the column shape it expects.
          setRealLeads(Array.isArray(s.leads)?s.leads:[]);
          const sm=s.summary||{};
          // Phase 2 (2026-05-07): use explicit ternary instead of mixing
          // ?? with ||/&& at the top level — that's a SyntaxError in JS and
          // prevents Babel from transpiling the entire script.
          const _fallback=(v,fb)=>(v===null||v===undefined?fb:v);
          setStats({
            paid:String(_fallback(sm.paid_leads,'—')),
            organic:String(_fallback(sm.organic_leads,'—')),
            total:String(_fallback(sm.total_leads,(s.leads&&s.leads.length)||'—')),
            phone:String(_fallback(sm.with_phone,'—')),
            email:String(_fallback(sm.with_email,'—')),
            personal:String(_fallback(sm.personal_emails,'—')),
            direct:String(_fallback(sm.direct_phones,'—')),
            semrush:String(_fallback(sm.semrush_tokens,'—')),
            apollo:String(_fallback(sm.apollo_tokens,'—')),
            lusha:String(_fallback(sm.lusha_tokens,'—')),
          });
          if(s.top_csv)setTopCsvText(s.top_csv);
          // 2026-05-25: persistent post-run banner (toast auto-dismisses in 4s).
          // Reads `empty_result` from summary so the banner can distinguish
          // "ran successfully but found 0 leads" from "real success with leads".
          (function _setOutcome(){
            const _n=Number(sm.total_leads||0)||(Array.isArray(s.leads)?s.leads.length:0);
            const _empty=Boolean(sm.empty_result)||_n===0;
            setRunOutcome({
              kind: _empty?'empty':'success',
              leadsCount:_n,
              reason: _empty?(sm.empty_result_reason||'Pipeline finished but produced 0 leads. See log feed for [FUNNEL]/[KEY-HEALTH] lines.'):'',
              partialUrl: null,
            });
          })();
          setToast({t:'Scan Complete',m:((sm.total_leads??0)+' leads found')});
          // Phase 2 (2026-05-15): credit-usage diff. Force-refresh /api/credits
          // (bypasses the 60s cache), then subtract from the pre-run snapshot
          // so the user sees the exact credit cost of THIS run, broken out by
          // pool (Apollo export / phone / email / total, plus SEMrush + Lusha)
          // and divided by total leads for the per-lead averages they asked for.
          try{
            const after=(refreshCredits?await refreshCredits():null);
            const before=creditsSnapshotRef.current;
            const _num=v=>(typeof v==='number'&&isFinite(v)?v:null);
            const _diff=(b,a)=>{const bn=_num(b),an=_num(a);return(bn!==null&&an!==null)?Math.max(0,bn-an):null;};
            const bA=(before&&before.services&&before.services.apollo)||{};
            const aA=(after&&after.services&&after.services.apollo)||{};
            const bS=(before&&before.services&&before.services.semrush)||{};
            const aS=(after&&after.services&&after.services.semrush)||{};
            const bL=(before&&before.services&&before.services.lusha)||{};
            const aL=(after&&after.services&&after.services.lusha)||{};
            const leadsCount=Number(_fallback(sm.total_leads,(s.leads&&s.leads.length)||0))||0;
            const _per=v=>(v!==null&&leadsCount>0?(v/leadsCount):null);
            // 2026-05-18: pull SEMrush per-phase unit breakdown from
            // s.summary (populated by V5.py /generate(-city) summary build).
            // Falls back gracefully when the backend payload is missing
            // any of these fields (older deploys etc.).
            const _semUnits=_num(sm.semrush_units_used);
            const _semBudget=_num(sm.semrush_unit_budget);
            const _semByPhase=(sm.semrush_units_by_phase&&typeof sm.semrush_units_by_phase==='object')?sm.semrush_units_by_phase:{};
            const _semSkipped=_num(sm.semrush_calls_skipped)||0;
            setCreditsUsedThisRun({
              leads:leadsCount,
              apollo_total:_diff(bA.remaining,aA.remaining),
              apollo_export:_diff(bA.export_remaining,aA.export_remaining),
              apollo_phone:_diff(bA.phone_remaining,aA.phone_remaining),
              apollo_email:_diff(bA.email_remaining,aA.email_remaining),
              semrush_total:_diff(bS.remaining,aS.remaining),
              lusha_total:_diff(bL.remaining,aL.remaining),
              per_lead:{
                apollo_total:_per(_diff(bA.remaining,aA.remaining)),
                apollo_export:_per(_diff(bA.export_remaining,aA.export_remaining)),
                apollo_phone:_per(_diff(bA.phone_remaining,aA.phone_remaining)),
                apollo_email:_per(_diff(bA.email_remaining,aA.email_remaining)),
                semrush_total:_per(_diff(bS.remaining,aS.remaining)),
                lusha_total:_per(_diff(bL.remaining,aL.remaining)),
              },
              // Backend-reported SEMrush telemetry (canonical, includes the
              // weighted unit cost the budget guard tracks against — usually
              // very close to the (before-after) SEMrush diff, but breaks it
              // out per pipeline phase so the user can see where credits went).
              semrush_units_used:_semUnits,
              semrush_unit_budget:_semBudget,
              semrush_units_per_lead:(_semUnits!==null&&leadsCount>0?(_semUnits/leadsCount):null),
              semrush_units_by_phase:_semByPhase,
              semrush_calls_skipped:_semSkipped,
            });
          }catch(_e){/* diff is best-effort; absence is non-fatal */}
        }else if(s.state==='cancelled'||s.state==='error'){
          clearInterval(pollId);
          setLoading(false);
          // 2026-05-25: surface the outcome as a persistent banner AND set
          // hasResults so the right column doesn't fall back to the empty
          // "What you'll get" home view. Without this, an error run looked
          // identical to "user hasn't clicked Generate yet".
          setHasResults(true);
          if(s.partial_csv_available){
            setPartialCsvUrl(base+'/download-partial/'+jobId);
          }
          const _partial=s.partial_csv_available?(base+'/download-partial/'+jobId):null;
          const msg=s.state==='cancelled'
            ?('Run cancelled'+(s.partial_csv_available?' — partial CSV available':''))
            :('Pipeline error: '+(s.error||'unknown')+(s.partial_csv_available?' — partial CSV available':''));
          setRunOutcome({
            kind:s.state==='cancelled'?'cancelled':'error',
            leadsCount:0,
            reason:msg,
            partialUrl:_partial,
          });
          setToast({t:s.state==='cancelled'?'Cancelled':'Error',m:msg});
        }
      }catch(e){/* keep polling on transient errors */}
    },500);   /* 2026-05-18 (round 2): 500ms poll for live counter updates */
    timers.current.push(pollId);
  };

  // Cancel the running job.
  const cancelGeneration=async ()=>{
    try{
      const base=(typeof window!=='undefined'&&window.location.origin)||'';
      await fetch(base+'/cancel',{method:'POST',credentials:'same-origin'});
    }catch(e){/* silent */}
  };

  // Fetch the industries dropdown list once at mount.
  useEffect(()=>{
    const base=(typeof window!=='undefined'&&window.location.origin)||'';
    fetch(base+'/industries',{credentials:'same-origin'}).then(r=>{
      if(r.status===401){window.dispatchEvent(new Event('lf-auth-lost'));return null;}
      if(!r.ok)return null;
      return r.json();
    }).then(data=>{if(data&&Array.isArray(data.industries))setIndustries(data.industries)}).catch(()=>{});
  },[]);

  // Fetch AU state/tier/city dataset once at mount. Drives the city-mode
  // dropdowns. Shape: {australia:{tier_1:[],tier_2:[],tier_3:[]}, states:[{code,name,tier_1,tier_2,tier_3}]}
  useEffect(()=>{
    const base=(typeof window!=='undefined'&&window.location.origin)||'';
    fetch(base+'/api/au-cities',{credentials:'same-origin'}).then(r=>{
      if(r.status===401){window.dispatchEvent(new Event('lf-auth-lost'));return null;}
      if(!r.ok)return null;
      return r.json();
    }).then(data=>{if(data&&!data.error)setAuCities(data)}).catch(()=>{});
  },[]);

  // BDE accounts can only ever sit on their two views. (Auth itself is handled
  // by the Root wrapper — App only mounts once a user is signed in.)
  useEffect(()=>{
    if(user&&user.role==='bde'){
      setNav(n=>(['my-leads','my-day','my-mobile','profile','lead-detail'].includes(n))?n:'my-leads');
    }
  },[user]);

  const role=(user&&user.role)||'admin';
  const isBde=role==='bde';

        </div>

      <ErrorBoundary key={nav+':'+String(selectedLeadId)}>
      {nav==='generate'&&!isBde&&<GenerateView tab={tab} setTab={setTab} stats={stats} hasResults={hasResults} onGenerate={runGeneration} onCancel={cancelGeneration} loading={loading} auState={auState} setAuState={setAuState} cityTier={cityTier} setCityTier={setCityTier} city={city} setCity={setCity} industry={industry} setIndustry={setIndustry} indCountry={indCountry} setIndCountry={setIndCountry} maxLeads={maxLeads} setMaxLeads={setMaxLeads} minSearch={minSearch} setMinSearch={setMinSearch} minCpc={minCpc} setMinCpc={setMinCpc} enrich={enrich} setEnrich={setEnrich} serpOnly={serpOnly} setSerpOnly={setSerpOnly} nWorkers={nWorkers} setNWorkers={setNWorkers} onNav={setNav} phase={phase} logs={logs} progress={progress} counts={counts} theme={theme} industries={industries} auCities={auCities} topCsvText={topCsvText} partialCsvUrl={partialCsvUrl} liveCreditsDetails={liveCreditsDetails} creditsUsedThisRun={creditsUsedThisRun} liveJob={liveJob} realLeads={realLeads} runOutcome={runOutcome}/>}
      {nav==='database'&&!isBde&&<DatabaseView onOpenLead={(id)=>{setSelectedLeadId(id);setNav('lead-detail');}}/>}
      {nav==='cost'&&!isBde&&<CostView/>}
      {nav==='allocation'&&!isBde&&<AllocationView onOpenLead={(id)=>{setSelectedLeadId(id);setNav('lead-detail');}}/>}
      {nav==='users'&&!isBde&&<UsersView/>}
      {nav==='kpis'&&!isBde&&<KpiView/>}
      {nav==='crawler'&&!isBde&&<CrawlerView onOpenLead={(id)=>{setSelectedLeadId(id);setNav('lead-detail');}}/>}
      {nav==='profile'&&<MyProfileView user={user}/>}
      {nav==='my-day'&&isBde&&<MyDayView user={user} onOpenLead={(id)=>{setSelectedLeadId(id);setNav('lead-detail');}}/>}
      {nav==='my-leads'&&isBde&&<BdeLeadsView user={user} onOpenLead={(id)=>{setSelectedLeadId(id);setNav('lead-detail');}}/>}
      {nav==='my-mobile'&&<MyMobileView user={user}/>}
      {nav==='lead-detail'&&<LeadDetailView leadId={selectedLeadId} user={user} onBack={()=>setNav(isBde?'my-leads':'database')}/>}
      {/* 2026-06-04: mock placeholder views removed (Analytics/Heatmap/
          History/AI Intelligence/Pipeline/Schedule/Users/Settings). */}
      </ErrorBoundary>
    </main>

    {/* Drawer hidden — progress shown inline on Generate view */}

    {/* 2026-06-04: fake status ticker removed (it showed hardcoded untrue
        claims like "SerpAPI unlimited" / "SEMrush 50,000 searches"). Live
        credit numbers already appear in the Generate view's credit panel. */}

    {/* 2026-06-14: bottom-right simulated activity pop-up (LiveActivityFeed)
        removed per user request — it surfaced decorative "API endpoint
        update / keyword found" messages that aren't real run events. */}
    {/* 2026-06-09: bottom-of-page SerpAPI mode toggle. Default OFF = credit-
        saving mode (run-wide SerpAPI cap ≈14 calls/lead). ON = regular thorough
        mode (uses many more SerpAPI credits, the old behaviour). */}
    {!isBde&&<div style={{position:'fixed',left:0,right:0,bottom:0,zIndex:300,display:'flex',
                 alignItems:'center',justifyContent:'center',gap:12,padding:'7px 14px',
                 background:'var(--sf)',borderTop:'1px solid var(--bd)',fontSize:11,
                 color:'var(--t2)',fontFamily:'var(--mono)'}}>
      <span style={{letterSpacing:'1px',textTransform:'uppercase',color:'var(--t3)'}}>SerpAPI mode</span>
      <span style={{color:!regularMode?'var(--green)':'var(--t3)',fontWeight:!regularMode?700:400}}>Credit-saving (~5–15/lead)</span>
      <div className={'tog '+(regularMode?'on':'off')} style={{transform:'scale(0.8)'}} onClick={()=>setRegularMode(v=>!v)}><div className="tog-k"></div></div>
      <span style={{color:regularMode?'var(--amber)':'var(--t3)',fontWeight:regularMode?700:400}}>Regular / thorough (more credits)</span>
      <span style={{margin:'0 6px',color:'var(--bd)'}}>|</span>
      <span style={{letterSpacing:'1px',textTransform:'uppercase',color:'var(--t3)'}}>Paid only</span>
      <div className={'tog '+(paidOnly?'on':'off')} style={{transform:'scale(0.8)'}} onClick={()=>setPaidOnly(v=>!v)} title="Export ALL confirmed advertisers (no Max-Leads cap); drop unverified"><div className="tog-k"></div></div>
      <span style={{color:paidOnly?'var(--green)':'var(--t3)',fontWeight:paidOnly?700:400}}>{paidOnly?'all confirmed advertisers (Max Leads = floor)':'off (respect Max Leads)'}</span>
    </div>}
    {toast&&<div className="toast"><div className="toast-ic">✓</div><div><div className="toast-title">{toast.t}</div><div className="toast-msg">{toast.m}</div></div></div>}
  </>);
}

function CrawlerView({onOpenLead}){
  const [s,setS]=useState(null); const [msg,setMsg]=useState('');
  const [bucket,setBucket]=useState(null); const [rows,setRows]=useState([]); const [rowsLoading,setRowsLoading]=useState(false);
  const [probe,setProbe]=useState(null); const [probing,setProbing]=useState(false);
  const testKey=async()=>{ setProbing(true); setProbe(null);
    const d=await apiJSON('/api/crawler/openai-test',{method:'POST',body:'{}'});
    setProbing(false); setProbe((d&&d.probe)||{error:(d&&d.error)||'failed'}); load(); };
  const load=async()=>{ const d=await apiJSON('/api/crawler/status'); if(d&&d.__status<400&&d.queue)setS(d); };
  useEffect(()=>{ load(); const t=setInterval(load,2500); return()=>clearInterval(t); },[]);
  const act=async(path,label)=>{ const d=await apiJSON('/api/crawler/'+path,{method:'POST',body:'{}'});
    setMsg(d&&(d.ok)?(label+(d.requeued!=null?(' ('+d.requeued+' re-queued)'):'')+(d.message?(' — '+d.message):'')):'Error'); load(); };
  const q=(s&&s.queue)||{}; const w=(s&&s.worker)||{}; const cur=(w.current)||{};
  const openList=async(b)=>{
    if(bucket===b){ setBucket(null); setRows([]); return; }
    setBucket(b); setRowsLoading(true); setRows([]);
    const d=await apiJSON('/api/crawler/leads?status='+b+'&limit=500');
    setRowsLoading(false); if(d&&d.leads)setRows(d.leads);
  };
  const Stat=({label,value,color,b})=>(<div onClick={()=>openList(b)} title="Click to see these domains"
    style={{textAlign:'center',minWidth:84,cursor:'pointer',padding:'7px 8px',borderRadius:10,transition:'background .15s',
      background:bucket===b?'var(--sf)':'transparent',border:'1px solid '+(bucket===b?'var(--bd)':'transparent')}}>
    <div style={{fontSize:24,fontWeight:800,color:color||'var(--t1)'}}>{value!=null?value:'—'}</div>
    <div style={{fontSize:10,color:'var(--t3)',textTransform:'uppercase'}}>{label} ▾</div></div>);
  // ── live progress ──
  const phase=cur.phase||'idle';
  const pmeta=({crawling:{c:'var(--blue)',t:'Crawling website'},apollo:{c:'var(--violet)',t:'Fetching Apollo data'},
    analyzing:{c:'var(--green)',t:'Generating AI cheat-sheet'},idle:{c:'var(--t3)',t:'Idle — all caught up'}})[phase]||{c:'var(--t3)',t:phase};
  const pages=cur.pages||0, ptot=cur.pages_total||0;
  const pct=phase==='idle'?0:(phase==='crawling'&&ptot)?Math.round(100*pages/Math.max(ptot,1)):100;
  const indet=phase!=='idle'&&phase!=='crawling'; // apollo/analyzing → moving bar
  const Badge=({ok,children})=>(<span style={{fontSize:10,fontWeight:700,padding:'2px 7px',borderRadius:20,
    color:ok?'#fff':'var(--t3)',background:ok?'var(--green)':'var(--sf)',border:'1px solid '+(ok?'var(--green)':'var(--bd)')}}>{children}</span>);
  return(<div style={{padding:'4px 2px',maxWidth:780}}>
    {msg&&<div className="card" style={{padding:'9px 14px',marginBottom:12,color:'var(--t1)',fontSize:13}}>{msg}</div>}
    <div className="card" style={{padding:18,marginBottom:14}}>
      <div style={{display:'flex',alignItems:'center',marginBottom:14}}>
        <div style={{fontWeight:700,color:'var(--t1)'}}>Enrichment crawler</div>
        <span style={{marginLeft:10,fontSize:12,fontWeight:700,color:!s?'var(--t3)':(w.paused?'var(--amber)':'var(--green)')}}>{!s?'CONNECTING…':(w.paused?'PAUSED':'RUNNING')}</span>
      </div>
      {/* live progress bar */}
      <div style={{marginBottom:16}}>
        <div style={{display:'flex',alignItems:'baseline',marginBottom:6,fontSize:12.5}}>
          <span style={{fontWeight:700,color:pmeta.c}}>{w.paused?'Paused':pmeta.t}</span>
          {cur.company&&<span style={{marginLeft:8,color:'var(--t1)',fontWeight:600}}>{cur.company}</span>}
          {cur.domain&&<span style={{marginLeft:6,color:'var(--t3)'}}>{cur.domain}</span>}
          {cur.lead_id&&<span style={{marginLeft:6,color:'var(--blue)',fontWeight:700}}>{lfId(cur.lead_id)}</span>}
          {phase==='crawling'&&ptot>0&&<span style={{marginLeft:'auto',color:'var(--t3)'}}>page {pages}/{ptot}</span>}
          {phase!=='idle'&&cur.elapsed!=null&&<span style={{marginLeft:phase==='crawling'?10:'auto',color:'var(--t3)'}}>{cur.elapsed}s</span>}
        </div>
        <div style={{height:9,background:'var(--sf)',borderRadius:20,overflow:'hidden',border:'1px solid var(--bd)'}}>
          <div style={{height:'100%',width:(indet?'40%':pct+'%'),background:pmeta.c,borderRadius:20,
            transition:'width .4s ease',opacity:phase==='idle'?0:1,
            animation:indet?'lfslide 1.1s ease-in-out infinite':'none'}}/>
        </div>
        {cur.page_url&&phase!=='idle'&&<div style={{marginTop:5,fontSize:11,color:'var(--t3)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{cur.page_url}</div>}
      </div>
      <div style={{display:'flex',justifyContent:'space-around',flexWrap:'wrap',gap:10}}>
        <Stat label="Pending" value={q.pending||0} color="var(--t2)" b="pending"/>
        <Stat label="Crawling" value={q.crawling||0} color="var(--amber)" b="crawling"/>
        <Stat label="Done" value={q.done||0} color="var(--green)" b="done"/>

    </div>

    {bucket&&<div className="card" style={{padding:14,marginBottom:14}}>
      <div style={{display:'flex',alignItems:'center',marginBottom:8}}>
        <div style={{fontWeight:700,color:'var(--t1)',textTransform:'capitalize'}}>{bucket==='total'?'All':bucket} domains</div>

        <button onClick={()=>{setBucket(null);setRows([]);}} style={{marginLeft:'auto',background:'transparent',border:'1px solid var(--bd)',color:'var(--t2)',borderRadius:8,padding:'3px 9px',cursor:'pointer',fontSize:12}}>✕ Close</button>
      </div>
      <div style={{maxHeight:400,overflow:'auto'}}>
        {rows.map(r=>(<div key={r.lead_id} style={{padding:'7px 4px',borderBottom:'1px solid var(--bd)'}}>
          <div style={{display:'flex',alignItems:'center',gap:9,fontSize:12.5}}>
            <span onClick={()=>onOpenLead&&onOpenLead(r.lead_id)} style={{color:'var(--blue)',fontWeight:700,cursor:'pointer',minWidth:88}}>{lfId(r.lead_id)}</span>
            <span onClick={()=>onOpenLead&&onOpenLead(r.lead_id)} style={{color:'var(--t1)',fontWeight:600,cursor:'pointer',flex:'1 1 150px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.company||'—'}</span>
            {r.domain&&<a href={'https://'+r.domain} target="_blank" rel="noreferrer" onClick={e=>e.stopPropagation()} style={{color:'var(--t2)',textDecoration:'none',flex:'1 1 150px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.domain} ↗</a>}
            <span style={{display:'flex',gap:6,alignItems:'center',marginLeft:'auto'}}>
              {r.pages!=null&&<Badge ok={r.pages>0}>{r.pages}p</Badge>}
              <Badge ok={r.has_apollo}>Apollo</Badge>
              <Badge ok={r.ai_ok}>AI</Badge>
              {r.crawled_at&&<span style={{color:'var(--t3)',fontSize:11,whiteSpace:'nowrap'}}>{String(r.crawled_at).replace('T',' ').slice(5,16)}</span>}
            </span>
          </div>
          {r.error_text&&<div style={{marginTop:3,marginLeft:97,fontSize:11,color:'#EF4444',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.error_text}</div>}
        </div>))}
        {!rowsLoading&&!rows.length&&<div style={{color:'var(--t3)',fontSize:13,padding:'8px 4px'}}>No domains in this bucket.</div>}
      </div>
    </div>}
    {w.openai_status&&w.openai_status.indexOf('401')>=0&&<div className="card" style={{padding:'12px 16px',marginBottom:14,borderLeft:'4px solid #EF4444',color:'var(--t1)',fontSize:13}}>
      ⚠ The OpenAI API key is invalid (401), so AI call-summaries can't be generated — leads currently show Apollo data only. Set a valid <b>OPENAI_API_KEY</b> in Railway, then click <b>Re-analyse failed leads</b> below to backfill the AI cheat-sheets (no re-crawl needed).
    </div>}
    <div className="card" style={{padding:18}}>
      <div style={{fontWeight:700,color:'var(--t1)',marginBottom:10}}>Controls</div>
      <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
        {w.paused
          ? <button onClick={()=>act('resume','Resumed.')} style={{padding:'9px 16px',background:'var(--green)',color:'#fff',border:0,borderRadius:8,fontWeight:700,cursor:'pointer'}}>▶ Resume</button>
          : <button onClick={()=>act('pause','Paused.')} style={{padding:'9px 16px',background:'var(--amber)',color:'#fff',border:0,borderRadius:8,fontWeight:700,cursor:'pointer'}}>⏸ Pause</button>}
        <button onClick={()=>act('retry-errored','Re-queued errored leads.')} style={{padding:'9px 16px',background:'var(--sf)',color:'var(--t1)',border:'1px solid var(--bd)',borderRadius:8,fontWeight:600,cursor:'pointer'}}>↻ Retry errored / stuck</button>
        <button onClick={()=>act('reanalyze','Re-analysis started.')} title="Re-run the AI summary for leads whose AI failed (reuses crawled data; no re-crawl). Use after fixing the OpenAI key." style={{padding:'9px 16px',background:'var(--blue)',color:'#fff',border:0,borderRadius:8,fontWeight:700,cursor:'pointer'}}>↺ Re-analyse failed leads</button>
        <button onClick={testKey} disabled={probing} title="Live test of the OpenAI key inside this deployment — shows whether it's present and what OpenAI returns." style={{padding:'9px 16px',background:'var(--violet)',color:'#fff',border:0,borderRadius:8,fontWeight:700,cursor:probing?'wait':'pointer'}}>{probing?'Testing…':'🔑 Test OpenAI key'}</button>
      </div>
      {probe&&<div style={{marginTop:12,padding:'12px 14px',borderRadius:10,border:'1px solid '+(probe.ok?'var(--green)':'#EF4444'),background:'var(--sf)',fontSize:12.5}}>
        {probe.error&&<div style={{color:'#EF4444'}}>Probe error: {probe.error}</div>}
        {!probe.error&&<div>
          <div style={{fontWeight:700,color:probe.ok?'var(--green)':'#EF4444',marginBottom:6}}>{probe.ok?'✓ OpenAI key is valid and working':('✕ OpenAI not working'+(probe.http_status?(' (HTTP '+probe.http_status+')'):''))}</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:'4px 16px',color:'var(--t2)'}}>
            <span>Key present: <b style={{color:probe.present?'var(--green)':'#EF4444'}}>{probe.present?'yes':'NO'}</b></span>
            <span>Key length: <b>{probe.clean_len}</b></span>
            <span>Key tail: <b style={{fontFamily:'var(--mono)'}}>{probe.key_tail?('…'+probe.key_tail):'—'}</b></span>
            <span>HTTP: <b>{probe.http_status||'—'}</b></span>
            {probe.had_quotes&&<span style={{color:'var(--amber)'}}>⚠ had surrounding quotes (auto-stripped)</span>}
            {probe.had_whitespace&&<span style={{color:'var(--amber)'}}>⚠ had stray whitespace (auto-stripped)</span>}
          </div>
          {probe.detail&&<div style={{marginTop:6,color:'var(--t1)'}}>{probe.detail}</div>}
          {!probe.present&&<div style={{marginTop:6,color:'var(--t3)'}}>On Railway: add <b>OPENAI_API_KEY</b> to <b>this service's</b> Variables (exact name), then redeploy. Confirm the key tail above matches what you pasted.</div>}
        </div>}
      </div>}
    </div>
  </div>);
}

function KpiView(){
  const [k,setK]=useState(null); const [audit,setAudit]=useState([]);
  useEffect(()=>{ apiJSON('/api/stats/kpis').then(d=>{if(d&&d.__status<400&&d.funnel)setK(d);}); apiJSON('/api/audit?limit=60').then(d=>{if(d&&d.events)setAudit(d.events);}); },[]);
  const f=(k&&k.funnel)||{}; const lb=(k&&k.leaderboard)||[]; const calls=(k&&k.calls)||{};
  const td={padding:'8px 10px',borderBottom:'1px solid var(--bd)',color:'var(--t1)',fontSize:13};
  const th={textAlign:'left',padding:'8px 10px',color:'var(--t3)',fontSize:11,textTransform:'uppercase',borderBottom:'1px solid var(--bd)'};
  const Card=({label,value,color})=>(<div className="card" style={{padding:'16px 18px',flex:'1 1 130px',textAlign:'center'}}>
    <div style={{fontSize:28,fontWeight:800,color:color||'var(--t1)'}}>{value!=null?value:'—'}</div>
    <div style={{fontSize:11,color:'var(--t3)',textTransform:'uppercase',marginTop:4}}>{label}</div></div>);
  const mins=Math.round((calls.total_seconds||0)/60);
  return(<div style={{padding:'4px 2px',paddingBottom:24}}>
    <div style={{display:'flex',gap:14,flexWrap:'wrap',marginBottom:14}}>
      <Card label="Total leads" value={f.total} color="var(--t1)"/>
      <Card label="Allocated" value={f.allocated} color="var(--blue)"/>
      <Card label="Contacted" value={f.contacted} color="var(--amber)"/>
      <Card label="Secured" value={f.secured} color="var(--green)"/>
      <Card label="Calls" value={calls.total} color="var(--violet)"/>
      <Card label="Call minutes" value={mins} color="var(--violet)"/>
    </div>
    <div className="card" style={{padding:18,marginBottom:14}}>
      <div style={{fontWeight:700,color:'var(--t1)',marginBottom:10}}>BDE leaderboard</div>
      <table style={{width:'100%',borderCollapse:'collapse'}}>
        <thead><tr><th style={th}>BDE</th><th style={th}>Allocated</th><th style={th}>Contacted</th><th style={th}>Secured</th><th style={th}>Conversion</th></tr></thead>
        <tbody>{lb.map(r=>{ const conv=r.allocated?Math.round(100*r.secured/r.allocated):0;
          return(<tr key={r.id}><td style={td}>{r.full_name||r.username}</td><td style={td}>{r.allocated}</td>
            <td style={{...td,color:'var(--amber)'}}>{r.contacted}</td><td style={{...td,color:'var(--green)',fontWeight:700}}>{r.secured}</td>
            <td style={td}>{conv}%</td></tr>);})}
          {!lb.length&&<tr><td style={td} colSpan={5}>No BDE data yet.</td></tr>}
        </tbody>
      </table>
    </div>
    <div className="card" style={{padding:18}}>
      <div style={{fontWeight:700,color:'var(--t1)',marginBottom:10}}>Recent activity</div>
      <div style={{maxHeight:340,overflow:'auto'}}>
        {audit.map(e=>(<div key={e.id} style={{display:'flex',gap:10,padding:'6px 0',borderBottom:'1px solid var(--bd)',fontSize:12}}>
          <span style={{color:'var(--t3)',whiteSpace:'nowrap'}}>{e.created_at?String(e.created_at).replace('T',' ').slice(5,16):''}</span>
          <span style={{color:'var(--blue)',fontWeight:600,minWidth:120}}>{e.username}</span>
          <span style={{color:'var(--t2)'}}>{e.action}{e.lead_id?(' '+lfId(e.lead_id)):''}{e.detail?(' · '+e.detail):''}</span>
        </div>))}
        {!audit.length&&<div style={{color:'var(--t3)',fontSize:13}}>No activity logged yet.</div>}
      </div>
    </div>
  </div>);
}

function ForcePwGate({onDone}){
  const [pw,setPw]=useState(''); const [pw2,setPw2]=useState(''); const [err,setErr]=useState(''); const [busy,setBusy]=useState(false);
  const submit=async(e)=>{ if(e)e.preventDefault(); if(busy)return;
    if(pw.length<6){setErr('At least 6 characters.');return;} if(pw!==pw2){setErr('Passwords do not match.');return;}
    setBusy(true); const d=await apiJSON('/api/me/password',{method:'POST',body:JSON.stringify({password:pw})}); setBusy(false);
    if(d&&d.ok) onDone(); else setErr('Error: '+((d&&d.error)||'failed')); };
  return(<div style={{position:'fixed',inset:0,display:'flex',alignItems:'center',justifyContent:'center',background:'var(--bg)',zIndex:950}}>
    <form onSubmit={submit} className="card" style={{width:380,padding:'32px'}}>
      <h2 style={{margin:'0 0 6px',color:'var(--t1)'}}>Set a new password</h2>
      <div style={{color:'var(--t3)',fontSize:13,marginBottom:14}}>For security, please replace your temporary password before continuing.</div>
      {err&&<div style={{color:'#EF4444',fontSize:13,marginBottom:8}}>{err}</div>}
      <input style={{..._crmInp,width:'100%',margin:'6px 0'}} type="password" placeholder="New password" value={pw} autoFocus onChange={e=>setPw(e.target.value)}/>
      <input style={{..._crmInp,width:'100%',margin:'6px 0'}} type="password" placeholder="Confirm new password" value={pw2} onChange={e=>setPw2(e.target.value)}/>
      <button type="submit" disabled={busy} style={{width:'100%',padding:'12px',marginTop:10,background:'var(--blue)',color:'#fff',border:0,borderRadius:8,fontWeight:700,cursor:'pointer'}}>{busy?'Saving…':'Set password & continue'}</button>
    </form>
  </div>);
}

/* ─── ROOT: auth gate. App (and its protected fetches) only mounts once a user
   is signed in, so the login screen never triggers protected API calls. ─── */
function Root(){
  const [user,setUser]=React.useState(undefined); // undefined=checking, null=logged out, obj=user
  React.useEffect(()=>{
    let alive=true;
    const resolve=()=>fetch('/whoami',{credentials:'same-origin'})
      .then(r=>r.ok?r.json():null)
      .then(d=>{ if(alive) setUser(d&&d.username?d:null); })
      .catch(()=>{ if(alive) setUser(null); });
    resolve();
    const onLost=()=>{ if(alive) setUser(null); };
    window.addEventListener('lf-auth-lost',onLost);
    return ()=>{ alive=false; window.removeEventListener('lf-auth-lost',onLost); };
  },[]);
  const onLogout=async()=>{
    try{ await fetch('/logout',{method:'POST',credentials:'same-origin'}); }catch(e){}
    setUser(null);
  };
  if(user===undefined){
    return <div style={{position:'fixed',inset:0,display:'flex',alignItems:'center',
      justifyContent:'center',background:'var(--bg)',color:'var(--t3)',fontSize:14}}>Loading…</div>;
  }
  if(user===null){
    return <LoginView onLogin={setUser}/>;
  }
  if(user.must_change_pw){
    return <ForcePwGate onDone={()=>setUser(u=>({...u, must_change_pw:false}))}/>;
  }
  return <App user={user} onLogout={onLogout}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
