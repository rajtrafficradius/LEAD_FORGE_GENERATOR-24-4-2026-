      if(tierKey==='all')return[].concat(aus.tier_1||[],aus.tier_2||[],aus.tier_3||[]);
      return aus[tierKey]||[];
    }
    const st=(auCities.states||[]).find(s=>s.code===auState);
    if(!st)return[];
    if(tierKey==='all')return[].concat(st.tier_1||[],st.tier_2||[],st.tier_3||[]);
    return st[tierKey]||[];
  })();
  // Phase 2 (2026-05-06): industries fetched from /industries (52 base + 1
  // new AU multi-vertical = 53). Falls back to hardcoded list while the
  // fetch is in flight or if it fails.
  const _IND_FALLBACK=['Plumbing & Gas Fitting','Electrical Services','HVAC & Air Conditioning','Roofing & Guttering','Landscaping & Gardening','Dental & Oral Health','Legal Services','Accounting & Finance','Real Estate','Automotive & Mechanical','Cleaning Services','Pest Control','Building & Construction','IT & Technology'];
  const INDUSTRIES_L=['Select an industry'].concat((industries&&industries.length>0)?industries:_IND_FALLBACK);
  const cities=_cityList;
  const [formErr,setFormErr]=useState('');
  const [filter,setFilter]=useState('');
  const [sortCol,setSortCol]=useState('s');
  const [sortDir,setSortDir]=useState('desc');
  const {s:liveStats,flash:liveFlash}=useLiveStats();
  const syncAgo=useSyncAgo(liveStats.syncTs);

  const handleGen=()=>{
    if(tab==='industries'&&industry==='Select an industry'){setFormErr('Please select an industry to continue');return;}
    setFormErr('');onGenerate();
  };

  useEffect(()=>{
    const h=(e)=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')handleGen();};
    document.addEventListener('keydown',h);return()=>document.removeEventListener('keydown',h);
  },[tab,industry,loading]);

  // 2026-05-21 (THE BIG FIX): filtered/sorted lead list now reads from
  // REAL backend leads (`realLeads` prop populated from /status/<job>.leads),
  // NOT the hardcoded LEADS mock array. Backend lead dicts use different
  // field names — we map them to the (b, d, e, p, s) shape the table
  // already renders, with sensible fallbacks per source:
  //   b = company OR name
  //   d = domain
  //   e = email (or "—")
  //   p = phone (or "—")
  //   s = score (server-provided _final_score / score, else derived from
  //              quality flags: 90 if has email+phone, 75 with one, 60 none)
  //   src = source label ("Apollo" / "Google Intent" / "Silent-Apollo")
  const _mappedLeads=(Array.isArray(realLeads)?realLeads:[]).map(ld=>{
    const company=(ld.company||'').trim();
    const name=(ld.name||'').trim();
    const domain=(ld.domain||'').trim();
    const email=(ld.email||'').trim();
    const phone=(ld.phone||'').trim();
    const hasEmail=Boolean(email);
    const hasPhone=Boolean(phone);
    const score=Number(ld._final_score||ld.score||(hasEmail&&hasPhone?92:hasEmail||hasPhone?78:62));
    const src=(ld._google_intent?'Google Intent':ld._silent_scope_apollo?'Silent-Apollo':(ld.source||'Apollo'));
    // 2026-06-04: a real Apollo contact carries a person name + a role
    // ("David" / "Owner"). Stub leads (Apollo found nobody) have a role of ""
    // and a domain-derived name. So `role present` = real person → show their
    // NAME as the primary; company becomes the sub-line. No role → stub → keep
    // showing the company. Display-only; pipeline untouched.
    const hasRole=Boolean((ld.role||'').trim());
    const isPerson=hasRole&&Boolean(name);
    return {
      b:company||name||'(unnamed)',
      nm:name,                       // person name (e.g. "David")
      isPerson,
      d:domain||'—',
      e:hasEmail?email:'—',
      p:hasPhone?phone:'—',
      s:Math.max(0,Math.min(100,Math.round(score))),
      src,
      kw:(ld.keyword||'').trim()||'—',
      // 2026-06-08: live per-lead dollar cost (same value frozen into the DB).
      cpl:(ld.cost_per_lead!==undefined&&ld.cost_per_lead!==null&&Number(ld.cost_per_lead)>0)
            ?('$'+Number(ld.cost_per_lead).toFixed(2)):'—',
      _role:ld.role||'',
      _direct:Boolean(ld._direct_phone),
    };
  });
  const _filterLower=(filter||'').toLowerCase();
  const filteredLeads=_mappedLeads.filter(l=>!_filterLower||(
    l.b.toLowerCase().includes(_filterLower)
    || l.d.toLowerCase().includes(_filterLower)
    || (l.e||'').toLowerCase().includes(_filterLower)
    || (l.src||'').toLowerCase().includes(_filterLower)
    || (l.kw||'').toLowerCase().includes(_filterLower)
  )).sort((a,b)=>{const dir=sortDir==='asc'?1:-1;if(sortCol==='s')return dir*(a.s-b.s);if(sortCol==='b')return dir*a.b.localeCompare(b.b);return 0;});

  const SortIcon=({col})=>{if(sortCol!==col)return<span style={{opacity:0.3,marginLeft:4}}>↕</span>;return<span style={{marginLeft:4,color:'var(--blue)'}}>{sortDir==='asc'?'↑':'↓'}</span>;};

  // 2026-05-21: ONE merged credit panel (replaces 2 duplicate panels).
  // Always renders at the top of the Generate view so credit info is
  // visible BEFORE the user clicks Generate. 7 tiles:
  //   Apollo Total / Export / Phone / Email / SEMrush / Lusha / Google Places
  // Each tile shows REMAINING (top, large) + USED this run (bottom, smaller).
  // The "used" sub-line is grey "—" until a run completes, then turns green
  // with the per-pool delta + per-lead avg.
  function renderMergedCreditPanel(){
    const cu=creditsUsedThisRun||{};
    const _svc=(liveCreditsDetails&&liveCreditsDetails.services)||{};
    const _apoSvc=_svc.apollo||{};
    const _smrSvc=_svc.semrush||{};
    const _lusSvc=_svc.lusha||{};
    const _gpSvc=_svc.google_places||{};
    const _n=v=>(typeof v==='number'&&isFinite(v)?v:null);
    const _f=v=>{const n=_n(v);return n===null?'—':n.toLocaleString('en-US');};
    const _fp=v=>{const n=_n(v);return n===null?'—':(n>=10?n.toFixed(1):n.toFixed(2));};
    const rows=[
      {lbl:'Apollo · Total',   c:'#7C3AED',used:cu.apollo_total,  per:cu.per_lead&&cu.per_lead.apollo_total,  remaining:_apoSvc.remaining},
      {lbl:'Apollo · Export',  c:'#2563EB',used:cu.apollo_export, per:cu.per_lead&&cu.per_lead.apollo_export, remaining:_apoSvc.export_remaining},
      {lbl:'Apollo · Phone',   c:'#F59E0B',used:cu.apollo_phone,  per:cu.per_lead&&cu.per_lead.apollo_phone,  remaining:_apoSvc.phone_remaining},
      {lbl:'Apollo · Email',   c:'#16A34A',used:cu.apollo_email,  per:cu.per_lead&&cu.per_lead.apollo_email,  remaining:_apoSvc.email_remaining},
      {lbl:'SEMrush',          c:'#EF4444',used:cu.semrush_total, per:cu.per_lead&&cu.per_lead.semrush_total, remaining:_smrSvc.remaining},
      {lbl:'Lusha',            c:'#0EA5E9',used:cu.lusha_total,   per:cu.per_lead&&cu.per_lead.lusha_total,   remaining:_lusSvc.remaining},
      {lbl:'Google Places',    c:'#0F766E',used:_gpSvc.used,      per:null,                                    remaining:null, cap:_gpSvc.per_run_cap,isGoogle:true},
    ];
    const _hasRun=Boolean(creditsUsedThisRun);
    return(<div style={{
        background:'#FFFFFF',border:'1px solid #E2E8F0',borderRadius:10,
        padding:'12px 14px',marginBottom:14,
      }}>
      <div style={{
          display:'flex',alignItems:'center',justifyContent:'space-between',
          marginBottom:10,
        }}>
        <div style={{
            fontSize:11,fontWeight:700,letterSpacing:'1.4px',
            textTransform:'uppercase',color:'#0F172A',
            fontFamily:'var(--mono)',
          }}>
          ◈ API Credits {_hasRun?'— Remaining + Used This Run':'— Remaining (live 60s poll)'}
        </div>
        <div style={{
            fontSize:10,color:'#64748B',fontFamily:'var(--mono)',
          }}>
          {_hasRun?
            (cu.leads>0?(cu.leads+' lead'+(cu.leads===1?'':'s')+' generated · per-lead shown'):'0 leads — per-lead n/a')
            :'no run yet — pre-flight view'}
        </div>
      </div>
      <div style={{
          display:'grid',
          gridTemplateColumns:'repeat(7,minmax(0,1fr))',
          gap:8,
        }}>
        {rows.map((r,i)=>(
          <div key={i} style={{
              background:'#F8FAFC',border:'1px solid #E2E8F0',
              borderRadius:8,padding:'10px 12px',minWidth:0,
            }}>
            <div style={{
                fontSize:9,fontWeight:700,letterSpacing:'0.8px',
                textTransform:'uppercase',color:r.c,marginBottom:5,
                fontFamily:'var(--mono)',whiteSpace:'nowrap',
                overflow:'hidden',textOverflow:'ellipsis',
              }}>
              {r.lbl}
            </div>
            <div style={{
                fontSize:18,fontWeight:800,color:'#0F172A',
                fontFamily:'var(--mono)',lineHeight:1.05,
              }}>
              {r.isGoogle?_f(r.cap):_f(r.remaining)}
            </div>
            <div style={{
                fontSize:8,color:'#94A3B8',marginTop:2,
                fontFamily:'var(--mono)',
              }}>
              {r.isGoogle?'per-run cap':'remaining'}
            </div>
            <div style={{
                fontSize:9,color:_hasRun?'#16A34A':'#94A3B8',marginTop:6,
                fontFamily:'var(--mono)',fontWeight:600,borderTop:'1px solid #E2E8F0',
                paddingTop:5,
              }}>
              {_f(r.used)}{!r.isGoogle&&(' · '+_fp(r.per)+'/lead')}
            </div>
            <div style={{
                fontSize:8,color:'#94A3B8',marginTop:2,
                fontFamily:'var(--mono)',
              }}>
              {r.isGoogle?'calls (session)':'used this run'}
            </div>
          </div>
        ))}
      </div>
    </div>);
  }

  return(<>
    {/* 2026-05-21: merged credit panel — always visible at top of view. */}
    {renderMergedCreditPanel()}
    <div className="intel-strip">
      {/* Phase 2 (2026-05-07): every tile reflects real backend state.
          - Master DB: master_leads count from /api/master-stats
          - Industries: 53 (52 base + 1 multi-vertical AU bundle)
          - Valid Now: live valid_leads_in_progress during a running job
          - Dedup Out: master_leads_deduped_out from the latest finished run
          - API Health: % of services reporting status='ok' && pct_remaining>10
          - Last Sync: time since last credits refresh */}
      {[
        {k:'db',val:fmt(liveStats.db),label:'Master DB',c:'var(--blue)'},
        {k:'industries',val:fmt(liveStats.industries||0),label:'Industries',c:'var(--violet)'},
        {k:'validNow',val:fmt(counts.total||0),label:'Valid Now',c:loading?'var(--green)':'var(--t3)'},
        {k:'dedupOut',val:fmt(liveStats.dedupOut||0),label:"Dedup'd Out",c:'var(--amber)'},
        {k:'health',val:(liveStats.health!=null?liveStats.health:'—')+'%',label:'API Health',c:'var(--green)'},
        {k:'sync',val:syncAgo,label:'Last Sync',c:'var(--t3)'},
      ].map((m,i)=>(
        <div className="intel-strip-item" key={i} style={{cursor:'default'}}>
          <div className={'intel-strip-val'+(liveFlash[m.k]?' val-flash':'')} key={m.k+'-'+(liveFlash[m.k]||0)} style={{color:m.c}}>{m.val}</div>
          <div className="intel-strip-label">{m.label}</div>
        </div>
      ))}
    </div>
    <div className="gen-layout">
      {/* LEFT: Form */}
      <div className="gen-form-card">
        <div className="card"><div className="card-p">
          <div className="gen-form-title">Configure Lead Search</div>
          <div className="gen-form-sub">Select your search method. Press <kbd style={{fontFamily:'var(--mono)',fontSize:10,padding:'1px 5px',background:'var(--sf2)',border:'1px solid var(--bd)',borderRadius:4}}>⌘ Enter</kbd> to generate.</div>
          <div className="form-tab-big">
            <button className={'ftab '+(tab==='cities'?'on':'')} onClick={()=>{setTab('cities');setFormErr('')}}>
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="5" width="12" height="8" rx="1.5" stroke="currentColor" strokeWidth="1.3"/><path d="M4 5V4a3 3 0 0 1 6 0v1" stroke="currentColor" strokeWidth="1.3"/></svg>By City
            </button>
            <button className={'ftab '+(tab==='industries'?'on':'')} onClick={()=>{setTab('industries');setFormErr('')}}>
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="2" y="6" width="3" height="6" rx="1" stroke="currentColor" strokeWidth="1.3"/><rect x="5.5" y="4" width="3" height="8" rx="1" stroke="currentColor" strokeWidth="1.3"/><rect x="9" y="2" width="3" height="10" rx="1" stroke="currentColor" strokeWidth="1.3"/></svg>By Industry
            </button>
          </div>
          {tab==='cities'?(<>
            {/* AU-only city mode (legacy parity): State dropdown lists NSW/VIC/QLD/...
                from /api/au-cities. The whole-country option keeps the synthetic
                AUSTRALIA scope (capitals across all states). */}
            <div className="fg"><label className="fl">State / Region</label><select className="fs" value={auState} onChange={e=>{setAuState(e.target.value);setCity('')}}>{_stateOpts.map(s=><option key={s.code} value={s.code}>{s.name}</option>)}</select></div>
            <div className="fr2">
              <div className="fg"><label className="fl">City Tier</label><select className="fs" value={cityTier} onChange={e=>{setCityTier(e.target.value);setCity('')}}>{['All city tiers','Tier 1 cities','Tier 2 cities','Tier 3 cities'].map(t=><option key={t}>{t}</option>)}</select></div>
              <div className="fg"><label className="fl">City</label><select className="fs" value={city||(cities[0]||'')} onChange={e=>setCity(e.target.value)}>{[<option key="__all" value="all">All cities in tier</option>].concat(cities.map(c=><option key={c} value={c}>{c}</option>))}</select></div>
            </div>
            <div className="fr2">
              <div className="fg"><label className="fl">Max Leads</label><input className="fi" type="number" value={maxLeads} onChange={e=>setMaxLeads(e.target.value)} placeholder="0 = unlimited"/><div className="field-hint">0 = no limit</div></div>
              <div className="fg"><label className="fl">Min Search Volume</label><input className="fi" type="number" value={minSearch} onChange={e=>setMinSearch(e.target.value)}/><div className="field-hint">Monthly searches</div></div>
            </div>
            {/* Parallel workers slider (legacy parity: 1–8 default 4) */}
            <div className="fg"><label className="fl">Parallel Workers <span style={{color:'var(--green)',fontWeight:700}}>{nWorkers}</span></label><input type="range" min="1" max="8" value={nWorkers} onChange={e=>setNWorkers(parseInt(e.target.value)||4)} style={{accentColor:'var(--green)',width:'100%'}}/></div>
          </>):(<>
            <div className="fg"><label className="fl">Industry</label><select className="fs" value={industry} onChange={e=>{setIndustry(e.target.value);setFormErr('')}} style={{borderColor:formErr?'var(--red)':''}}>{INDUSTRIES_L.map(i=><option key={i}>{i}</option>)}</select>{formErr&&<div style={{fontSize:11,color:'var(--red)',marginTop:4}}>⚠ {formErr}</div>}</div>
            {/* Industry mode keeps multi-country dropdown (legacy parity).
                Default = AU per "optimize only for Australia". */}
            <div className="fg"><label className="fl">Country</label><select className="fs" value={indCountry} onChange={e=>setIndCountry(e.target.value)}>{['AU','USA','UK','India'].map(c=><option key={c} value={c}>{c==='AU'?'Australia':c==='USA'?'United States':c==='UK'?'United Kingdom':'India'}</option>)}</select></div>
            <div className="fr2">
              <div className="fg"><label className="fl">Max Leads</label><input className="fi" type="number" value={maxLeads} onChange={e=>setMaxLeads(e.target.value)}/></div>
              <div className="fg"><label className="fl">Min Vol.</label><input className="fi" type="number" value={minSearch} onChange={e=>setMinSearch(e.target.value)}/></div>
            </div>
            <div className="fg"><label className="fl">Min CPC ($)</label><input className="fi" type="number" value={minCpc} step="0.1" onChange={e=>setMinCpc(e.target.value)}/><div className="field-hint">Filter by min cost-per-click</div></div>
          </>)}
          <div className="tog-row"><div><div className="tog-title">Contact Enrichment</div><div className="tog-desc">Reveal verified phone &amp; email via Apollo / Lusha</div></div><div className={'tog '+(enrich?'on':'off')} onClick={()=>setEnrich(!enrich)}><div className="tog-k"></div></div></div>
          {/* 2026-06-08: Data-source toggle. OFF = SerpAPI + SEMrush (default);
              ON = SerpAPI only — bypasses SEMrush entirely even if it has credits
              (SEMrush then consumes 0 → $0 SEMrush cost this run). */}
          <div className="tog-row"><div><div className="tog-title">SerpAPI only (bypass SEMrush)</div><div className="tog-desc">{serpOnly?'SerpAPI + Google Places + Apollo — SEMrush skipped':'SerpAPI + SEMrush combined (default)'}</div></div><div className={'tog '+(serpOnly?'on':'off')} onClick={()=>setSerpOnly(!serpOnly)}><div className="tog-k"></div></div></div>
          {/* 2026-05-18 (round 4): pre-flight SEMrush cost preview. Mirrors
              the Python `predict_semrush_units()` in test_semrush_budget.py
              so the user sees expected credit cost BEFORE clicking Generate
              — letting them dial down max_leads if the estimate is too high.
              Updates live as max_leads / mode / enrich toggle changes. */}
          {(()=>{
            const _ml=parseInt(maxLeads,10)||0;
            const _mode=(tab==='cities')?'city':'industry';
            const _en=Boolean(enrich);
            // ── Budget cap (matches V5.LeadGenerationPipeline) ──
            const _budget = _ml<=0 ? 25000 : Math.max(300, Math.min(20000, _ml*100));
            // ── Natural spend estimate (mirrors test_semrush_budget.predict_semrush_units) ──
            let nat = 0;
            nat += 300;                                              // phase2_kw_expansion (12*25*1)
            if(_mode==='industry'){ nat += 30*15; }                  // phase3 hardcoded 30 probes lim15
            else {
              const kwCap=_ml<=0?400:Math.max(40,Math.min(1200,_ml*20));
              const domCap=_ml<=0?800:Math.max(200,_ml*8);
              const probes=Math.min(kwCap,Math.max(20,Math.floor(domCap/3)));
              nat += probes*10;
            }
            // phase4 (overview only, ~70% confirmed-paid skip in city mode)
            const domsEnrich=_ml<=0?50:Math.min(_ml*6,200);
            nat += _mode==='city' ? Math.floor(domsEnrich*0.30*40) : domsEnrich*40;
            // phase3 BFS (round-3 v2: max_leads//5, cap 20)
            const bfsCalls=_ml<=0?20:Math.max(1,Math.min(20,Math.floor(_ml/5)));
            nat += bfsCalls*120;
            // phase5c (skipped when enrich OFF)
            if(_en){
              const doms5c=_ml<=0?50:Math.max(5,Math.min(_ml,50));
              const lim=(_ml<=0||_ml>=15)?15:Math.max(10,Math.min(15,_ml*3));
              nat += doms5c*(lim*10 + 3*40);
            }
            // phase5h (cap 30, requires 30% of max_leads)
            const doms5h=_ml<=0?3:Math.max(0,Math.min(30,Math.floor(_ml*0.3)));
            nat += doms5h*(10*10 + 3*40);
            // phase5f topup
            if(_ml>=5){
              const seedN=_ml<=0?5:Math.max(1,Math.min(5,Math.floor(_ml/5)));
              const rounds=_ml>=25?2:1;
              nat += rounds*seedN*200;
            }
            // city-only: Pass 3 + rediscovery
            if(_mode==='city'){
              if(_ml>5){
                if(_ml<=25) nat += 5*3*40;
                else if(_ml<=100) nat += 15*3*40;
                else nat += 40*5*40;
              }
              if(_ml<=5) nat += 2*2*40;
              else if(_ml<=25) nat += 5*3*40;
              else nat += 40*3*40;
            }
            const actual=Math.min(nat, _budget);
            const perLead=(_ml>0?Math.round(actual/_ml):0);
            const pct=Math.round((actual/_budget)*100);
            const barColor=pct>=95?'#DC2626':pct>=70?'#F59E0B':'#16A34A';
            return(<div style={{
                marginTop:12,padding:'10px 12px',
                background:'rgba(75,184,217,0.05)',
                border:'1px solid rgba(75,184,217,0.20)',
                borderRadius:9,
              }}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
                <div style={{
                    fontSize:9,fontWeight:700,letterSpacing:'1.2px',
                    textTransform:'uppercase',color:'#0F172A',
                    fontFamily:'var(--mono)',
                  }}>
                  ≈ pre-flight SEMrush cost
                </div>
                <div style={{fontSize:9,color:'#64748B',fontFamily:'var(--mono)'}}>
                  cap {_budget.toLocaleString('en-US')}
                </div>
              </div>
              <div style={{display:'flex',alignItems:'baseline',gap:8}}>
                <div style={{
                    fontSize:22,fontWeight:800,color:'#0F172A',
                    fontFamily:'var(--mono)',lineHeight:1.05,
                    letterSpacing:'-0.4px',
                  }}>
                  {actual.toLocaleString('en-US')}
                </div>
                <div style={{fontSize:10,color:'#64748B',fontFamily:'var(--mono)'}}>
                  credits · {perLead}/lead · {_mode}{_en?' · enrich':''}
                </div>
              </div>
              <div style={{marginTop:6,height:3,background:'#E2E8F0',borderRadius:3,overflow:'hidden'}}>
                <div style={{height:'100%',width:Math.min(100,pct)+'%',background:barColor,transition:'width 0.3s'}}></div>
              </div>
              {pct>=95&&<div style={{fontSize:9,color:'#DC2626',marginTop:5,fontFamily:'var(--mono)',fontWeight:600}}>
                ! Estimated spend will hit budget cap. Some Phase-5 polish may be skipped mid-run.
              </div>}
            </div>);
          })()}
          <button className={'gen-btn-big '+(loading?'busy':'')} onClick={loading?onCancel:handleGen}>

                    <td>{l.isPerson?

                    <td style={{fontFamily:'var(--mono)',fontSize:10}}><div style={{display:'flex',alignItems:'center',color:l.e!=='—'?'var(--green)':'var(--t3)'}}>{l.e}{l.e!=='—'&&<CopyBtn text={l.e}/>}</div></td>
                    <td style={{fontFamily:'var(--mono)',fontSize:10}}><div style={{display:'flex',alignItems:'center',color:l.p!=='—'?'var(--amber)':'var(--t3)'}}>{l.p}{l.p!=='—'&&<CopyBtn text={l.p}/>}{l._direct&&<span style={{marginLeft:4,fontSize:8,color:'var(--violet)',fontWeight:700}}>DIRECT</span>}</div></td>

                    <td style={{fontFamily:'var(--mono)',fontSize:9,color:l.kw!=='—'?'var(--violet)':'var(--t3)'}}>{l.kw}</td>
                    <td style={{fontFamily:'var(--mono)',fontSize:10,color:l.cpl!=='—'?'var(--green)':'var(--t3)',fontWeight:600}}>{l.cpl}</td>
                    <td><span className={'sc '+(l.s>=85?'sc-h':'sc-m')}>{l.s}/100</span></td>
                  </tr>):<tr><td colSpan={8} style={{textAlign:'center',padding:'30px 20px',color:'var(--t3)',fontFamily:'var(--mono)',fontSize:11}}>
                    {filter?
                      ('No results match "'+filter+'"'):
                      (realLeads.length===0?
                        '0 leads found. Try a different scope (city/industry), enable enrichment, or check that Google Places / Apollo keys are set on Railway.':
                        'No leads after filtering')}
                  </td></tr>}</tbody>
                </table>
                <div style={{textAlign:'center',padding:'10px 0 2px',fontFamily:'var(--mono)',fontSize:9,color:'var(--t3)',letterSpacing:'0.5px'}}>
                  SHOWING {filteredLeads.length} OF {realLeads.length} — {realLeads.length>0?'EXPORT FOR FULL DATASET':'NO LEADS RETURNED FROM PIPELINE'}
                </div>
              </div>
            </div></div>
          </>
        ):(
          <>
            {partialCsvUrl&&(
              <div className="card" style={{marginBottom:12}}><div className="card-p" style={{padding:'14px 16px',display:'flex',alignItems:'center',gap:14}}>
                <div style={{width:32,height:32,borderRadius:'50%',background:'var(--a10,rgba(245,158,11,0.1))',color:'var(--amber)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:16,fontWeight:700}}>⚠</div>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:600,color:'var(--t1)'}}>Run did not complete</div>
                  <div style={{fontSize:11,color:'var(--t3)'}}>Leads collected before cancel/error are available — not added to master DB.</div>
                </div>
                <a href={partialCsvUrl} download className="btn-sm btn-blue" style={{textDecoration:'none',padding:'7px 14px'}}>↓ Partial CSV</a>
              </div></div>
            )}
            <div className="run-stats-inline">
              {[{label:'Leads Found',val:'—',c:'var(--blue)'},{label:'Emails',val:'—',c:'var(--green)'},{label:'Phones',val:'—',c:'var(--amber)'},{label:'Direct Phones',val:'—',c:'var(--violet)'}].map((s,i)=>(
                <div className="rsi-card" key={i}><div className="rsi-label">{s.label}</div><div className="rsi-val" style={{color:'var(--t4)'}}>—</div></div>

            </div>
            <div className="card"><div className="card-p">
              <div className="res-title" style={{marginBottom:14}}>What you'll get</div>
              {[{icon:'◈',title:'Keyword Discovery',desc:'AI scans SEMrush + SerpAPI to find businesses ranking for your target keywords'},{icon:'◉',title:'Business Discovery',desc:'Extracts business names, domains, and contact pages from organic and paid results'},{icon:'◑',title:'Contact Enrichment',desc:'Apollo + Lusha + Hunter.io verify emails and direct dials for each lead'},{icon:'◎',title:'AI Quality Scoring',desc:'Each lead scored 0–100 based on intent signals, domain authority, and relevance'}].map((s,i)=>(
                <div key={i} style={{display:'flex',gap:12,padding:'10px 0',borderBottom:'1px solid var(--bd2)'}}>
                  <div style={{width:28,height:28,borderRadius:7,background:'var(--b5)',border:'1px solid var(--b10)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--blue)',fontSize:14,flexShrink:0}}>{s.icon}</div>
                  <div><div style={{fontSize:12,fontWeight:600,color:'var(--t1)',marginBottom:2}}>{s.title}</div><div style={{fontSize:11,color:'var(--t3)',lineHeight:1.6}}>{s.desc}</div></div>
                </div>
              ))}
            </div></div>
          </>
        )}
      </div>
    </div>
  </>);
}


/* ─── DATABASE VIEW ───
   Pulls live MySQL data (Railway) and renders run_history + master_leads.
   Color-coded numbers per analytic axis:
     • leads_total   → blue
     • leads_new     → green
     • leads_deduped → amber
     • duration      → violet
     • state badge   → green/amber/red/blue per status
   Endpoints:
     /api/db/run-history?page=N&page_size=50
     /api/db/master-leads?page=N&page_size=50
     /api/master-stats   (master count + last_seen)
*/
// 2026-06-08: Cost / Pricing tab. The user enters per-API {credits bought,
// amount paid, monthly?}; we derive $/credit and the backend uses it at run
// finalize to freeze each run's dollar cost (run-history) + per-lead cost.
function CostView(){
  const base=(typeof window!=='undefined'&&window.location.origin)||'';
  const [items,setItems]=useState({});
  const [lineItems,setLineItems]=useState([]);
  const [currency,setCurrency]=useState('$');
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const [savedAt,setSavedAt]=useState(null);
  const [err,setErr]=useState('');
  // Built-in line items so the tab still renders if the server's /api/pricing
  // is missing/old (e.g. mid-deploy) instead of throwing a JSON parse error.
  const FALLBACK_ITEMS=[
    {key:'serpapi',label:'SerpAPI',group:'SerpAPI',unit:'searches'},
    {key:'google_places',label:'Google Places',group:'Google Places',unit:'calls'},
    {key:'semrush_units',label:'SEMrush',group:'SEMrush',unit:'units'},
    {key:'apollo_email',label:'Apollo — Email',group:'Apollo',unit:'email credits'},
    {key:'apollo_phone',label:'Apollo — Phone',group:'Apollo',unit:'mobile credits'},
    {key:'apollo_export',label:'Apollo — Regular',group:'Apollo',unit:'export credits'},
    {key:'lusha',label:'Lusha',group:'Lusha',unit:'credits'},
    {key:'hunter',label:'Hunter.io',group:'Hunter.io',unit:'requests'},
    {key:'openai',label:'OpenAI',group:'OpenAI',unit:'calls'},
    {key:'gemini',label:'Gemini',group:'Gemini',unit:'calls'},
  ];
  useEffect(()=>{(async()=>{
    try{
      const r=await fetch(base+'/api/pricing');
      const txt=await r.text();
      let j=null; try{j=JSON.parse(txt);}catch(_){}
      if(j&&Array.isArray(j.line_items)&&j.line_items.length){
        setItems((j.pricing&&j.pricing.items)||{});
        setLineItems(j.line_items);
        setCurrency((j.pricing&&j.pricing.currency)||'$');
      }else{
        // Endpoint missing/old build → show defaults; Save still works once updated.
        setLineItems(FALLBACK_ITEMS);
        setErr('Pricing API not available on the server yet — showing defaults. Your Save will apply once the server has the latest build.');
      }
    }catch(e){
      setLineItems(FALLBACK_ITEMS);
      setErr('Could not reach the pricing API — showing defaults.');
    }
    setLoading(false);
  })();},[base]);
  const upd=(k,field,val)=>setItems(prev=>({...prev,[k]:{...(prev[k]||{credits:0,paid:0,monthly:false}),[field]:val}}));
  const unitPrice=(it)=>{const c=Number(it&&it.credits)||0,p=Number(it&&it.paid)||0;return c>0?p/c:0;};
  const save=async()=>{
    setSaving(true);setErr('');
    try{
      const r=await fetch(base+'/api/pricing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pricing:{items,currency}})});
      const j=await r.json();
      if(j.ok){setItems((j.pricing&&j.pricing.items)||items);setSavedAt(Date.now());}
      else setErr(j.error||'Save failed');
    }catch(e){setErr(e.message||String(e));}
    setSaving(false);
  };
  if(loading)return(<div className="card"><div className="card-p" style={{color:'var(--t3)',padding:30,textAlign:'center'}}>Loading pricing…</div></div>);
  let lastGroup=null;
  return(<>
    <div className="res-hd" style={{marginBottom:12}}>
      <div>
        <div className="res-title">Cost / Pricing</div>
        <div style={{fontSize:11,color:'var(--t3)',marginTop:2}}>Enter what you paid per API → we compute the real $/credit, then freeze each run's cost.</div>
      </div>
      <button className="btn btn-primary" style={{minWidth:120}} onClick={save} disabled={saving}>{saving?'Saving…':'Save Pricing'}</button>
    </div>
    {err&&<div style={{padding:'10px 14px',background:'rgba(239,68,68,0.08)',color:'var(--red)',borderRadius:8,marginBottom:10,fontSize:12}}>⚠ {err}</div>}
    {savedAt&&!err&&<div style={{padding:'10px 14px',background:'rgba(34,197,94,0.10)',color:'var(--green)',borderRadius:8,marginBottom:10,fontSize:12}}>✓ Pricing saved — applies to the NEXT run onward (past runs stay frozen).</div>}
    <div className="card"><div className="card-p">
      <div style={{overflowX:'auto'}}>
        <table className="rt">
          <thead><tr>
            <th>API / Credit pool</th>
            <th style={{textAlign:'right'}}>Credits bought</th>
            <th style={{textAlign:'right'}}>Amount paid ({currency})</th>
            <th style={{textAlign:'center'}}>Monthly plan</th>
            <th style={{textAlign:'right'}}>{currency}/credit</th>
          </tr></thead>
          <tbody>
            {lineItems.map(li=>{
              const it=items[li.key]||{credits:0,paid:0,monthly:false};
              const showGroup=li.group!==lastGroup; lastGroup=li.group;
              const up=unitPrice(it);
              return(<tr key={li.key}>
                <td>
                  {showGroup&&<div style={{fontSize:9,letterSpacing:'1.5px',textTransform:'uppercase',color:'var(--t3)',marginBottom:2}}>{li.group}</div>}
                  <div style={{fontSize:12,fontWeight:600}}>{li.label}</div>
                  <div style={{fontSize:9,color:'var(--t3)'}}>per {li.unit}</div>
                </td>
                <td style={{textAlign:'right'}}><input className="fi" type="number" min="0" step="any" style={{maxWidth:130,textAlign:'right'}} value={it.credits||''} placeholder="0" onChange={e=>upd(li.key,'credits',e.target.value)}/></td>
                <td style={{textAlign:'right'}}><input className="fi" type="number" min="0" step="any" style={{maxWidth:130,textAlign:'right'}} value={it.paid||''} placeholder="0" onChange={e=>upd(li.key,'paid',e.target.value)}/></td>
                <td style={{textAlign:'center'}}><div className={'tog '+(it.monthly?'on':'off')} style={{display:'inline-flex'}} onClick={()=>upd(li.key,'monthly',!it.monthly)}><div className="tog-k"></div></div></td>
                <td style={{textAlign:'right',fontFamily:'var(--mono)',fontSize:12,color:up>0?'var(--green)':'var(--t3)',fontWeight:600}}>{up>0?(currency+up.toFixed(4)):'—'}</td>
              </tr>);
            })}
          </tbody>
        </table>
      </div>
      <div style={{marginTop:14,fontSize:11,color:'var(--t3)',lineHeight:1.6}}>
        <div><b>How it works:</b> per-run cost = Σ (credits actually consumed × {currency}/credit). An API a run never used costs <b>{currency}0</b> for that run — so bypassing SEMrush (SerpAPI-only) drops its cost to zero automatically.</div>
        <div style={{marginTop:4}}>Cost is <b>frozen</b> when the run finishes; editing prices here only affects future runs. Pricing is stored in a local file — re-enter it after a Railway redeploy (past run costs are safe in the DB).</div>
      </div>
    </div></div>
  </>);
}

function DatabaseView({onOpenLead}){
  const [tab,setTab]=useState('runs');           // 'runs' | 'leads'
  const [runs,setRuns]=useState([]);
  const [runsTotal,setRunsTotal]=useState(0);
  const [leads,setLeads]=useState([]);
  const [leadsTotal,setLeadsTotal]=useState(0);
  const [page,setPage]=useState(1);
  const [pageSize]=useState(50);
  const [stats,setStats]=useState({db:0,run_history:0,startup_error:''});
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState('');
  // 2026-06-16: lead search + filters.
  const [q,setQ]=useState(''); const [qInput,setQInput]=useState('');
  const [fIndustry,setFIndustry]=useState(''); const [fStatus,setFStatus]=useState(''); const [fBde,setFBde]=useState('');
  const [industries,setIndustries]=useState([]); const [bdeList,setBdeList]=useState([]);
  const [assignOpen,setAssignOpen]=useState(null); const [assignMsg,setAssignMsg]=useState('');
  const base=(typeof window!=='undefined'&&window.location.origin)||'';
  const load=useCallback(async ()=>{
    setLoading(true);setErr('');
    try{
      // /api/db/debug returns master_leads_count + run_history_count + db_ready
      // in one call; /api/master-stats only returns total_leads. Using debug
      // here keeps the DB summary tiles tight to the live DB state.
      const ms=await fetch(base+'/api/db/debug',{credentials:'same-origin'});
      if(ms.status===401){window.dispatchEvent(new Event('lf-auth-lost'));return;}
      if(ms.ok){
        const j=await ms.json();
        setStats({
          db:j.master_leads_count||0,
          run_history:j.run_history_count||0,
          startup_error:j.db_startup_error||j.query_error||'',
        });
      }
      let url=base+(tab==='runs'?'/api/db/run-history':'/api/db/master-leads')+'?page='+page+'&page_size='+pageSize;
      if(tab==='leads'){
        if(q)url+='&q='+encodeURIComponent(q);
        if(fIndustry)url+='&industry='+encodeURIComponent(fIndustry);
        if(fStatus)url+='&status='+fStatus;
        if(fBde)url+='&bde_id='+fBde;
      }
      const r=await fetch(url,{credentials:'same-origin'});
      if(r.status===401){window.dispatchEvent(new Event('lf-auth-lost'));return;}
      if(!r.ok){setErr('HTTP '+r.status);setLoading(false);return;}
      const j=await r.json();
      if(tab==='runs'){
        setRuns(Array.isArray(j.rows)?j.rows:[]);
        setRunsTotal(j.total||0);
      }else{
        setLeads(Array.isArray(j.rows)?j.rows:[]);
        setLeadsTotal(j.total||0);
      }
    }catch(e){setErr(e.message||String(e));}
    setLoading(false);
  },[base,tab,page,pageSize,q,fIndustry,fStatus,fBde]);
  useEffect(()=>{load();},[load]);
  // Filter option sources (once).
  useEffect(()=>{
    apiJSON('/api/db/industries').then(d=>{if(d&&d.industries)setIndustries(d.industries);});
    apiJSON('/api/allocation/bdes').then(d=>{if(d&&d.bdes)setBdeList(d.bdes);});
  },[]);
  const csvHref=base+'/api/db/master-leads.csv?'+[q&&'q='+encodeURIComponent(q),fIndustry&&'industry='+encodeURIComponent(fIndustry),fStatus&&'status='+fStatus,fBde&&'bde_id='+fBde].filter(Boolean).join('&');
  const assign=async(id,bdeId)=>{ setAssignOpen(null); if(!bdeId)return;
    const d=await apiJSON('/api/leads/'+id+'/reassign',{method:'POST',body:JSON.stringify({bde_id:Number(bdeId)})});
    if(d&&d.__status<400){ const b=bdeList.find(x=>String(x.id)===String(bdeId)); setAssignMsg('Assigned '+lfId(id)+' → '+((b&&b.username)||('BDE '+bdeId))); load(); }
    else setAssignMsg('Assign failed: '+((d&&d.error)||'error')); };
  // Aggregates over the loaded page (cheap client-side roll-ups for the
  // header strip — exact, paginated, but reflect THIS page only).
  const agg=(()=>{
    if(tab!=='runs')return null;
    const a={total:0,new:0,dedup:0,err:0,done:0,running:0,cancelled:0};
    for(const r of runs){
      a.total+=Number(r.leads_total||0);
      a.new+=Number(r.leads_new||0);
      a.dedup+=Number(r.leads_deduped_out||0);
      if(r.state==='done')a.done++;
      else if(r.state==='error')a.err++;
      else if(r.state==='cancelled')a.cancelled++;
      else if(r.state==='running')a.running++;
    }
    return a;
  })();
  const _state_colour=(s)=>s==='done'?'var(--green)':s==='error'?'var(--red)':s==='cancelled'?'var(--amber)':s==='running'?'var(--blue)':'var(--t3)';
  const _fmt_dt=(s)=>{
    if(!s)return '—';
    try{return new Date(s).toLocaleString('en-AU',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}catch(e){return String(s);}
  };
  const totalPages=Math.max(1,Math.ceil((tab==='runs'?runsTotal:leadsTotal)/pageSize));
  return(<>

      <div className="kpi"><div className="kpi-label">Page · Deduped Out</div><div className="kpi-val" style={{color:'var(--amber)'}}>{agg?Number(agg.dedup||0).toLocaleString('en-US'):'—'}</div><div className="kpi-trend">Already in master_leads</div></div>
    </div>
    {stats.startup_error&&<div className="card" style={{marginBottom:10,borderColor:'var(--red)'}}><div className="card-p" style={{color:'var(--red)',fontSize:12}}>⚠ DB startup error: {stats.startup_error}</div></div>}
    <div className="card"><div className="card-p">
      <div className="res-hd" style={{marginBottom:12}}>
        <div>
          <div className="res-title">Railway MySQL — {tab==='runs'?'run_history':'master_leads'}</div>

            {(tab==='runs'?runsTotal:leadsTotal).toLocaleString('en-US')} row{(tab==='runs'?runsTotal:leadsTotal)===1?'':'s'} · page {page} / {totalPages}

        </div>
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          <div style={{display:'inline-flex',background:'var(--inp)',border:'1px solid var(--bd)',borderRadius:8,padding:3}}>
            <button className="btn-sm" style={{padding:'5px 12px',fontSize:11,background:tab==='runs'?'var(--blue)':'transparent',color:tab==='runs'?'#fff':'var(--t2)',border:'none',borderRadius:6}} onClick={()=>{setTab('runs');setPage(1);}}>Runs</button>
            <button className="btn-sm" style={{padding:'5px 12px',fontSize:11,background:tab==='leads'?'var(--blue)':'transparent',color:tab==='leads'?'#fff':'var(--t2)',border:'none',borderRadius:6}} onClick={()=>{setTab('leads');setPage(1);}}>Leads</button>
          </div>
          <button className="btn-sm btn-ghost" onClick={load}>↻ Refresh</button>
        </div>
      </div>
      {err&&<div style={{padding:'10px 14px',background:'rgba(239,68,68,0.08)',color:'var(--red)',borderRadius:8,marginBottom:10,fontSize:12}}>⚠ {err}</div>}
      <div style={{overflowX:'auto'}}>
        {tab==='runs'?(
          <table className="rt">
            <thead><tr>
              <th>ID</th><th>User</th><th>Industry / Mode</th><th>Country</th>
              <th style={{textAlign:'right'}}>Total</th>
              <th style={{textAlign:'right'}}>New</th>
              <th style={{textAlign:'right'}}>Deduped</th>
              <th style={{textAlign:'right'}}>Duration</th>

            <tbody>

                <tr><td colSpan="12" style={{textAlign:'center',padding:30,color:'var(--t3)'}}>No runs yet. Generate some leads first.</td></tr>
              ):runs.map(r=>(
                <tr key={r.id}>

                  <td style={{fontSize:12}}>{r.industry||'—'} <span style={{fontSize:10,color:'var(--t3)',marginLeft:4}}>· {r.mode}</span></td>
                  <td style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--t2)'}}>{r.country||'—'}</td>

              ):leads.map(r=>(

                  <td style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--blue)'}}>{lfId(r.id)}</td>
                  <td style={{fontSize:12,color:'var(--t1)',fontWeight:600}}>{r.display_name||r.normalized_name||'—'}</td>
                  <td style={{fontSize:12}}>{r.company_name||'—'}</td>
                  <td style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--violet)'}}>{r.root_domain||'—'}</td>
                  <td style={{fontSize:11,color:'var(--t2)'}}>{r.role||'—'}</td>
                  <td style={{fontFamily:'var(--mono)',fontSize:11,color:r.phone_e164?'var(--amber)':'var(--t3)'}}>{r.phone_e164||'—'}</td>
                  <td style={{fontSize:11,color:r.primary_email?'var(--green)':'var(--t3)'}}>{r.primary_email||'—'}</td>
                  <td style={{fontSize:10,fontWeight:600,textTransform:'capitalize',color:{secured:'var(--green)',contacted:'var(--amber)',assigned:'var(--blue)'}[r.alloc_status]||'var(--t3)'}}>{r.alloc_status||'unassigned'}</td>
                  <td style={{fontSize:11,color:r.assigned_bde_username?'var(--t1)':'var(--t3)'}}>{r.assigned_bde_username||'—'}</td>
                  <td style={{fontSize:11,color:'var(--t2)'}}>{r.industry||'—'}</td>
                  <td style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--t2)'}}>{r.country||'—'}</td>
                  {/* Blank for leads stored before the cost feature (null). */}
                  <td style={{textAlign:'right',fontFamily:'var(--mono)',fontSize:11,color:(r.cost_per_lead_usd!=null&&Number(r.cost_per_lead_usd)>0)?'var(--green)':'var(--t3)'}}>{(r.cost_per_lead_usd!=null&&Number(r.cost_per_lead_usd)>0)?('$'+Number(r.cost_per_lead_usd).toFixed(2)):''}</td>
                  <td style={{textAlign:'center'}} onClick={e=>e.stopPropagation()}>
                    {assignOpen===r.id
                      ? <select autoFocus defaultValue="" onChange={e=>assign(r.id,e.target.value)} onBlur={()=>setAssignOpen(null)} style={{padding:'3px 4px',background:'var(--bg)',color:'var(--t1)',border:'1px solid var(--blue)',borderRadius:6,fontSize:11,maxWidth:96}}>
                          <option value="" disabled>Pick BDE…</option>
                          {bdeList.map(b=><option key={b.id} value={b.id}>{b.full_name||b.username}</option>)}
                        </select>
                      : <button title={r.assigned_bde_username?('Reassign (currently '+r.assigned_bde_username+')'):'Assign this lead to a BDE'} onClick={()=>setAssignOpen(r.id)} style={{width:24,height:24,borderRadius:6,border:'1px solid var(--bd)',background:r.assigned_bde_username?'var(--blue)':'var(--green)',color:'#fff',cursor:'pointer',fontWeight:700,lineHeight:'1',fontSize:15}}>+</button>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          </>
        )}
      </div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:12,fontSize:11,color:'var(--t3)'}}>
        <div>Page {page} of {totalPages}</div>
        <div style={{display:'flex',gap:6}}>
          <button className="btn-sm btn-ghost" disabled={page<=1} onClick={()=>setPage(p=>Math.max(1,p-1))}>← Prev</button>
          <button className="btn-sm btn-ghost" disabled={page>=totalPages} onClick={()=>setPage(p=>Math.min(totalPages,p+1))}>Next →</button>
        </div>
      </div>
    </div></div>
  </>);
}

/* ─── HEATMAP VIEW ─── */
const SUBURB_DATA=[
  {name:'Ballarat Central',lat:-37.5622,lng:143.8503,leads:23,t1:5,t2:12,t3:6},
  {name:'Sebastopol',lat:-37.5822,lng:143.8424,leads:20,t1:6,t2:9,t3:5},
  {name:'Ballarat East',lat:-37.5534,lng:143.8724,leads:18,t1:3,t2:10,t3:5},
  {name:'Ballarat North',lat:-37.5344,lng:143.8503,leads:15,t1:4,t2:7,t3:4},
  {name:'Alfredton',lat:-37.5451,lng:143.8145,leads:11,t1:2,t2:5,t3:4},
  {name:'Wendouree',lat:-37.5451,lng:143.8245,leads:12,t1:2,t2:6,t3:4},
  {name:'Brown Hill',lat:-37.5722,lng:143.8803,leads:9,t1:2,t2:4,t3:3},
  {name:'Delacombe',lat:-37.5912,lng:143.8245,leads:8,t1:1,t2:4,t3:3},
  {name:'Mount Pleasant',lat:-37.5722,lng:143.8624,leads:7,t1:1,t2:3,t3:3},
  {name:'Buninyong',lat:-37.6422,lng:143.8803,leads:5,t1:1,t2:2,t3:2},
];

function HeatmapView({theme}){
  const mapRef=useRef(null);const mapInst=useRef(null);
  const [tierFilter,setTierFilter]=useState('all');
  const [selected,setSelected]=useState(null);
  const isDark=theme==='dark';

  useEffect(()=>{
    const L=window.Leaflet||window.L;
    if(!L||!L.map||!mapRef.current||mapInst.current)return;
    const tileUrl=isDark
      ?'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
      :'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';
    const map=L.map(mapRef.current,{center:[-37.5622,143.8503],zoom:12,zoomControl:false});
    L.tileLayer(tileUrl,{attribution:'© CartoDB',maxZoom:19,subdomains:'abcd'}).addTo(map);
    L.control.zoom({position:'bottomright'}).addTo(map);
    mapInst.current=map;
    // Force map to recalculate size after mount
    setTimeout(()=>map.invalidateSize(),100);
    setTimeout(()=>map.invalidateSize(),500);

    // Heatmap layer
    try{
      if(L.heatLayer){
        const heatPts=SUBURB_DATA.map(s=>[s.lat,s.lng,s.leads/23]);
        L.heatLayer(heatPts,{radius:55,blur:35,maxZoom:14,gradient:{0.2:'#4BB8D9',0.5:'#F59E0B',0.8:'#EF4444'}}).addTo(map);
      }
    }catch(e){console.warn('Heat layer skipped:',e.message)}

    // Markers
    SUBURB_DATA.forEach(s=>{
      const color=s.t1>=4?'#7DBA4B':s.t1>=2?'#F59E0B':'#4BB8D9';
      const icon=L.divIcon({className:'',html:`<div style="width:${8+s.leads/2}px;height:${8+s.leads/2}px;border-radius:50%;background:${color};border:2px solid white;box-shadow:0 0 10px ${color}80;cursor:pointer;transition:transform 0.2s"></div>`,iconAnchor:[0,0]});
      const marker=L.marker([s.lat,s.lng],{icon}).addTo(map);
      marker.bindPopup(`<div style="min-width:160px"><div style="font-weight:700;font-size:13px;margin-bottom:6px">${s.name}</div><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px"><span>Total leads</span><span style="font-weight:600;color:#4BB8D9">${s.leads}</span></div><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px"><span>Tier 1</span><span style="font-weight:600;color:#7DBA4B">${s.t1}</span></div><div style="display:flex;justify-content:space-between;font-size:11px"><span>Tier 2</span><span style="font-weight:600;color:#F59E0B">${s.t2}</span></div></div>`);
    });

    return()=>{if(mapInst.current){mapInst.current.remove();mapInst.current=null;}};
  },[]);

  const sorted=[...SUBURB_DATA].sort((a,b)=>b.leads-a.leads);
  const maxLeads=sorted[0].leads;

  return(<>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
      <div><div style={{fontSize:13,fontWeight:700,color:'var(--t1)'}}>Territory Heatmap</div><div style={{fontSize:11,color:'var(--t3)',marginTop:2}}>Lead density by suburb — click markers for breakdown</div></div>
      <div style={{display:'flex',gap:6}}>
        {['all','t1','t2','t3'].map(f=>(
          <button key={f} className="map-filter-btn" onClick={()=>setTierFilter(f)} style={{background:tierFilter===f?'var(--blue)':'var(--sf)',borderColor:tierFilter===f?'var(--blue)':'var(--bd)',color:tierFilter===f?'#fff':'var(--t2)'}}>
            {f==='all'?'All Tiers':f==='t1'?'Tier 1':f==='t2'?'Tier 2':'Tier 3'}
          </button>
        ))}
      </div>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 260px',gap:16,alignItems:'start'}}>
      <div>
        <div className="map-wrap">
          <div ref={mapRef} className="map-el"></div>
          <div className="map-legend">
            <div className="map-legend-title">Lead Density</div>
            <div className="map-legend-row"><div className="map-legend-dot" style={{background:'#7DBA4B',boxShadow:'0 0 6px #7DBA4B'}}></div>Tier 1 hotspot</div>
            <div className="map-legend-row"><div className="map-legend-dot" style={{background:'#F59E0B',boxShadow:'0 0 6px #F59E0B'}}></div>Tier 2 zone</div>
            <div className="map-legend-row"><div className="map-legend-dot" style={{background:'#4BB8D9',boxShadow:'0 0 6px #4BB8D9'}}></div>Tier 3 area</div>
          </div>
        </div>
      </div>
      <div>
        <div className="card" style={{marginBottom:16}}><div className="card-p" style={{paddingTop:16}}>
          <div style={{fontFamily:'var(--mono)',fontSize:9,letterSpacing:'2px',textTransform:'uppercase',color:'var(--t3)',marginBottom:12}}>SUBURB RANKINGS</div>
          <div className="suburb-list">
            {sorted.map((s,i)=>(
              <div className="suburb-row" key={s.name} onClick={()=>setSelected(selected===s.name?null:s.name)}>
                <span className="suburb-rank">#{i+1}</span>
                <div style={{flex:1}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
                    <span className="suburb-name" style={{fontSize:11}}>{s.name}</span>
                    <span style={{fontFamily:'var(--mono)',fontSize:11,fontWeight:700,color:'var(--blue)'}}>{s.leads}</span>
                  </div>
                  <div className="suburb-bar"><div className="suburb-bar-fill" style={{width:`${(s.leads/maxLeads)*100}%`,background:`linear-gradient(90deg,var(--blue),var(--green))`}}></div></div>
                  {selected===s.name&&<div style={{marginTop:8,display:'flex',gap:8}}>
                    {[{l:'T1',v:s.t1,c:'var(--green)'},{l:'T2',v:s.t2,c:'var(--amber)'},{l:'T3',v:s.t3,c:'var(--t3)'}].map(t=>(
                      <div key={t.l} style={{flex:1,textAlign:'center',padding:'5px 4px',background:'var(--sf2)',borderRadius:6,border:'1px solid var(--bd)'}}>
                        <div style={{fontFamily:'var(--mono)',fontSize:14,fontWeight:700,color:t.c}}>{t.v}</div>
                        <div style={{fontFamily:'var(--mono)',fontSize:8,color:'var(--t3)'}}>{t.l}</div>
                      </div>
                    ))}
                  </div>}
                </div>
              </div>
            ))}
          </div>
        </div></div>
        <div className="card"><div className="card-p" style={{paddingTop:16}}>
          <div style={{fontFamily:'var(--mono)',fontSize:9,letterSpacing:'2px',textTransform:'uppercase',color:'var(--t3)',marginBottom:10}}>TERRITORY SUMMARY</div>
          <div className="sr"><span className="sk">Suburbs scanned</span><span className="sv bl">10</span></div>
          <div className="sr"><span className="sk">Total leads</span><span className="sv gr">128</span></div>
          <div className="sr"><span className="sk">Highest density</span><span className="sv bl">Ballarat Central</span></div>
          <div className="sr"><span className="sk">Best suburb</span><span className="sv gr">Sebastopol (T1:6)</span></div>
          <div className="sr"><span className="sk">Coverage radius</span><span className="sv">~25 km</span></div>
        </div></div>
      </div>
    </div>
  </>);
}

// Phase 2 (2026-05-07): the intel strip's six tiles now reflect real backend
// data instead of randomized mocks. Mapping:
//   db          → /api/master-stats total_leads  (60s poll)
//   industries  → /industries length              (one-shot at mount)
//   dedupOut    → cumulative master_leads_deduped_out from this session
//                 (App() pushes this in via update() when a run finishes)
//   validNow    → valid_leads_in_progress, pushed in by polling
//   health      → % of API services with status==='ok' AND pct_remaining>10
//                 (derived from /api/credits payload pushed in via update())
//   syncTs      → epoch-ms of the last successful /api/credits poll
function useLiveStats(){
  const [s,setS]=useState({db:0,industries:0,dedupOut:0,validNow:0,health:100,syncTs:Date.now()});
  const [flash,setFlash]=useState({});
  useEffect(()=>{
    const base=(typeof window!=='undefined'&&window.location.origin)||'';
    let alive=true;
    const fetchMaster=async()=>{
      try{
        const r=await fetch(base+'/api/master-stats',{credentials:'same-origin'});
        if(r.status===401){window.dispatchEvent(new Event('lf-auth-lost'));return;}
        if(!r.ok)return;
        const j=await r.json();
        if(alive&&typeof j.total_leads==='number'){
          // Phase 2 (2026-05-07): refresh syncTs on every successful poll so
          // the "Last Sync" tile actually moves.
          setS(p=>{
            const next={...p,syncTs:Date.now()};
            if(p.db!==j.total_leads)next.db=j.total_leads;
            return next;
          });
          setFlash(f=>({...f,db:Date.now()}));
        }
      }catch(e){/* network */}
    };
    const fetchInd=async()=>{
      try{
        const r=await fetch(base+'/industries',{credentials:'same-origin'});
        if(!r.ok)return;
        const j=await r.json();
        if(alive&&Array.isArray(j.industries))setS(p=>({...p,industries:j.industries.length}));
      }catch(e){}
    };
    fetchMaster();fetchInd();
    const t=setInterval(fetchMaster,60000);
    return()=>{alive=false;clearInterval(t)};
  },[]);
  // update() lets App() push live values (validNow, dedupOut, health, syncTs)
  const update=(patch)=>{
    setS(p=>({...p,...patch}));
    setFlash(f=>{const next={...f};Object.keys(patch).forEach(k=>{next[k]=Date.now()});return next;});
  };
  return{s,flash,update};
}
// "Last sync" tile shows time since the last credits refresh succeeded.
function useSyncAgo(syncTs){
  const [now,setNow]=useState(Date.now());
  useEffect(()=>{const t=setInterval(()=>setNow(Date.now()),15000);return()=>clearInterval(t)},[]);
  if(!syncTs)return '—';
  const m=Math.floor((now-syncTs)/60000);
  return m<1?'now':m<60?m+'m ago':Math.floor(m/60)+'h ago';
}
// Phase 2 (2026-05-06): real /api/credits fetch (was random-decrement mock).
// Fetches once on mount, then polls every 60s. Backend already TTL-caches
// at 60s so we're not hammering Apollo/SEMrush.
function useLiveCredits(){
  const [c,setC]=useState({Apollo:0,Lusha:0,SEMrush:0});
  const [last,setLast]=useState(null);
  const [details,setDetails]=useState(null);
  const fetchCredits=useCallback(async (force)=>{
    try{
      const base=(typeof window!=='undefined'&&window.location.origin)||'';
      const url=base+'/api/credits'+(force?'/refresh':'');
      const r=await fetch(url,{method:force?'POST':'GET',credentials:'same-origin'});
      if(r.status===401){window.dispatchEvent(new Event('lf-auth-lost'));return null;}
      if(!r.ok)return null;
      const data=await r.json();
      const svc=data.services||{};
      setC({
        Apollo: ((svc.apollo&&svc.apollo.remaining)|0),
        Lusha:  ((svc.lusha&&svc.lusha.remaining )|0),
        SEMrush:((svc.semrush&&svc.semrush.remaining)|0),
      });
      setDetails(data);
      setLast('refresh:'+Date.now());
      // Phase 2 (2026-05-15): return the payload so callers (post-run diff)
      // can read the freshly-fetched values synchronously without waiting on
      // a setState round-trip.
      return data;
    }catch(e){/* silent — UI keeps last known values */}
    return null;
  },[]);
  useEffect(()=>{fetchCredits(false);const t=setInterval(()=>fetchCredits(false),60000);return()=>clearInterval(t)},[fetchCredits]);
  return{c,last,details,refresh:()=>fetchCredits(true)};
}

        </div>

        {!dbBusy&&dbLeads.map(r=><AllocLeadChip key={r.id} r={r} fromBde={r.assigned_bde_id||null} onDragStart={onDragStart} compact/>)}
        {!dbBusy&&!dbLeads.length&&<div style={{color:'var(--t3)',fontSize:13,padding:10}}>No leads in the database yet.</div>}
      </div>
    </div>}

    {/* Auto-distribute control — two options */}
    <div className="card" style={{padding:16,marginBottom:14}}>
      <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap',marginBottom:12}}>

        <div style={{color:'var(--t3)',fontSize:12,flex:1,minWidth:160}}>First turn on the BDEs working today (the green switch on each card), then choose how to allocate.</div>
        <button onClick={()=>setShowManual(s=>!s)} style={{padding:'9px 14px',background:'var(--sf)',color:'var(--t1)',border:'1px solid var(--bd)',borderRadius:8,fontWeight:600,cursor:'pointer'}}>{showManual?'Cancel':'+ Add lead manually'}</button>
      </div>
      <div style={{display:'flex',gap:14,flexWrap:'wrap',alignItems:'stretch'}}>
        {/* Option 1: all remaining */}
        <div style={{flex:'1 1 240px',border:'1px solid var(--bd)',borderRadius:10,padding:'12px 14px',display:'flex',flexDirection:'column',gap:8}}>
          <div style={{fontWeight:700,color:'var(--t1)',fontSize:13}}>Allocate all balance leads</div>
          <div style={{color:'var(--t3)',fontSize:12,flex:1}}>Shares every remaining unassigned lead in the database evenly across the active BDEs.</div>
          <button onClick={()=>distribute(0)} style={{padding:'10px 16px',background:'var(--blue)',color:'#fff',border:0,borderRadius:8,fontWeight:700,cursor:'pointer'}}>Allocate all remaining</button>
        </div>
        {/* Option 2: fixed number each */}
        <div style={{flex:'1 1 240px',border:'1px solid var(--bd)',borderRadius:10,padding:'12px 14px',display:'flex',flexDirection:'column',gap:8}}>
          <div style={{fontWeight:700,color:'var(--t1)',fontSize:13}}>Allocate a set number to each BDE</div>
          <div style={{color:'var(--t3)',fontSize:12,flex:1}}>Gives this many leads to <b>every</b> active BDE. If the pool doesn't have enough, you'll be told to lower the number.</div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <input type="number" min="1" value={perBdeN} onChange={e=>setPerBdeN(e.target.value)} style={{...inp,width:90}}/>
            <span style={{color:'var(--t2)',fontSize:13}}>per BDE</span>
            <button onClick={()=>distribute(parseInt(perBdeN,10)||0)} style={{marginLeft:'auto',padding:'10px 16px',background:'var(--green)',color:'#fff',border:0,borderRadius:8,fontWeight:700,cursor:'pointer'}}>Allocate</button>
          </div>
        </div>
      </div>
      {showManual&&<div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center',marginTop:12,paddingTop:12,borderTop:'1px solid var(--bd)'}}>
        <input style={inp} placeholder="Company" value={manual.company} onChange={e=>setManual(m=>({...m,company:e.target.value}))}/>
        <input style={inp} placeholder="Domain *" value={manual.domain} onChange={e=>setManual(m=>({...m,domain:e.target.value}))}/>
        <input style={inp} placeholder="Contact name" value={manual.name} onChange={e=>setManual(m=>({...m,name:e.target.value}))}/>
        <input style={inp} placeholder="Phone" value={manual.phone} onChange={e=>setManual(m=>({...m,phone:e.target.value}))}/>
        <input style={inp} placeholder="Email" value={manual.email} onChange={e=>setManual(m=>({...m,email:e.target.value}))}/>
        <select style={inp} value={manual.bde_id} onChange={e=>setManual(m=>({...m,bde_id:e.target.value}))}>
          <option value="">Assign to… (optional)</option>
          {bdes.map(b=>(<option key={b.id} value={b.id}>{b.username}</option>))}
        </select>
        <button onClick={addManual} style={{padding:'9px 16px',background:'var(--green)',color:'#fff',border:0,borderRadius:8,fontWeight:700,cursor:'pointer'}}>Add</button>
      </div>}
    </div>

    {/* BDE cards */}
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(340px,1fr))',gap:14}}>
      {bdes.map(b=>{
        const isOpen=expanded===b.id; const isOver=dragOver===b.id; const leads=bdeLeads[b.id]||[];
        return(<div key={b.id} className="card"
          onDragOver={e=>{e.preventDefault();if(dragOver!==b.id)setDragOver(b.id);}}
          onDragLeave={()=>setDragOver(o=>o===b.id?null:o)}
          onDrop={e=>onDropBde(e,b.id)}
          style={{padding:0,overflow:'hidden',border:'2px solid '+(isOver?'var(--green)':'var(--bd)'),
            boxShadow:isOver?'0 0 0 3px rgba(125,186,75,0.18)':'none',transition:'border-color .12s'}}>
          {/* Card header */}
          <div style={{padding:'14px 16px',cursor:'pointer',display:'flex',alignItems:'center',gap:12}} onClick={()=>toggleExpand(b.id)}>
            <div style={{width:38,height:38,borderRadius:'50%',background:'var(--blue)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:15,flexShrink:0}}>{(b.username||'?').slice(0,1).toUpperCase()}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:700,color:'var(--t1)',fontSize:14}}>{b.full_name||b.username}</div>
              <div style={{fontSize:11,color:'var(--t3)'}}>{b.username}{b.mobile_e164?(' · '+b.mobile_e164):''}{!b.is_active&&' · disabled'}</div>
            </div>
            <div title="Working today?" onClick={e=>{e.stopPropagation();setActive(a=>({...a,[b.id]:!a[b.id]}));}}
                 className={'tog '+(active[b.id]?'on':'off')} style={{transform:'scale(0.8)',flexShrink:0}}><div className="tog-k"></div></div>
            <span style={{color:'var(--t3)',fontSize:14,flexShrink:0}}>{isOpen?'▾':'▸'}</span>
          </div>
          {/* Stats strip */}
          <div style={{display:'flex',justifyContent:'space-around',padding:'10px 8px',borderTop:'1px solid var(--bd)',background:'var(--bg)'}}>
            <AllocStat label="Leads" value={b.assigned_count} color="var(--blue)"/>
            <AllocStat label="Contacted" value={b.contacted_count} color="var(--amber)"/>
            <AllocStat label="Secured" value={b.secured_count} color="var(--green)"/>
            <AllocStat label="Calls" value={b.call_count} color="var(--violet)"/>
          </div>
          {/* Expanded lead block (scrollable, drag source + drop target) */}
          {isOpen&&<div style={{padding:'12px 14px',borderTop:'1px solid var(--bd)'}}>
            <div style={{fontSize:11,color:'var(--t3)',marginBottom:8}}>Currently allocated — drag onto another BDE to move</div>
            <div style={{maxHeight:340,overflow:'auto',paddingRight:4}}>
              {leads.map(r=><AllocLeadChip key={r.id} r={r} fromBde={b.id} onDragStart={onDragStart}
                  onOpen={onOpenLead} onContacted={(id,st)=>setStatus(id,st,'contacted',b.id)} onSecured={(id,st)=>setStatus(id,st,'secured',b.id)}/>)}
              {!leads.length&&<div style={{color:'var(--t3)',fontSize:12,padding:'14px 0',textAlign:'center',border:'1.5px dashed var(--bd)',borderRadius:8}}>No leads yet — drag some here.</div>}
            </div>
          </div>}
        </div>);
      })}
      {!bdes.length&&<div className="card" style={{padding:18,color:'var(--t3)'}}>No BDE accounts found. Create them in User Management.</div>}
    </div>

    {/* Recently contacted / secured feed */}
    <div className="card" style={{padding:16,marginTop:14}}>
      <div style={{fontWeight:700,color:'var(--t1)',marginBottom:8}}>Recent activity</div>
      <table style={{width:'100%',borderCollapse:'collapse'}}>
        <tbody>{feed.map(r=>(
          <tr key={r.id}><td style={tdf}>{lfId(r.id)}</td><td style={tdf}>{r.company_name||r.root_domain}</td>
            <td style={tdf}>{r.bde_username||'—'}</td>
            <td style={{...tdf,textAlign:'right'}}>contacted {r.contacted_at?String(r.contacted_at).replace('T',' ').slice(0,16):''}</td></tr>))}
          {!feed.length&&<tr><td style={tdf} colSpan={4}>No activity yet.</td></tr>}
        </tbody>
      </table>
    </div>
  </div>);
}

function UsersView(){
  const [users,setUsers]=useState([]);
  const [msg,setMsg]=useState('');
  const [nu,setNu]=useState({username:'',full_name:'',role:'bde',password:''});
  const [showAdd,setShowAdd]=useState(false);
  const [collapsed,setCollapsed]=useState({});
  const load=async()=>{ const d=await apiJSON('/api/users'); if(d&&d.users)setUsers(d.users); };
  useEffect(()=>{load();},[]);
  const create=async()=>{
    if(!nu.username.trim()||!nu.password){setMsg('Username and password are required.');return;}
    const d=await apiJSON('/api/users',{method:'POST',body:JSON.stringify(nu)});
    if(d&&d.ok){ setMsg('Created '+nu.username+'.'); setNu({username:'',full_name:'',role:'bde',password:''}); setShowAdd(false); load(); }
    else setMsg('Error: '+((d&&d.error)||'failed')); };
  const setRole=async(id,role)=>{ await apiJSON('/api/users/'+id,{method:'PATCH',body:JSON.stringify({role})}); load(); };
  const toggle=async(u)=>{ await apiJSON('/api/users/'+u.id,{method:'PATCH',body:JSON.stringify({is_active:!u.is_active})}); load(); };
  const resetPw=async(id)=>{ const pw=prompt('Set a new password (min 6 chars):'); if(!pw)return;
    const d=await apiJSON('/api/users/'+id+'/password',{method:'POST',body:JSON.stringify({password:pw})});
    setMsg(d&&d.ok?'Password updated.':'Error: '+((d&&d.error)||'failed')); };
  const inp={padding:'10px 12px',background:'var(--bg)',color:'var(--t1)',border:'1px solid var(--bd)',borderRadius:8,fontSize:13};
  const roleColor={admin:'var(--violet)',manager:'var(--blue)',bde:'var(--green)',user:'var(--t3)'};
  const GROUPS=[{key:'admin',label:'Administrators'},{key:'manager',label:'Managers'},{key:'bde',label:'BDEs'},{key:'user',label:'Other'}];
  const byRole=(k)=>users.filter(u=>u.role===k);
  const activeCount=users.filter(u=>u.is_active).length;

  const userRow=(u)=>(<div key={u.id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 4px',borderBottom:'1px solid var(--bd)',opacity:u.is_active?1:0.55}}>
    <div style={{width:34,height:34,borderRadius:'50%',background:(roleColor[u.role]||'var(--t3)'),color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:14,flexShrink:0}}>{(u.full_name||u.username||'?').slice(0,1).toUpperCase()}</div>
    <div style={{flex:1,minWidth:0}}>
      <div style={{fontWeight:600,color:'var(--t1)',fontSize:13}}>{u.full_name||u.username}</div>
      <div style={{fontSize:11,color:'var(--t3)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{u.username}{u.email?(' · '+u.email):''}{u.mobile_e164?(' · '+u.mobile_e164):''}</div>
    </div>
    <select value={u.role} onChange={e=>setRole(u.id,e.target.value)} style={{...inp,padding:'6px 8px',fontSize:12}}>
      <option value="bde">BDE</option><option value="manager">Manager</option><option value="admin">Admin</option><option value="user">user</option>
    </select>
    <span style={{fontSize:11,fontWeight:700,color:u.is_active?'var(--green)':'#EF4444',minWidth:54,textAlign:'center'}}>{u.is_active?'Active':'Disabled'}</span>
    <button onClick={()=>toggle(u)} style={{padding:'6px 11px',background:'var(--sf)',color:'var(--t2)',border:'1px solid var(--bd)',borderRadius:7,cursor:'pointer',fontSize:12}}>{u.is_active?'Disable':'Enable'}</button>
    <button onClick={()=>resetPw(u.id)} style={{padding:'6px 11px',background:'var(--sf)',color:'var(--t2)',border:'1px solid var(--bd)',borderRadius:7,cursor:'pointer',fontSize:12}}>Reset password</button>
  </div>);

  return(<div style={{padding:'4px 2px',paddingBottom:24}}>
    <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:12,flexWrap:'wrap'}}>
      <div style={{color:'var(--t1)',fontWeight:700}}>{users.length} users</div>
      <div style={{color:'var(--t3)',fontSize:13}}>{activeCount} active · {byRole('bde').length} BDEs · {byRole('manager').length} managers</div>
      <button onClick={()=>setShowAdd(s=>!s)} style={{marginLeft:'auto',padding:'9px 16px',background:showAdd?'var(--sf)':'var(--green)',color:showAdd?'var(--t1)':'#fff',border:'1px solid '+(showAdd?'var(--bd)':'var(--green)'),borderRadius:8,fontWeight:700,cursor:'pointer',fontSize:13}}>{showAdd?'Cancel':'+ Add user'}</button>
    </div>
    {msg&&<div className="card" style={{padding:'9px 14px',marginBottom:12,color:'var(--t1)',fontSize:13}}>{msg}</div>}
    {showAdd&&<div className="card" style={{padding:18,marginBottom:14}}>
      <div style={{fontWeight:700,color:'var(--t1)',marginBottom:10}}>New user</div>
      <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
        <input style={inp} placeholder="Username" value={nu.username} onChange={e=>setNu(m=>({...m,username:e.target.value}))}/>
        <input style={inp} placeholder="Full name" value={nu.full_name} onChange={e=>setNu(m=>({...m,full_name:e.target.value}))}/>
        <select style={inp} value={nu.role} onChange={e=>setNu(m=>({...m,role:e.target.value}))}>
          <option value="bde">BDE</option><option value="manager">Manager</option><option value="admin">Admin</option>
        </select>
        <input style={inp} type="password" placeholder="Password" value={nu.password} onChange={e=>setNu(m=>({...m,password:e.target.value}))}/>
        <button onClick={create} style={{padding:'10px 18px',background:'var(--green)',color:'#fff',border:0,borderRadius:8,fontWeight:700,cursor:'pointer'}}>Create user</button>
      </div>
    </div>}
    {GROUPS.map(g=>{ const members=byRole(g.key); if(!members.length) return null; const isC=collapsed[g.key];
      return(<div key={g.key} className="card" style={{padding:'14px 18px',marginBottom:12}}>
        <div style={{display:'flex',alignItems:'center',cursor:'pointer'}} onClick={()=>setCollapsed(c=>({...c,[g.key]:!c[g.key]}))}>
          <span style={{width:9,height:9,borderRadius:'50%',background:roleColor[g.key],marginRight:9}}></span>
          <div style={{fontWeight:700,color:'var(--t1)'}}>{g.label}</div>
          <div style={{color:'var(--t3)',fontSize:12,marginLeft:8}}>({members.length})</div>
          <span style={{marginLeft:'auto',color:'var(--t3)'}}>{isC?'▸':'▾'}</span>
        </div>
        {!isC&&<div style={{marginTop:8}}>{members.map(userRow)}</div>}
      </div>);
    })}
  </div>);
}

function BdeLeadsView({user,onOpenLead}){
  const [rows,setRows]=useState([]); const [total,setTotal]=useState(0);
  const [page,setPage]=useState(1); const pageSize=50; const [msg,setMsg]=useState('');
  const load=async()=>{ const d=await apiJSON('/api/db/master-leads?page='+page+'&page_size='+pageSize);
    if(d&&d.rows){ setRows(d.rows); setTotal(d.total||0); } };
  useEffect(()=>{load();},[page]);
  const setAlloc=async(id,target)=>{ const d=await apiJSON('/api/leads/'+id+'/alloc-status',{method:'POST',body:JSON.stringify({status:target})});
    if(d&&d.ok){ setMsg(lfId(id)+' → '+target); load(); } else setMsg('Error'); };
  const toggleContacted=(r)=>setAlloc(r.id, r.alloc_status==='contacted'?'assigned':'contacted');
  const toggleSecured=(r)=>setAlloc(r.id, r.alloc_status==='secured'?'contacted':'secured');
  const stColor={secured:'var(--green)',contacted:'var(--amber)',assigned:'var(--blue)'};
  const th={textAlign:'left',padding:'8px 10px',color:'var(--t3)',fontSize:11,textTransform:'uppercase',borderBottom:'1px solid var(--bd)'};
  const td={padding:'8px 10px',borderBottom:'1px solid var(--bd)',color:'var(--t1)',fontSize:13};
  return(<div style={{padding:'4px 2px'}}>
    <div className="card" style={{padding:'12px 16px',marginBottom:12}}>
      <span style={{color:'var(--t1)',fontWeight:700}}>My leads</span>
      <span style={{color:'var(--t3)',marginLeft:10}}>{total} allocated to you</span>
      {msg&&<span style={{color:'var(--green)',marginLeft:12,fontSize:13}}>{msg}</span>}
    </div>
    <div className="card" style={{padding:14}}>
      <table style={{width:'100%',borderCollapse:'collapse'}}>
        <thead><tr><th style={th}></th><th style={th}>Lead</th><th style={th}>Company</th><th style={th}>Domain</th><th style={th}>Phone</th><th style={th}>Email</th><th style={th}>Status</th><th style={th}>Action</th></tr></thead>
        <tbody>{rows.map(r=>(
          <tr key={r.id}>
            <td style={td}><button title="Open full lead page" onClick={()=>onOpenLead&&onOpenLead(r.id)} style={{width:24,height:24,borderRadius:6,border:'1px solid var(--bd)',background:'var(--blue)',color:'#fff',cursor:'pointer',fontWeight:700,lineHeight:'1',fontSize:15}}>+</button></td>
            <td style={td}>{lfId(r.id)}</td>
            <td style={td}>{r.company_name||r.display_name||'—'}</td>
            <td style={td}>{r.root_domain}</td>
            <td style={td}>{r.phone_e164||'—'}</td>
            <td style={td}>{r.primary_email||'—'}</td>
            <td style={td}><span style={{color:stColor[r.alloc_status]||'var(--t3)',fontWeight:600,textTransform:'capitalize'}}>{r.alloc_status||'assigned'}</span></td>
            <td style={td}><div style={{display:'flex',gap:6}}>
              <button onClick={()=>toggleContacted(r)} title={r.alloc_status==='contacted'?'Click to undo':'Mark contacted'} style={{padding:'5px 11px',border:'1px solid var(--amber)',background:r.alloc_status==='contacted'?'var(--amber)':'transparent',color:r.alloc_status==='contacted'?'#fff':'var(--amber)',borderRadius:6,cursor:'pointer',fontSize:12,fontWeight:700}}>{r.alloc_status==='contacted'?'✓ Contacted':'Contacted'}</button>
              <button onClick={()=>toggleSecured(r)} title={r.alloc_status==='secured'?'Click to undo':'Deal won'} style={{padding:'5px 11px',border:'1px solid var(--green)',background:r.alloc_status==='secured'?'var(--green)':'transparent',color:r.alloc_status==='secured'?'#fff':'var(--green)',borderRadius:6,cursor:'pointer',fontSize:12,fontWeight:700}}>{r.alloc_status==='secured'?'✓ Secured':'Secured'}</button>
            </div></td>
          </tr>))}
          {!rows.length&&<tr><td style={td} colSpan={8}>No leads allocated to you yet.</td></tr>}
        </tbody>
      </table>
      {total>pageSize&&<div style={{marginTop:12,display:'flex',gap:8,alignItems:'center'}}>
        <button disabled={page<=1} onClick={()=>setPage(p=>p-1)} style={{padding:'6px 12px'}}>Prev</button>
        <span style={{color:'var(--t3)'}}>Page {page} / {Math.max(1,Math.ceil(total/pageSize))}</span>
        <button disabled={page>=Math.ceil(total/pageSize)} onClick={()=>setPage(p=>p+1)} style={{padding:'6px 12px'}}>Next</button>
      </div>}
    </div>
  </div>);
}

function _apolloRevenue(a){
  if(!a) return 'N/A';
  return a.annual_revenue_printed || a.organization_revenue_printed
    || (a.annual_revenue!=null?('$'+Number(a.annual_revenue).toLocaleString('en-US')):'')
    || (a.estimated_annual_revenue!=null?('$'+Number(a.estimated_annual_revenue).toLocaleString('en-US')):'')
    || 'N/A';
}
function LDField({label,value,mono}){
  if(value===undefined||value===null||value===''||(Array.isArray(value)&&!value.length)) return null;
  return(<div style={{display:'flex',padding:'6px 0',borderBottom:'1px solid var(--bd)'}}>
    <div style={{width:170,color:'var(--t3)',fontSize:12,flexShrink:0}}>{label}</div>
    <div style={{color:'var(--t1)',fontSize:13,fontFamily:mono?'var(--mono)':'inherit',wordBreak:'break-word'}}>
      {Array.isArray(value)?value.join(', '):String(value)}</div>
  </div>);
}
function LDSection({title,children,accent}){
  return(<div className="card" style={{padding:18,marginBottom:14}}>
    <div style={{fontWeight:700,color:accent||'var(--t1)',marginBottom:10,fontSize:14,
      borderBottom:'2px solid '+(accent||'var(--blue)'),paddingBottom:6,display:'inline-block'}}>{title}</div>
    {children}
  </div>);
}
/* Coerce ANY value (string / number / object / array) into displayable text, so
   AI/Apollo fields that arrive as objects (e.g. objections as {objection,rebuttal})
   can never crash a render with "Objects are not valid as a React child". */
function _txt(x){
  if(x===null||x===undefined) return '';
  if(typeof x==='string'||typeof x==='number'||typeof x==='boolean') return String(x);
  if(Array.isArray(x)) return x.map(_txt).filter(Boolean).join(', ');
  if(typeof x==='object'){
    if(x.objection||x.rebuttal) return [x.objection,x.rebuttal].filter(Boolean).map(_txt).join(' — ');
    if(x.point||x.text||x.title||x.name) return _txt(x.point||x.text||x.title||x.name);
    const vals=Object.values(x).filter(v=>typeof v==='string'||typeof v==='number');
    if(vals.length) return vals.map(String).join(' — ');
    try{ return JSON.stringify(x); }catch(e){ return String(x); }
  }
  return String(x);
}
function LDChips({items,color}){
  if(!items||!items.length) return null;
  return(<div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:4}}>
    {items.map((x,i)=>(<span key={i} style={{background:'var(--bg)',border:'1px solid var(--bd)',
      color:color||'var(--t2)',borderRadius:20,padding:'3px 11px',fontSize:12}}>{_txt(x)}</span>))}
  </div>);
}
/* Catches any render error in a view and shows a message instead of blanking the
   whole SPA. Keyed by nav so it resets when you navigate elsewhere. */
class ErrorBoundary extends React.Component{
  constructor(p){ super(p); this.state={err:null}; }
  static getDerivedStateFromError(err){ return {err}; }
  componentDidCatch(err,info){ try{ console.error('View render error:',err,info); }catch(e){} }
  render(){
    if(this.state.err) return(<div style={{padding:24}}>
      <div style={{color:'#EF4444',fontWeight:700,fontSize:15,marginBottom:8}}>This view hit a rendering error.</div>
      <div style={{color:'var(--t3)',fontSize:13,marginBottom:14,whiteSpace:'pre-wrap',maxWidth:700}}>{String((this.state.err&&this.state.err.message)||this.state.err)}</div>
      <button onClick={()=>this.setState({err:null})} style={{padding:'8px 16px',background:'var(--blue)',color:'#fff',border:0,borderRadius:8,fontWeight:700,cursor:'pointer'}}>Retry</button>
    </div>);
    return this.props.children;
  }
}
