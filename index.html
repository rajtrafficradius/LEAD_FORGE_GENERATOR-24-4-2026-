    creditsSnapshotRef.current=liveCreditsDetails;
    setCreditsUsedThisRun(null);
    // 2026-05-18 (round 2): reset the live in-run counters card to zero so
    // it doesn't show stale numbers from the previous run.
    setLiveJob(null);
    // Phase 2 (2026-05-15): logs are NO LONGER wiped between runs — the user
    // explicitly wants persistence across runs. We append a divider line so
    // the boundary is visible. The previous behaviour (setLogs([])) cleared
    // valuable diagnostic history every time a new scan started.
    setLoading(true);setPhase(0);setProgress(0);
    setLogs(prev=>{
      const ts=new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      const divider={ts,tag:'sys',msg:'═══════════ New run started ═══════════'};
      return prev&&prev.length?[...prev,divider]:[divider];
    });
    setNav('generate');
    setCounts({total:0,emails:0,phones:0,tier1:0});
    setHasResults(false);setTopCsvText('');setPartialCsvUrl('');setRealLeads([]);setRunOutcome(null);
    const base=(typeof window!=='undefined'&&window.location.origin)||'';
    const isCity=tab==='cities';
    const endpoint=isCity?'/generate-city':'/generate';
    // Map UI cityTier label → backend tier code expected by /generate-city.
    const _tierMap={'All city tiers':'all','Tier 1 cities':'tier_1','Tier 2 cities':'tier_2','Tier 3 cities':'tier_3'};
    // Guard against empty industry pick — backend expects a non-empty key.
    if(!isCity&&(!industry||industry==='Select an industry')){
      setLoading(false);
      setToast({t:'Pick an industry',m:'Choose an industry from the dropdown to start a run.'});
      return;
    }
    const payload=isCity?{
      // auState is already an AU state code (NSW/VIC/...) or 'AUSTRALIA'.
      state_code:auState||'AUSTRALIA',
      tier:_tierMap[cityTier]||'tier_1',
      city:city||'all',
      min_volume:parseInt(minSearch)||100,
      max_leads:parseInt(maxLeads)||0,
      enrichment:enrich,country:'AU',n_workers:parseInt(nWorkers)||4,
      disable_semrush:serpOnly,
      credit_saver:!regularMode,
    }:{
      industry:industry,
      // indCountry is already a backend code (AU/USA/UK/India).
      country:indCountry||'AU',
      min_volume:parseInt(minSearch)||100,
      min_cpc:parseFloat(minCpc)||0.05,
      max_leads:parseInt(maxLeads)||0,
      enrichment:enrich,
      disable_semrush:serpOnly,
      credit_saver:!regularMode,
    };
    let jobId='';
    try{
      const r=await fetch(base+endpoint,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        credentials:'same-origin',
        body:JSON.stringify(payload),
      });
      if(r.status===401){window.location.href='/login';return;}
      const data=await r.json();
      if(!r.ok||data.error){
        setLoading(false);
        setToast({t:'Error',m:data.error||('HTTP '+r.status)});
        return;
      }
      jobId=data.job_id;setCurrentJobId(jobId);
    }catch(e){
      setLoading(false);
      setToast({t:'Network error',m:e.message||'Could not reach server'});
      return;
    }
    // Poll status. Each tick: append new_logs, update progress + valid lead
    // count, watch for state transitions (done / cancelled / error).
    const pollId=setInterval(async ()=>{
      try{
        const r=await fetch(base+'/status/'+jobId,{credentials:'same-origin'});
        if(r.status===401){clearInterval(pollId);window.location.href='/login';return;}
        if(!r.ok)return;
        const s=await r.json();
        if(typeof s.progress==='number'){
          setProgress(s.progress);
          // Phase 2 (2026-05-06): map server progress% to InlineProgress's
          // 7-step indicator. STEPS has ~7 items; phase index = floor(p/14).
          setPhase(Math.min(6,Math.floor((s.progress||0)/14)));
        }
        if(Array.isArray(s.new_logs)&&s.new_logs.length){
          const ts=new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
          setLogs(prev=>[...prev,...s.new_logs.map(line=>{
            // Parse leading [TAG] from V5 log lines and map to the 7 colors
            // InlineProgress styles. Falls back to 'sys' for plain output.
            const txt=String(line||'');
            const m=txt.match(/^\s*\[([^\]]+)\]\s*(.+)$/);
            let tag='sys',msg=txt;
            if(m){msg=m[2]; const k=m[1].toLowerCase();
              if(/phase/.test(k))tag='scan';
              else if(/valid|done|complete|success|ok/.test(k))tag='ok';
              else if(/error|fail/.test(k))tag='err';
              else if(/apollo|lusha|hunter|enrich|email|phone/.test(k))tag='enrich';
              else if(/score|tier/.test(k))tag='score';
              else if(/find|discover|domain|seed/.test(k))tag='find';
              else tag='sys';
            }
            return{ts,tag,msg};
          })]);
        }
        if(typeof s.valid_leads_in_progress==='number'){
          setCounts(c=>({...c,total:s.valid_leads_in_progress}));
        }
        // 2026-05-18 (round 2): stream the in-run API counters into the
        // InlineProgress live panel. `s.live` is populated by /status while
        // the pipeline is still running; absence = pipeline not attached yet.
        if(s.live&&typeof s.live==='object'){
          setLiveJob(s.live);
        }
        if(s.state==='done'){
          clearInterval(pollId);
          setLoading(false);setProgress(100);setHasResults(true);
          // 2026-05-21: capture the REAL leads from /status payload.
          // Each lead dict from V5 has: name, domain, company, role, phone,
          // email, source, _domain_source, _google_intent, _silent_scope_apollo,
          // _direct_phone, etc. The table-row mapper below maps these to
          // the column shape it expects.
          setRealLeads(Array.isArray(s.leads)?s.leads:[]);
          const sm=s.summary||{};
          // Phase 2 (2026-05-07): use explicit ternary instead of mixing
          // ?? with ||/&& at the top level — that's a SyntaxError in JS and
          // prevents Babel from transpiling the entire script.
          const _fallback=(v,fb)=>(v===null||v===undefined?fb:v);
          setStats({
            paid:String(_fallback(sm.paid_leads,'—')),
            organic:String(_fallback(sm.organic_leads,'—')),
            total:String(_fallback(sm.total_leads,(s.leads&&s.leads.length)||'—')),
            phone:String(_fallback(sm.with_phone,'—')),
            email:String(_fallback(sm.with_email,'—')),
            personal:String(_fallback(sm.personal_emails,'—')),
            direct:String(_fallback(sm.direct_phones,'—')),
            semrush:String(_fallback(sm.semrush_tokens,'—')),
            apollo:String(_fallback(sm.apollo_tokens,'—')),
            lusha:String(_fallback(sm.lusha_tokens,'—')),
          });
          if(s.top_csv)setTopCsvText(s.top_csv);
          // 2026-05-25: persistent post-run banner (toast auto-dismisses in 4s).
          // Reads `empty_result` from summary so the banner can distinguish
          // "ran successfully but found 0 leads" from "real success with leads".
          (function _setOutcome(){
            const _n=Number(sm.total_leads||0)||(Array.isArray(s.leads)?s.leads.length:0);
            const _empty=Boolean(sm.empty_result)||_n===0;
            setRunOutcome({
              kind: _empty?'empty':'success',
              leadsCount:_n,
              reason: _empty?(sm.empty_result_reason||'Pipeline finished but produced 0 leads. See log feed for [FUNNEL]/[KEY-HEALTH] lines.'):'',
              partialUrl: null,
            });
          })();
          setToast({t:'Scan Complete',m:((sm.total_leads??0)+' leads found')});
          // Phase 2 (2026-05-15): credit-usage diff. Force-refresh /api/credits
          // (bypasses the 60s cache), then subtract from the pre-run snapshot
          // so the user sees the exact credit cost of THIS run, broken out by
          // pool (Apollo export / phone / email / total, plus SEMrush + Lusha)
          // and divided by total leads for the per-lead averages they asked for.
          try{
            const after=(refreshCredits?await refreshCredits():null);
            const before=creditsSnapshotRef.current;
            const _num=v=>(typeof v==='number'&&isFinite(v)?v:null);
            const _diff=(b,a)=>{const bn=_num(b),an=_num(a);return(bn!==null&&an!==null)?Math.max(0,bn-an):null;};
            const bA=(before&&before.services&&before.services.apollo)||{};
            const aA=(after&&after.services&&after.services.apollo)||{};
            const bS=(before&&before.services&&before.services.semrush)||{};
            const aS=(after&&after.services&&after.services.semrush)||{};
            const bL=(before&&before.services&&before.services.lusha)||{};
            const aL=(after&&after.services&&after.services.lusha)||{};
            const leadsCount=Number(_fallback(sm.total_leads,(s.leads&&s.leads.length)||0))||0;
            const _per=v=>(v!==null&&leadsCount>0?(v/leadsCount):null);
            // 2026-05-18: pull SEMrush per-phase unit breakdown from
            // s.summary (populated by V5.py /generate(-city) summary build).
            // Falls back gracefully when the backend payload is missing
            // any of these fields (older deploys etc.).
            const _semUnits=_num(sm.semrush_units_used);
            const _semBudget=_num(sm.semrush_unit_budget);
            const _semByPhase=(sm.semrush_units_by_phase&&typeof sm.semrush_units_by_phase==='object')?sm.semrush_units_by_phase:{};
            const _semSkipped=_num(sm.semrush_calls_skipped)||0;
            setCreditsUsedThisRun({
              leads:leadsCount,
              apollo_total:_diff(bA.remaining,aA.remaining),
              apollo_export:_diff(bA.export_remaining,aA.export_remaining),
              apollo_phone:_diff(bA.phone_remaining,aA.phone_remaining),
              apollo_email:_diff(bA.email_remaining,aA.email_remaining),
              semrush_total:_diff(bS.remaining,aS.remaining),
              lusha_total:_diff(bL.remaining,aL.remaining),
              per_lead:{
                apollo_total:_per(_diff(bA.remaining,aA.remaining)),
                apollo_export:_per(_diff(bA.export_remaining,aA.export_remaining)),
                apollo_phone:_per(_diff(bA.phone_remaining,aA.phone_remaining)),
                apollo_email:_per(_diff(bA.email_remaining,aA.email_remaining)),
                semrush_total:_per(_diff(bS.remaining,aS.remaining)),
                lusha_total:_per(_diff(bL.remaining,aL.remaining)),
              },
              // Backend-reported SEMrush telemetry (canonical, includes the
              // weighted unit cost the budget guard tracks against — usually
              // very close to the (before-after) SEMrush diff, but breaks it
              // out per pipeline phase so the user can see where credits went).
              semrush_units_used:_semUnits,
              semrush_unit_budget:_semBudget,
              semrush_units_per_lead:(_semUnits!==null&&leadsCount>0?(_semUnits/leadsCount):null),
              semrush_units_by_phase:_semByPhase,
              semrush_calls_skipped:_semSkipped,
            });
          }catch(_e){/* diff is best-effort; absence is non-fatal */}
        }else if(s.state==='cancelled'||s.state==='error'){
          clearInterval(pollId);
          setLoading(false);
          // 2026-05-25: surface the outcome as a persistent banner AND set
          // hasResults so the right column doesn't fall back to the empty
          // "What you'll get" home view. Without this, an error run looked
          // identical to "user hasn't clicked Generate yet".
          setHasResults(true);
          if(s.partial_csv_available){
            setPartialCsvUrl(base+'/download-partial/'+jobId);
          }
          const _partial=s.partial_csv_available?(base+'/download-partial/'+jobId):null;
          const msg=s.state==='cancelled'
            ?('Run cancelled'+(s.partial_csv_available?' — partial CSV available':''))
            :('Pipeline error: '+(s.error||'unknown')+(s.partial_csv_available?' — partial CSV available':''));
          setRunOutcome({
            kind:s.state==='cancelled'?'cancelled':'error',
            leadsCount:0,
            reason:msg,
            partialUrl:_partial,
          });
          setToast({t:s.state==='cancelled'?'Cancelled':'Error',m:msg});
        }
      }catch(e){/* keep polling on transient errors */}
    },500);   /* 2026-05-18 (round 2): 500ms poll for live counter updates */
    timers.current.push(pollId);
  };

  // Cancel the running job.
  const cancelGeneration=async ()=>{
    try{
      const base=(typeof window!=='undefined'&&window.location.origin)||'';
      await fetch(base+'/cancel',{method:'POST',credentials:'same-origin'});
    }catch(e){/* silent */}
  };

  // Fetch the industries dropdown list once at mount.
  useEffect(()=>{
    const base=(typeof window!=='undefined'&&window.location.origin)||'';
    fetch(base+'/industries',{credentials:'same-origin'}).then(r=>{
      if(r.status===401){window.location.href='/login';return null;}
      if(!r.ok)return null;
      return r.json();
    }).then(data=>{if(data&&Array.isArray(data.industries))setIndustries(data.industries)}).catch(()=>{});
  },[]);

  // Fetch AU state/tier/city dataset once at mount. Drives the city-mode
  // dropdowns. Shape: {australia:{tier_1:[],tier_2:[],tier_3:[]}, states:[{code,name,tier_1,tier_2,tier_3}]}
  useEffect(()=>{
    const base=(typeof window!=='undefined'&&window.location.origin)||'';
    fetch(base+'/api/au-cities',{credentials:'same-origin'}).then(r=>{
      if(r.status===401){window.location.href='/login';return null;}
      if(!r.ok)return null;
      return r.json();
    }).then(data=>{if(data&&!data.error)setAuCities(data)}).catch(()=>{});
  },[]);

  const VIEW_TITLES={generate:{title:<>Lead <em>Generation</em> Engine</>,sub:'Configure your search and generate qualified leads'},database:{title:<>Railway <em>Database</em></>,sub:'Live MySQL — run_history, master_leads, and per-run statistics'},analytics:{title:<>Analytics <em>& Insights</em></>,sub:'Performance overview across all runs'},heatmap:{title:<>Geographic <em>Heatmap</em></>,sub:'Ballarat suburb-level lead density visualization'},history:{title:<>Run <em>History</em></>,sub:'All previous lead generation runs'},intelligence:{title:<>AI <em>Intelligence</em></>,sub:'Master database · ML keyword learning · self-expanding dictionary'},pipeline:{title:<>Lead <em>Pipeline</em></>,sub:'Manage and track leads through your sales process'},schedule:{title:<>Scheduled <em>Runs</em></>,sub:'Automate your lead generation on a recurring schedule'},users:{title:<>Team <em>Management</em></>,sub:'Manage users, roles, and permissions'},settings:{title:<>Platform <em>Settings</em></>,sub:'API keys, preferences, and billing'}};
  const vt=VIEW_TITLES[nav]||{title:nav,sub:''};

  return(<>
    {showSplash&&<Splash onDone={()=>setShowSplash(false)} theme={theme}/>}
    <Sidebar nav={nav} setNav={setNav} srvUrl={srvUrl} setSrvUrl={setSrvUrl} onConnect={()=>setToast({t:'Connected',m:'Railway endpoint verified'})} credits={liveCredits} lastDrain={liveCreditsLast} details={liveCreditsDetails}/>

    <main className="main">
      <div className="topbar">
        <div className="tb-left">
          <div className="tb-title">{vt.title}</div>
          <div className="tb-sub">{vt.sub}</div>
        </div>
        <div className="tb-right">
          <button className="demo-btn" onClick={runGeneration}><span className="demo-dot"></span>Demo Run</button>
          <div className="tb-clock">{clock} AEST</div>
          <button className="theme-btn" onClick={()=>setTheme(t=>t==='dark'?'light':'dark')}><Icon name={theme==='dark'?'sun':'moon'} size={14} style={{marginRight:6,verticalAlign:-2}}/>{theme==='dark'?'Light Mode':'Dark Mode'}</button>
          <div className="tb-conn"><span className="tb-cdot"></span>Connected</div>
        </div>
      </div>

      {nav==='generate'&&<GenerateView tab={tab} setTab={setTab} stats={stats} hasResults={hasResults} onGenerate={runGeneration} onCancel={cancelGeneration} loading={loading} auState={auState} setAuState={setAuState} cityTier={cityTier} setCityTier={setCityTier} city={city} setCity={setCity} industry={industry} setIndustry={setIndustry} indCountry={indCountry} setIndCountry={setIndCountry} maxLeads={maxLeads} setMaxLeads={setMaxLeads} minSearch={minSearch} setMinSearch={setMinSearch} minCpc={minCpc} setMinCpc={setMinCpc} enrich={enrich} setEnrich={setEnrich} serpOnly={serpOnly} setSerpOnly={setSerpOnly} nWorkers={nWorkers} setNWorkers={setNWorkers} onNav={setNav} phase={phase} logs={logs} progress={progress} counts={counts} theme={theme} industries={industries} auCities={auCities} topCsvText={topCsvText} partialCsvUrl={partialCsvUrl} liveCreditsDetails={liveCreditsDetails} creditsUsedThisRun={creditsUsedThisRun} liveJob={liveJob} realLeads={realLeads} runOutcome={runOutcome}/>}
      {nav==='database'&&<DatabaseView/>}
      {nav==='cost'&&<CostView/>}
      {/* 2026-06-04: mock placeholder views removed (Analytics/Heatmap/
          History/AI Intelligence/Pipeline/Schedule/Users/Settings). */}
    </main>

    {/* Drawer hidden — progress shown inline on Generate view */}

    {/* 2026-06-04: fake status ticker removed (it showed hardcoded untrue
        claims like "SerpAPI unlimited" / "SEMrush 50,000 searches"). Live
        credit numbers already appear in the Generate view's credit panel. */}

    {!drawerOpen&&<LiveActivityFeed/>}
    {/* 2026-06-09: bottom-of-page SerpAPI mode toggle. Default OFF = credit-
        saving mode (run-wide SerpAPI cap ≈14 calls/lead). ON = regular thorough
        mode (uses many more SerpAPI credits, the old behaviour). */}
    <div style={{position:'fixed',left:0,right:0,bottom:0,zIndex:300,display:'flex',
                 alignItems:'center',justifyContent:'center',gap:12,padding:'7px 14px',
                 background:'var(--sf)',borderTop:'1px solid var(--bd)',fontSize:11,
                 color:'var(--t2)',fontFamily:'var(--mono)'}}>
      <span style={{letterSpacing:'1px',textTransform:'uppercase',color:'var(--t3)'}}>SerpAPI mode</span>
      <span style={{color:!regularMode?'var(--green)':'var(--t3)',fontWeight:!regularMode?700:400}}>Credit-saving (~5–15/lead)</span>
      <div className={'tog '+(regularMode?'on':'off')} style={{transform:'scale(0.8)'}} onClick={()=>setRegularMode(v=>!v)}><div className="tog-k"></div></div>
      <span style={{color:regularMode?'var(--amber)':'var(--t3)',fontWeight:regularMode?700:400}}>Regular / thorough (more credits)</span>
    </div>
    {toast&&<div className="toast"><div className="toast-ic">✓</div><div><div className="toast-title">{toast.t}</div><div className="toast-msg">{toast.m}</div></div></div>}
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
